# The workspace builds and tests a large number of real subprocesses. Keep
# compilation bounded by default on small VMs (WSL2 with 4 vCPUs); CI can opt
# into a different value per job. (The "tests restart the VM" symptom seen on
# WSL was a `/bin/kill -<pid>` parsing bug, now avoided by uze-platform's
# process module calling kill(2) directly, not build parallelism.)
#
# Test threads default to num_cpus::get(). Override with
# `RUST_TEST_THREADS=N` on hosts that need to cap it (e.g. memory-constrained WSL).
[build]
jobs = 2

# A Windows binary linked against the static C runtime runs on a machine
# with no Visual C++ redistributable installed, and the tests run what
# ships.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
