# What `cargo mutants` may change. `.github/workflows/mutants.yml` says how a
# run is started and the `mutation-audit` skill how to read one.

# A developer's tool, not the product: nothing in the suite calls it.
exclude_globs = ["src/bin/**"]

# Mutants read and found equivalent to the code they replace, so no test can
# catch them. Each needs its reason, and goes when the code it names changes.
exclude_re = [
  # FIRST_SHAPE is 1.
  'uze-document/src/lib\.rs.*replace first_shape -> u32 with 1$',
  # The default of an empty slice is that same empty slice.
  'uze-document/src/lib\.rs.*replace Shaped::ladder -> Ladder with Default::default\(\)$',
  # `read` has already returned when the shape equals SHAPE.
  'uze-document/src/lib\.rs.*replace > with >= in read$',
  # UnsupportedShape never carries found == expected: `read` returns first.
  'uze-document/src/lib\.rs.*replace < with <= in may_be_set_aside$',
  # A binding paired with itself has its own action, so it conflicts with nothing.
  'uze-keys/src/keymap\.rs.*replace \+ with \* in conflicts_in$',
  # Only one colour in 16 million sits exactly on 0.18, and either side suits it.
  'uze-theme/src/color\.rs.*replace > with >= in Rgb::is_light$',
  # Only the exit code a debug span records, for a process with no exit code.
  'uze-git/src/lib\.rs.*delete - in run_(to_completion|within)$',
  # Only how often the wait looks, not what it finds or how long it may take.
  'uze-git/src/lib\.rs.*replace \* with / in run_within$',
  # Inverts which processes are signalled; outside a PID namespace that ends what the CI runner runs.
  'uze-platform/src/probe\.rs.*replace == with != in platform::group_members$',
  # Inverts which processes are signalled; outside a PID namespace that ends what the CI runner runs.
  'uze-platform/src/process/unix\.rs.*replace == with != in end_strays$',
  # Landlock's rights here share no bit, so `^` of two of them is `|`.
  'uze-platform/src/confine/linux\.rs.*replace \| with \^ in (restrict_paths|writing)$',
  # BPF opcodes, the errno action and its errno share no bit, so `^` of them is `|`.
  'uze-platform/src/confine/linux/seccomp\.rs.*replace \| with \^( in (program|first_argument_one_of))?$',
  # LOCK_EX, LOCK_SH and LOCK_NB share no bit, so `^` of them is `|`.
  'uze-platform/src/lock\.rs.*replace \| with \^ in platform::try_lock$',
  # WEXITED, WNOWAIT and WNOHANG share no bit, so `^` of them is `|`.
  'uze-platform/src/process/unix\.rs.*replace \| with \^ in (wait_without_reaping|has_exited)$',
  # ICANON and ECHO share no bit, so `^` of them is `|`.
  'uze-platform/src/stdio\.rs.*replace \| with \^ in imp::ask_on$',
  # O_RDWR and O_NOCTTY share no bit, so `^` of them is `|`.
  'uze-platform/src/terminal\.rs.*replace \| with \^ in platform::Terminal::open$',
  # Only how often the deadline clock is read; the deadline still fires at a later sample.
  'uze-script/src/engine\.rs.*replace == with != in running$',
  # A deadline met to the nanosecond at a sampled operation; the next sample fires.
  'uze-script/src/engine\.rs.*replace > with >= in running$',
  # Only how often the regex cache empties; every answer is the same.
  'uze-script/src/primitives\.rs.*replace == with != in compiled$',
  # Dropping the struct drops the sender right after, which ends the thread the same way.
  'uze-script/src/resident\.rs.*replace <impl Drop for Resident>::drop with \(\)$',
  # Nothing calls IntegrationPort::hook_capabilities: entry plans read HOOKS directly.
  'uze-integrations/src/antigravity\.rs.*replace <impl IntegrationPort for AntigravityIntegration>::hook_capabilities -> .* with Default::default\(\)$',
  # Nothing calls IntegrationPort::context_accumulates.
  'uze-integrations/src/antigravity\.rs.*replace <impl IntegrationPort for AntigravityIntegration>::context_accumulates -> bool with false$',
  # Every IntegrationOwned receipt antigravity records is a build, matched first, or one of the two plugin kinds.
  'uze-integrations/src/antigravity\.rs.*replace match guard kind == PLUGIN_KIND \|\| kind == GENERATED_PLUGIN_KIND with true in <impl IntegrationPort for AntigravityIntegration>::(inspect|detach)_receipt$',
  # agent_exposure_plan's route comes from projection_route, which is only Native or Degraded.
  'uze-integrations/src/antigravity\.rs.*replace match guard plan\.route != CompatibilityRoute::Unsupported with true in AntigravityIntegration::plugin_agent_file$',
  # Text for the doctor read model only.
  'uze-integrations/src/antigravity\.rs.*replace <impl IntegrationPort for AntigravityIntegration>::description -> .* with (""|"xyzzy")$',
  # Read only by src/bin/uze-harness-matrix.rs for the docs table: an icon and a link.
  'uze-integrations/src/antigravity\.rs.*replace <impl IntegrationPort for AntigravityIntegration>::icon_path -> .* with (None|Some\(""\)|Some\("xyzzy"\))$',
  'uze-integrations/src/antigravity\.rs.*replace <impl IntegrationPort for AntigravityIntegration>::homepage -> .* with None$',
  # --- uze-integrations: Codex ---
  # Docs-site text and links, read only by the harness matrix generator.
  'uze-integrations/src/codex\.rs.*replace <impl IntegrationPort for CodexIntegration>::(description|icon_path|homepage) -> .* with .*$',
  # Nothing in the workspace reads IntegrationPort::reported_events yet.
  'uze-integrations/src/codex\.rs.*replace <impl IntegrationPort for CodexIntegration>::reported_events -> .* with .*$',
  # Nothing reads IntegrationPort::hook_capabilities; Codex hands HOOKS to generated_requirements itself.
  'uze-integrations/src/codex\.rs.*replace <impl IntegrationPort for CodexIntegration>::hook_capabilities -> .* with Default::default\(\)$',
  # Nothing reads IntegrationPort::context_accumulates.
  'uze-integrations/src/codex\.rs.*replace <impl IntegrationPort for CodexIntegration>::context_accumulates -> bool with false$',
  # inspect_receipt answers Blocked for a kind this guard refuses, so detach has returned before it.
  'uze-integrations/src/codex\.rs.*replace match guard marketplace::receipt_origin::<CodexMarketplace>\(kind\)\.is_some\(\) with true in <impl IntegrationPort for CodexIntegration>::detach_receipt$',
  # Two rollouts for one checkout in the same second: either is the newest, and read_dir order is unspecified.
  'uze-integrations/src/codex/session\.rs.*replace > with >= in observe$',
  # --- uze-integrations: OpenCode ---
  # No caller asks for hook capabilities through the port; the trait default stands in.
  'uze-integrations/src/opencode\.rs.*replace <impl IntegrationPort for OpenCodeIntegration>::hook_capabilities -> uze_core::hook::HookCapabilities with Default::default\(\)$',
  # Rules and build receipts are dispatched first; the plugin is OpenCode's only other IntegrationOwned receipt.
  'uze-integrations/src/opencode\.rs.*replace match guard kind == runtime_plugin::KIND with true in runtime_plugin_path$',
  # Detach reaches the removal only after inspection read the file; NotFound there is only a race.
  'uze-integrations/src/opencode\.rs.*replace match guard error\.kind\(\) == std::io::ErrorKind::NotFound with false in OpenCodeIntegration::detach_hook_bridge$',
  # A test helper: without Bun it already answers None, and CI asserts Bun is there.
  'uze-integrations/src/opencode\.rs.*(replace bun_for_tests -> Option<&.static str> with None|delete ! in bun_for_tests)$',
  # Unix always takes the official installer; only Windows reaches the distribution target.
  'uze-integrations/src/opencode/distribution\.rs.*delete match arm "linux" in target_for$',
  # The three shifted bytes share no bit, so `^` of them is `|`.
  'uze-integrations/src/opencode/distribution\.rs.*replace \| with \^ in base64$',
  # An empty object then renders `{  }`, the same JavaScript value as `{}`.
  'uze-integrations/src/opencode/runtime_plugin\.rs.*replace match guard entries\.is_empty\(\) with false in inline_literal$',
  # Either one quotes every key, and a quoted identifier key is the same JavaScript object.
  'uze-integrations/src/opencode/runtime_plugin\.rs.*replace \|\| with && in key_literal$',
  # The doctor and TUI blurb only.
  'uze-integrations/src/opencode\.rs.*replace <impl IntegrationPort for OpenCodeIntegration>::description -> &.static str with ',
  # Read only by the harness-matrix docs tool, which `uze-harness-matrix --check` guards.
  'uze-integrations/src/opencode\.rs.*replace <impl IntegrationPort for OpenCodeIntegration>::(icon_path|homepage) -> Option<&.static str> with ',
  # The label of the provisioning method in the setup report.
  'uze-integrations/src/opencode/provision\.rs.*replace Route::method -> &.static str with ',
  # Only the line width and indentation of the generated JavaScript; the value is the same.
  'uze-integrations/src/opencode/runtime_plugin\.rs.*replace (\+ with -|\* with \+|\* with /|\+ with \*) in literal$',
  # --- uze-integrations: shared ---
  # (posix) PosixWrapper::source is None only for a bridge target, and only wrapper targets plan a wrapper.
  'uze-integrations/src/hooks\.rs.*replace HookTarget::deliverable -> bool with true$',
  # Every wrapper dialect declares a transform for both shells; a bridge answers before.
  'uze-integrations/src/hooks/wrapper\.rs.*replace transforms_here -> bool with true$',
  # (posix) shell::script names the script itself, so the wrapper is already the first word.
  'uze-integrations/src/hooks/event_entry\.rs.*replace wrapper_position -> usize with 0$',
  # No caller uses IntegrationRegistry::all(); iter(), get() and into_inner() are used instead.
  'uze-integrations/src/registry\.rs.*replace IntegrationRegistry::all -> &\[Box<dyn IntegrationPort>\] with Vec::leak\(Vec::new\(\)\)$',
  # (posix) the shell family here is Posix, so the answer is already true.
  'uze-integrations/src/rules\.rs.*replace deliverable_here -> bool with true$',
  # Setup-owned receipts of one integration are the engine's or OpenCode's plugin; another event's entry never sits in this event's array.
  'uze-integrations/src/rules\.rs.*replace match guard kind == KIND && recorded_selector == selector with true in RulesTarget::attach$',
  'uze-integrations/src/rules\.rs.*replace && with \|\| in RulesTarget::attach$',
  # Only skips hashing: with the key unchanged (it holds the root) inspect keeps the build on Matched and Drifted alike. Anchored on the column, as the key's own `==` in publish are caught.
  'uze-integrations/src/shared/build\.rs:\d+:45: replace == with != in publish$',
  'uze-integrations/src/shared/build\.rs:\d+:56: delete ! in publish$',
  # With the same key the early return has already answered every build with files; one with none is Blocked, not Matched.
  'uze-integrations/src/shared/build\.rs.*replace match guard same_key with false in publish$',
  # Only the prune bound: remove_dir takes an empty directory inside the retired tree, which retire_unnamed_attachments sweeps anyway.
  'uze-integrations/src/shared/earlier\.rs.*replace skill_wrapper_root -> PathBuf with Default::default\(\)$',
  # The file was just seen as a regular file; NotFound needs a race with another remover.
  'uze-integrations/src/shared/json_config\.rs.*replace match guard error\.kind\(\) == std::io::ErrorKind::NotFound with false in write_object_or_remove_emptied$',
  # Both callers read the bridge just before removing it; NotFound needs a race.
  'uze-integrations/src/hooks/bridge\.rs.*replace match guard error\.kind\(\) == std::io::ErrorKind::NotFound with false in remove_bridge_file$',
  # Both dialects override recorded_root; the trait default is never called.
  'uze-integrations/src/shared/marketplace\.rs.*replace MarketplaceDialect::recorded_root -> Option<Option<PathBuf>> with Some\(',
  # Callers hand repoint only what registration() yields: the uze-store marketplace registration.
  'uze-integrations/src/shared/marketplace\.rs.*replace \|\| with && in repoint$',
  # A fast path: with nothing carried or no token the loop rewrites nothing either.
  'uze-integrations/src/shared/package_root\.rs.*replace \|\| with && in PluginRoot::carry_references$',
  # An answer exactly as old as the window, to the nanosecond, is not observable.
  'uze-integrations/src/shared/process\.rs.*replace < with <= in json$',
  # Test helper: -1 only marks a signal death, which no test expects.
  'uze-integrations/src/hooks/wrapper_tests\.rs.*delete - in run$',
  # Test helper: only removes a scratch checkout.
  'uze-integrations/src/rules/engine_tests\.rs.*replace <impl Drop for Checkout>::drop with \(\)$',
  # Test helper: it is the assertion, so emptying it always passes; its callers assert through it.
  'uze-integrations/src/rules/engine_tests\.rs.*replace engine_answers_the_glob_table with \(\)$',
  # Noise: swaps the two reasons only; the state is Matched either way.
  'uze-integrations/src/rules\.rs.*replace == with != in inspect_engine$',
  # Noise: only the exit code a tracing span records.
  'uze-integrations/src/shared/process\.rs.*delete - in run_captured$',
  # Nothing in the workspace asks a harness for these; hook delivery reads `HOOKS` itself.
  'uze-integrations/src/claude\.rs.*replace <impl IntegrationPort for ClaudeIntegration>::(hook_capabilities|reported_events|context_accumulates) -> ',
  # Only a package-level receipt reaches these, and Claude's only package-level IntegrationOwned receipts are its plugin kinds.
  'uze-integrations/src/claude\.rs.*replace match guard marketplace::receipt_origin::<ClaudeMarketplace>\(kind\)\.is_some\(\) with true in <impl IntegrationPort for ClaudeIntegration>::(unreadable|switched_off|switch_off)$',
  # Rules and build receipts match earlier arms; any other IntegrationOwned kind reads Blocked either way.
  'uze-integrations/src/claude\.rs.*replace match guard marketplace::receipt_origin::<ClaudeMarketplace>\(kind\)\.is_some\(\) with true in <impl IntegrationPort for ClaudeIntegration>::inspect_receipt$',
  # Reached only once inspect_receipt said Matched, which an unknown IntegrationOwned kind never is.
  'uze-integrations/src/claude\.rs.*replace match guard marketplace::receipt_origin::<ClaudeMarketplace>\(kind\)\.is_some\(\) with true in <impl IntegrationPort for ClaudeIntegration>::detach_receipt$',
  # Presentation text for the doctor; a test catching it would copy the literal.
  'uze-integrations/src/claude\.rs.*replace <impl IntegrationPort for ClaudeIntegration>::description -> .* with "xyzzy"$',
  # One level past DEEPEST, which no plugin layout reaches; the walk stays bounded either way.
  'uze-integrations/src/claude/plugin\.rs.*replace < with <= in collect_files$',
  # NotFound only when a concurrent projection takes the link out between the check and the removal.
  'uze-integrations/src/claude/runtime\.rs.*replace match guard error\.kind\(\) == std::io::ErrorKind::NotFound with false in project_resource_projection$',
  # Reached only when the link's rename fails, which an atomic rename in one directory does not on Unix.
  'uze-integrations/src/claude/runtime\.rs.*delete ! in project_resource_projection$',
  # Between transcripts modified in the same second the pick is the listing's order either way.
  'uze-integrations/src/claude/session\.rs.*replace > with >= in observe$',

  # uze-core delivery/
  # Each trait default below already returns exactly the value the mutant puts back.
  'uze-core/src/delivery/integration\.rs.*replace IntegrationPort::(install|republish_packages) -> Result<\(\)> with Ok\(\(\)\)$',
  'uze-core/src/delivery/integration\.rs.*replace IntegrationPort::(setup_artifacts|registrations|own_worktree_places|start_session_args|resume_session_args|first_turn_args|memory_source|collect_runtime|install_locations|unreadable|generated_requirements|held_back|withheld_paths) -> .* with vec!\[\]$',
  'uze-core/src/delivery/integration\.rs.*replace IntegrationPort::(withdraw_registrations|attach_rules_engine|package_executions) -> Result<.*> with Ok\(vec!\[\]\)$',
  'uze-core/src/delivery/integration\.rs.*replace IntegrationPort::(facts|aliases|reported_events|managed_environment|runtime_executable_aliases) -> .* with Vec::leak\(Vec::new\(\)\)$',
  'uze-core/src/delivery/integration\.rs.*replace IntegrationPort::(check_capability|hook_capabilities|runtime_contribution|flag_catalog|detect) -> .* with Default::default\(\)$',
  'uze-core/src/delivery/integration\.rs.*replace IntegrationPort::deliver_context -> .* with Ok\(Default::default\(\)\)$',
  # On Unix a label is its own file name, so both arms spell it alike; Windows runs the test that tells them apart.
  'uze-core/src/delivery/exposure\.rs.*delete match arm Self::VendorConfigEntry\{\.\.\} \| Self::HookConfigEntry\{\.\.\} in ManagedArtifact::is_named$',
  # Any error other than absence still ends in the write failing on the same path, with nothing written.
  'uze-core/src/delivery/exposure\.rs.*replace match guard error\.kind\(\) == std::io::ErrorKind::NotFound with true in (attach_generated_file|attach_generated_tree|attach_symlink)$',
  # The staging directory was just created beside the destination, so reading the destination fails only by absence.
  'uze-core/src/delivery/persistence\.rs.*replace match guard error\.kind\(\) == std::io::ErrorKind::NotFound with true in swap_in$',
  # Joining an absolute target onto the parent yields that same absolute target.
  'uze-core/src/delivery/persistence\.rs.*replace match guard target\.is_relative\(\) with true in resolve_symlinks$',
  # Whether a write waits for the disk shows only across a crash, which no test can stage.
  'uze-core/src/delivery/persistence\.rs.*replace == with != in replace_atomically$',
  # A descriptor just opened for writing fails a non-blocking lock only by its being held.
  'uze-core/src/delivery/persistence\.rs.*replace match guard error\.kind\(\) == std::io::ErrorKind::WouldBlock with true in MutationLock::acquire$',
  # Reaching the deadline at exactly the same instant is not observable.
  'uze-core/src/delivery/persistence\.rs.*replace < with <= in try_lock_exclusive_briefly$',
  # The bit set is already clear after the mask, so xor sets it as or does.
  'uze-core/src/delivery/session\.rs.*replace \| with \^ in format_uuid_v4$',
  # uze-core project/
  # Its one caller runs it on a directory it has just created, so the new paths never exist yet.
  'uze-core/src/project/earlier\.rs.*replace && with \|\| in carry_across_the_move$',
  # The project marker is at its first shape with no ladder: it has no rungs to drop.
  'uze-core/src/project/record\.rs.*replace rungs -> Vec<uze_document::earlier::Earlier> with vec!\[\]$',
  # A root block is dropped only when its key is the document's one root key, so every margin line but a comment opens it.
  'uze-core/src/project/manifest/edit\.rs.*replace opens_root_key -> bool with true$',
  # Whatever the guard lets through is text YAML reads as null, which the schema reads as the empty manifest anyway.
  'uze-core/src/project/manifest\.rs.*replace \|\| with && in parse$',
  # A placeholder holds no digit or a character no secret is made of, so the checks after it refuse it anyway.
  'uze-core/src/project/memory/credentials\.rs.*replace \|\| with && in looks_assigned$',
  # One line cannot be both a begin and an end marker, so an end never sits on its begin.
  'uze-core/src/project/text_region\.rs.*replace > with >= in scan$',
  # uze-core capability/
  # The stack is still far deeper than DEPTH_MAX levels of the parser need.
  'uze-core/src/capability/extension/bounded\.rs.*: replace \* with \+$',
  # A `/` outside a string, comment or `/-` is not KDL: the file is refused either way.
  'uze-core/src/capability/extension/bounded\.rs.*replace match guard self\.peek\(1\) == Some\(b.-.\) with true in Scanner<.a>::run$',
  # At the end of the bytes the loop steps past it and reports the same unclosed comment.
  'uze-core/src/capability/extension/bounded\.rs.*replace < with <= in Scanner<.a>::skip_block_comment$',
  # Reading more of a file past the bound changes only how much is read, not the refusal.
  'uze-core/src/capability/extension/loaded\.rs.*replace - with \+ in Loaded::read$',
  # A lone `/` is not KDL, so what completion offers after one is unspecified.
  'uze-core/src/capability/extension/locate\.rs.*replace match guard chars\.peek\(\)\.map\(\|\(_, next\)\| \*next\) == Some\(.-.\) with true in locate$',
  # NodeName is answered only when the statement has no name, so the node is None either way.
  'uze-core/src/capability/extension/locate\.rs.*delete match arm At::NodeName\{\.\.\} in Lexer::answer$',
  # A protocol equal to this build's is taken by the arm before.
  'uze-core/src/capability/extension/manifest\.rs.*replace > with >= in protocol$',
  # LATER is empty: no name is ever found in it.
  'uze-core/src/capability/extension/manifest\.rs.*replace == with != in unknown$',
  # A node whose property was refused already refuses the view; keeping it adds nothing.
  'uze-core/src/capability/extension/view\.rs.*replace &= with \|= in Compiler<., .>::node$',
  # uze-core package/
  # `looks_like_path` admits a `~` lead only when nothing or a separator follows it.
  'uze-core/src/package/acquisition/forge\.rs.*replace match guard rest\.is_empty\(\) \|\| rest\.starts_with\(std::path::is_separator\) with true in expand_home$',
  # Breaking early only stops reading a listing; the verdict is judged on the counts either way.
  'uze-core/src/package/acquisition/git\.rs.*replace TreeWeight::over_budget -> bool with false$',
  'uze-core/src/package/acquisition/git\.rs.*replace \|\| with && in TreeWeight::over_budget$',
  # Only the path of an `ls-tree` record holds a `/`, so where the split falls counts the same.
  'uze-core/src/package/acquisition/git\.rs.*replace == with != in record_depth$',
  # `components()` yields `.` only first in a relative path, and a path joined onto the checkout then stripped of it never starts with one.
  'uze-core/src/package/acquisition/git\.rs.*delete match arm std::path::Component::CurDir in lexically_within$',
  # A span field recording the exit code.
  'uze-core/src/package/acquisition/git\.rs.*delete - in spawn_git$',
  # The read buffer's size, which changes how many reads a listing takes and nothing else.
  'uze-core/src/package/acquisition/git\.rs.*replace \* with \+ in run_records$',
  # A stopped fold is already past its budget and breaks again; a `-z` listing leaves nothing pending.
  'uze-core/src/package/acquisition/git\.rs.*replace \|\| with && in run_records$',
  # Connection sharing saves handshakes; ssh opens its own connection when it cannot share one.
  'uze-core/src/package/acquisition/git\.rs.*replace multiplexing_directory -> Option<PathBuf> with (None|Some\(Default::default\(\)\))$',
  # The default subpath is the root.
  'uze-core/src/package/acquisition/marketplace\.rs.*replace MarketplaceSubpath::root -> Self with Default::default\(\)$',
  # An age equal to the window to the nanosecond.
  'uze-core/src/package/acquisition/mirror\.rs.*replace < with <= in ensure_for$',
  # Best effort: the checkout fetches whatever the prefetch did not bring.
  'uze-core/src/package/acquisition/mirror\.rs.*replace prefetch with \(\)$',
  'uze-core/src/package/acquisition/mirror\.rs.*replace != with == in prefetch$',
  # Equal minimums are one requirement, whichever spelling is kept.
  'uze-core/src/package/requirement\.rs.*replace > with >= in stricter$',
  # The search resumes on the closing backtick, which cannot start a `!` span.
  'uze-core/src/package/trust\.rs.*replace \+ with \* in inline_commands$',
  # `HostRecord` is at its first shape, so its ladder holds no rung.
  'uze-core/src/package/hosts\.rs.*replace rungs -> Vec<uze_document::earlier::Earlier> with vec!\[\]$',
  # uze-core machine/
  # With no project, a path still spelling `{project}` names no file, so the carry skips it all the same.
  'uze-core/src/machine/earlier\.rs.*replace match guard was\.to_string_lossy\(\)\.contains\(.\{.\) with false in carry_renamed$',
  # A run ended for a flood with stdout under its bound passed stderr's: the reader raises both together.
  'uze-core/src/machine/extension_program\.rs.*replace match guard stderr_over with true in run$',
  # `passthrough` is the default contribution.
  'uze-core/src/machine/harness_runtime\.rs.*replace HarnessRuntimeContribution::passthrough -> Self with Default::default\(\)$',
  # On Unix, where mutants run, no shell keeps a PATH apart from this process's.
  'uze-core/src/machine/harness_runtime\.rs.*replace resolve_for_a_new_shell -> Option<PathBuf> with None$',
  # A debug rendering: nothing reads it.
  'uze-core/src/machine/home/owned\.rs.*replace <impl std::fmt::Debug for OwnedPath>::fmt -> std::fmt::Result with Ok\(Default::default\(\)\)$',
  # A debug rendering: nothing reads it.
  'uze-core/src/machine/mcp\.rs.*replace <impl std::fmt::Debug for McpSession>::fmt -> std::fmt::Result with Ok\(Default::default\(\)\)$',
  # Trimming at the slack itself only drops early what the final trim to `cap` drops anyway.
  'uze-core/src/machine/subprocess\.rs.*replace > with >= in read_bounded$',
  # uze-application catalogue
  # An opaque path is neither superseded_dir nor a Directory, so without its arm it falls to `_ => {}` all the same.
  'uze-application/src/application/schema\.rs.*delete match arm Form::Opaque in Walk<._>::visit$',
  # Every retired disposable path is Generated or Remembered, tiers the walk skips, so none is found Retired today.
  'uze-application/src/application/schema\.rs.*delete match arm SchemaFinding::Retired in compare$',
  # Without the guard the placeholder is pushed as a literal segment, a path that never exists, so the answer is false all the same.
  'uze-application/src/application/schema\.rs.*replace match guard segment\.starts_with\(.\{.\) with false in Walk<._>::carried_beside$',
  # The age is measured in nanoseconds from a clock read inside the call: equality with the window cannot be arranged.
  'uze-application/src/application/marketplace_catalogue\.rs.*replace < with <= in MarketplaceCatalogues::refresh_stale$',
  # The label a collection report prints, read nowhere else.
  'uze-application/src/application/setup\.rs.*replace <impl Collectable for Retired>::name -> &.static str with ',
  'uze-application/src/application/marketplace_catalogue\.rs.*replace <impl super::Collectable for MarketplaceMirrors>::name -> &.static str with ',
  # Only spares a second fetch of a mirror already fetched in the same operation; what is installed is the same.
  'uze-application/src/application/marketplace\.rs.*delete ! in MarketplaceRequest::materialize_plugin$',
  # uze-application extensions
  # A collector's name only labels what the report says it removed.
  'uze-application/src/application/extensions/(compiled|mcp|program)\.rs.*Collectable for (CompiledViews<.*>|DeliveredPackages|ExtensionScratch|ExtensionPictures)>::name -> ',
  # A Debug rendering for a developer's eyes; nothing reads it.
  'uze-application/src/application/extensions/(mcp|reach|runner)\.rs.*std::fmt::Debug for (McpSessions|CheckoutReach|Running)>::fmt ',
  # Where secrets are kept is uze-workspace's wording, passed through.
  'uze-application/src/application/extensions/report\.rs.*replace secrets_kept_in -> ',
  # A test's own cleanup of its scratch directory.
  'uze-application/src/application/extensions/fetch\.rs.*replace tests::<impl Drop for World>::drop with \(\)$',
  # Two cached revisions never tie: each has its own path.
  'uze-application/src/application/extensions/compiled\.rs.*replace > with >= in pruned_compiled_cache$',
  # A loaded extension holds at most LOAD_BYTES in all, which is IMAGE_FILE_MAX,
  # so no file of it reaches the bound the slice cuts at.
  'uze-application/src/application/extensions/runner\.rs.*replace \+ with [*-] in ExtensionRunner::media$',
  # How long a listing is kept changes what a question costs, never its answer.
  'uze-application/src/application/extensions/runner\.rs.*replace < with (<=|==) in ExtensionRunner::installed$',
  # uze-application environment
  # The prefetch only warms mirrors: each read after it fetches what it lacks itself.
  'uze-application/src/application/project_environment\.rs.*replace Project<._>::prefetch_install_sources with \(\)$',
  # A collector's name labels the report; any non-empty label behaves the same.
  'uze-application/src/application/rules_engine\.rs.*replace <impl super::Collectable for RuleSessions>::name -> &.static str with "xyzzy"$',
  # uze-application services
  # A collector's name only labels its report; a distinct, non-empty one is tested.
  'uze-application/src/application/maintenance\.rs.*replace <impl Collectable for \w+(<.*>)?>::name -> &.static str with "xyzzy"$',
  # The test integration's capabilities already are the default.
  'uze-application/src/application/maintenance\.rs.*TestIntegration>::capabilities -> uze_core::router::HarnessCapabilities with Default::default\(\)$',
  # The wording of a warning a person reads; that it is given is the delivery's.
  'uze-application/src/application/services/tasks/delivery\.rs.*replace superseded_delivery -> String with ',
]
