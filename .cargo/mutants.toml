# What `cargo mutants` may change. `.github/workflows/mutants.yml` says how a
# run is started and the `mutation-audit` skill how to read one.

# A developer's tool, not the product: nothing in the suite calls it.
exclude_globs = ["src/bin/**"]

# Mutants read and found equivalent to the code they replace, so no test can
# catch them. Each needs its reason, and goes when the code it names changes.
exclude_re = [
  # FIRST_SHAPE is 1.
  'uze-document/src/lib\.rs.*replace first_shape -> u32 with 1$',
  # The default of an empty slice is that same empty slice.
  'uze-document/src/lib\.rs.*replace Shaped::ladder -> Ladder with Default::default\(\)$',
  # `read` has already returned when the shape equals SHAPE.
  'uze-document/src/lib\.rs.*replace > with >= in read$',
  # UnsupportedShape never carries found == expected: `read` returns first.
  'uze-document/src/lib\.rs.*replace < with <= in may_be_set_aside$',
  # A binding paired with itself has its own action, so it conflicts with nothing.
  'uze-keys/src/keymap\.rs.*replace \+ with \* in conflicts_in$',
  # Only one colour in 16 million sits exactly on 0.18, and either side suits it.
  'uze-theme/src/color\.rs.*replace > with >= in Rgb::is_light$',
  # Only the exit code a debug span records, for a process with no exit code.
  'uze-git/src/lib\.rs.*delete - in run_(to_completion|within)$',
  # Only how often the wait looks, not what it finds or how long it may take.
  'uze-git/src/lib\.rs.*replace \* with / in run_within$',
  # Inverts which processes are signalled; outside a PID namespace that ends what the CI runner runs.
  'uze-platform/src/probe\.rs.*replace == with != in platform::group_members$',
  # Inverts which processes are signalled; outside a PID namespace that ends what the CI runner runs.
  'uze-platform/src/process/unix\.rs.*replace == with != in end_strays$',
  # Landlock's rights here share no bit, so `^` of two of them is `|`.
  'uze-platform/src/confine/linux\.rs.*replace \| with \^ in (restrict_paths|writing)$',
  # BPF opcodes, the errno action and its errno share no bit, so `^` of them is `|`.
  'uze-platform/src/confine/linux/seccomp\.rs.*replace \| with \^( in (program|first_argument_one_of))?$',
  # LOCK_EX, LOCK_SH and LOCK_NB share no bit, so `^` of them is `|`.
  'uze-platform/src/lock\.rs.*replace \| with \^ in platform::try_lock$',
  # WEXITED, WNOWAIT and WNOHANG share no bit, so `^` of them is `|`.
  'uze-platform/src/process/unix\.rs.*replace \| with \^ in (wait_without_reaping|has_exited)$',
  # ICANON and ECHO share no bit, so `^` of them is `|`.
  'uze-platform/src/stdio\.rs.*replace \| with \^ in imp::ask_on$',
  # O_RDWR and O_NOCTTY share no bit, so `^` of them is `|`.
  'uze-platform/src/terminal\.rs.*replace \| with \^ in platform::Terminal::open$',
  # Only how often the deadline clock is read; the deadline still fires at a later sample.
  'uze-script/src/engine\.rs.*replace == with != in running$',
  # A deadline met to the nanosecond at a sampled operation; the next sample fires.
  'uze-script/src/engine\.rs.*replace > with >= in running$',
  # Only how often the regex cache empties; every answer is the same.
  'uze-script/src/primitives\.rs.*replace == with != in compiled$',
  # Dropping the struct drops the sender right after, which ends the thread the same way.
  'uze-script/src/resident\.rs.*replace <impl Drop for Resident>::drop with \(\)$',
