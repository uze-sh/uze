[package]
name = "uze-document"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "What an earlier build of UZE left, as this one meets it: the shape a record declares, the ladder that carries it across, the floor beneath that, and the release floor that bounds every piece of support for an earlier release"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# Reporting what was set aside; a no-op until the binary subscribes.
tracing = "0.1"
