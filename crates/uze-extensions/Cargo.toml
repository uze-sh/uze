[package]
name = "uze-extensions"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Built-in TUI extensions for the uze workspace client"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
unicode-width = "0.2"
# `.vscode/settings.json`, for the code surface's `files.exclude`.
serde_json = "1"
# CommonMark, for the markdown preview. `pulldown-cmark` is what rustdoc
# itself parses with (pulldown-cmark org, MIT); with default features off
# it drops the HTML writer and the CLI, leaving one crate the workspace
# does not already have (`unicase`) and no C anywhere in the tree.
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# The syntaxes `bat` ships, precompiled, for the languages syntect's own
# defaults stop short of (TypeScript, TOML, Dockerfile, Kotlin, Swift, Zig,
# Nix, Terraform, ...). Single maintainer (CosmicHarper, formerly
# CosmicHorrorDev; the repository moved from GitHub to Codeberg, the crate
# name never changed), mature and used by gitui; the fancy-regex feature
# keeps it free of C, as syntect is here.
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }

[dev-dependencies]
uze-git = { path = "../uze-git" }
uze-testkit = { path = "../uze-testkit" }
