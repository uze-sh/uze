[package]
name = "uze-core"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Harness-agnostic package, capability, lifecycle, and integration contracts for UZE"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The extension contract: what a declared extension compiles into.
uze-contract = { path = "../uze-contract" }
# Locks that hold across processes, and ending a process with its tree.
uze-platform = { path = "../uze-platform" }
# Spans on every process this crate runs; a no-op until the binary
# subscribes (see `src/telemetry.rs`).
tracing = "0.1"
uze-git = { path = "../uze-git" }
uze-document = { path = "../uze-document" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
noyalib = { version = "0.0.58", features = ["compat-serde-yaml"] }
thiserror = "2"
# The operator's `config.toml`: a document model rather than serde, so a
# write keeps their comments and the sections this build does not know.
toml_edit = "0.25.13"
# Authentication, not identification: `integrity` in agents.lock must be
# infeasible to forge, which rules out this crate's own FNV digest. RustCrypto,
# MIT OR Apache-2.0, pure Rust — no C in the four-target release matrix.
sha2 = "0.11"
# The shell a project's plain setup and gate lines run in, the same on every
# platform (`machine::portable_shell`). denoland, MIT, pure Rust; pinned,
# since 0.x minors break and every bump re-runs the equivalence suite.
deno_task_shell = "=0.33.3"
# Only `uze shell -c` builds a runtime: the shell's API is async.
tokio = { version = "1", features = ["rt"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
uze-testkit = { path = "../uze-testkit" }
