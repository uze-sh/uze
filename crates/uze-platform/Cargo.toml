[package]
name = "uze-platform"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "What UZE asks of the operating system, answered once per platform: processes, endpoints, locks, shells, paths and the facts only the kernel holds"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# A confinement crosses a process boundary as JSON (`uze __confine`);
# serde-rs, already throughout the workspace.
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Published by the Landlock LSM's own maintainer (Mickaël Salaün) from
# landlock-lsm/rust-landlock; pure Rust over `libc`, bringing only
# `enumflags2` (and its derive) beside `thiserror`, already in the tree.
# The seccomp filter is written by hand over `libc` instead of a crate.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

# Published by Microsoft and already in the tree; only the API families
# named here are compiled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Time",
  "Win32_System_SystemInformation",
  "Wdk_System_Threading",
] }

[dev-dependencies]
serde_json = "1"
uze-testkit = { path = "../uze-testkit" }
