[package]
name = "uze-terminal"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Local persistent terminal runtime for UZE workspaces"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Spans on every process this crate runs; a no-op until the binary
# subscribes (see `src/telemetry.rs`).
tracing = "0.1"
# The one rule for reading a record another build wrote. A leaf crate
# naming no domain, so this crate still reaches nothing of UZE's: a
# durability rule written in two places is what it exists to prevent.
uze-document = { path = "../uze-document" }
# Locks that hold across processes, and what Windows says about a process.
uze-process = { path = "../uze-process" }
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Pinned exactly, and not a candidate for updating. 1.3.3 is the last 1.x and
# has been since 2021; 2.x is a different encoder API, and the frames on this
# wire are versioned, so moving it is a protocol change that gets designed,
# not a bump. 3.0.0 is not even a crate — its whole lib.rs is
# `compile_error!("https://xkcd.com/2347/")`, published by an account since
# deleted. `.github/dependabot.yml` keeps the robot away from all three.
bincode = "=1.3.3"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows backend: named pipes, Job Objects and the process facts the
# kernel holds. Published by Microsoft and already in the tree through
# portable-pty; only the API families named here are compiled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Wdk_System_Threading",
] }

[dev-dependencies]
uze-testkit = { path = "../uze-testkit" }
