[package]
name = "uze-testkit"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
publish = false
description = "Shared, harness-agnostic test infrastructure for the UZE workspace (TestEnvironment, FakeHarness, fixtures, scenario builder, assertions)."

[dependencies]
uze-git = { path = "../uze-git" }
uze-platform = { path = "../uze-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
