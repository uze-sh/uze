# A release candidate: the Windows archives of a commit, packed as a release
# lays them out and published nowhere, for a person to install by hand with
# install.ps1 before Windows is offered (windows-support task 13.2):
#
#   $env:UZE_BASE_URL = 'file:///C:/path/to/candidate'
#   $env:UZE_VERSION = '<version>'
#   $env:UZE_WINDOWS_PREVIEW = '1'
#   irm https://uze.sh/i | iex
name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit to package
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows
    uses: ./.github/workflows/package-windows.yml
    with:
      ref: ${{ inputs.ref }}

  candidate:
    name: Lay out the candidate
    needs: package-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: uze-*-windows
          path: dist
          merge-multiple: true
      # `<base>/download/v<version>/<archive>` beside its SHASUMS256.txt: the
      # layout install.ps1 reads, whatever its base URL.
      - name: Lay out the release
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          release="candidate/download/v${version}"
          mkdir -p "${release}"
          mv dist/uze-*-windows.zip "${release}/"
          (cd "${release}" && sha256sum *.zip > SHASUMS256.txt)
          cat "${release}/SHASUMS256.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uze-candidate
          path: candidate
          retention-days: 14
