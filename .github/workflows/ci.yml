name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# One run per ref. A pull request superseded by its next push is cancelled;
# a run on `main` or from the nightly schedule is not, because those two are
# the record of whether that commit was green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A runner builds each tree once: incremental state is only written, never
  # read back, and on Windows it is the largest part of a cache entry.
  CARGO_INCREMENTAL: "0"

# Every runner in this repository names its image, and none says
# `ubuntu-latest` or `macos-latest`. Those labels move — GitHub repoints them
# at the next release on a date nobody here picks — and when they do, every
# workflow changes underfoot at once with no commit behind the change. This
# repository already pins each action to a SHA, gitleaks to a version *and* a
# checksum, and git-cliff and cargo-release to exact releases; the machine all
# of that runs on was the one unpinned thing left. Moving to a new image is a
# decision, so it should be a diff.
#
# ── The shape of this file ────────────────────────────────────────────
#
# Three stages, and one edge that earns its keep.
#
#   1 · Verify   everything below, in parallel, at t=0
#   2 · Prove    the E2E tiers, also at t=0 — most of the run's
#                runner-minutes, each one its own compile gate, and a leg
#                a previous run already proved is not run again
#   3 · Close    `gate`, the one check branch protection has to know
#
# The temptation is six stages. It does not pay: under about ninety seconds
# a gate costs more information than it saves time, and every job in stage 1
# finishes inside two minutes. So stage 1 has no internal ordering at all —
# a formatting slip and a failing test arrive together, which is what you
# want from them. The one edge that pays is inside the Lab (`Image` → its
# legs), and there are no others. Clippy used to gate stage 2 as well; it
# sat on the critical path of every green run to save a minute on a red one
# that the tiers' own first build already stops.
#
# Journeys and Conformance are called from here rather than triggered beside
# it, because `needs:` does not cross a workflow boundary and a tier that
# cannot be gated is a tier that runs on a tree nobody has compiled. Being
# called also nests them: GitHub renders `CI / Conformance / E2E - Claude`,
# which is as close to a stage as the platform gets.

jobs:
  # ── What this change reaches ────────────────────────────────────────
  #
  # A path filter can only be written at the top of a workflow, and this gate
  # needs a different one per tier — so the question moves here, where it is
  # an output any job can read, and stays a diff instead of becoming a
  # property of which file a job happens to live in.
  #
  # It also decides which platforms run. `macos.yml` used to be a separate
  # workflow purely to carry its own `paths:`; folding it into the matrix
  # below is what that file's own header asked for once a run settled green,
  # and this is where the filter it was carrying ended up.
  changes:
    name: Changed surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      lab: ${{ steps.filter.outputs.lab }}
      journeys: ${{ steps.filter.outputs.journeys }}
      platforms: ${{ steps.filter.outputs.platforms }}
      journey_platforms: ${{ steps.filter.outputs.journey_platforms }}
      installer_windows: ${{ steps.filter.outputs.installer_windows }}
      package_windows: ${{ steps.filter.outputs.package_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `git diff` against the pull request's base needs both commits.
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          linux='{"platform":"linux","runner":"ubuntu-24.04","clippy":false}'
          # Apple Silicon: the machine essentially every macOS developer
          # actually has. An `x86_64-apple-darwin` entry belongs here as a
          # third row once this one has a history of being green.
          macos='{"platform":"macos","runner":"macos-15","clippy":true}'
          # Native Windows, x64: gating, green since the platform settled.
          windows='{"platform":"windows","runner":"windows-2025","clippy":true}'
          # Native Windows on Arm. Not gating yet: it has to build a history
          # of being green first, as the x64 row did (task 9.3).
          windows_arm='{"platform":"windows-arm","runner":"windows-11-arm","clippy":false}'

          # Anything that is not a pull request answers "everything". A push
          # to `main` and the nightly are the record of whether that commit
          # is green, and a partial record is not one.
          if [ "${EVENT}" != "pull_request" ]; then
            {
              echo "lab=true"
              echo "journeys=true"
              echo "platforms=[${linux},${macos},${windows},${windows_arm}]"
              echo "journey_platforms=[${linux},${macos},${windows},${windows_arm}]"
              echo "installer_windows=true"
              echo "package_windows=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          files="$(git diff --name-only "${BASE}" HEAD)"
          echo "Changed files:"
          printf '%s\n' "${files}" | sed 's/^/  /'

          reaches() { printf '%s\n' "${files}" | grep -qE "$1"; }

          # Anything reaching for `/proc`, a signal, a pty or a peer
          # credential, plus whatever decides what gets linked in. A macOS
          # runner is the most expensive minute this repository can spend.
          platform_surface='^(crates/uze-core/src/machine/|crates/uze-terminal/|crates/uze-git/|crates/uze-platform/|journeys/|src/shim\.rs$|Cargo\.lock$|\.cargo/config\.toml$|\.github/(workflows/(ci|journeys)\.yml$|actions/journeys/))|(^|/)Cargo\.toml$'
          # What reaches Windows beyond that: every place a path, a process
          # or a shell is spelled, and the installer.
          windows_surface='^(src/|crates/|tests/|install\.ps1$)'
          # The part of that a journey on macOS can tell apart from one on
          # Linux: the terminal, the processes and the screen it drives. A
          # dependency bump is not in it — linking is what a bump threatens,
          # and `Test (macos)` still answers that; the nightly performs the
          # journeys on both platforms whatever changed.
          journey_platform_surface='^(crates/uze-core/src/machine/|crates/uze-terminal/|crates/uze-git/|journeys/|src/ui/|src/ui\.rs$|src/shim\.rs$|\.github/(workflows/(ci|journeys)\.yml$|actions/journeys/))'
          # What is baked into the Lab image, or read by a vertical.
          lab_surface='^(src/|crates/|tests/_fixtures/|plugins/|conformance/|marketplace\.json$|Cargo\.lock$|\.github/(workflows/(ci|conformance)\.yml$|scripts/))|(^|/)Cargo\.toml$'
          # The Windows installer and what holds it to account.
          installer_windows_surface='^(install\.ps1|tests/scripts/(installer\.Tests\.ps1|PSScriptAnalyzerSettings\.psd1)|\.github/workflows/ci\.yml)$'
          # What decides the archive a Windows release ships and how it lands:
          # the packaging, the release, the installer, and what is linked in.
          package_windows_surface='^(install\.ps1|\.github/workflows/(ci|package-windows|release)\.yml|\.cargo/config\.toml|Cargo\.lock)$|(^|/)Cargo\.toml$'
          # What a journey drives, or what it drives it with.
          journeys_surface='^(src/|crates/|journeys/|Cargo\.lock$|\.github/(workflows/(ci|journeys)\.yml$|actions/journeys/|scripts/))|(^|/)Cargo\.toml$'

          platforms="${linux}"
          if reaches "${platform_surface}"; then platforms="${platforms},${macos}"; fi
          if reaches "${windows_surface}"; then platforms="${platforms},${windows},${windows_arm}"; fi
          platforms="[${platforms}]"
          if reaches "${journey_platform_surface}"; then journey_platforms="${linux},${macos}"; else journey_platforms="${linux}"; fi
          # Windows x64 on every change that reaches Windows; Arm in the
          # nightly and on `main`, where a slower runner costs no review.
          if reaches "${windows_surface}"; then journey_platforms="${journey_platforms},${windows}"; fi
          journey_platforms="[${journey_platforms}]"

          {
            echo "lab=$(reaches "${lab_surface}" && echo true || echo false)"
            echo "journeys=$(reaches "${journeys_surface}" && echo true || echo false)"
            echo "platforms=${platforms}"
            echo "journey_platforms=${journey_platforms}"
            echo "installer_windows=$(reaches "${installer_windows_surface}" && echo true || echo false)"
            echo "package_windows=$(reaches "${package_windows_surface}" && echo true || echo false)"
          } >> "${GITHUB_OUTPUT}"

          echo "---"
          cat "${GITHUB_OUTPUT}"

  # ── Stage 1 · Is the code correct ───────────────────────────────────
  #
  # The questions asked of the Rust in this repository. No ordering between
  # them on purpose: they all answer inside two minutes, and a run that
  # reports a formatting slip *instead of* a failing test has told you half
  # of what it knew.

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The comment beside a pinned SHA is the version Dependabot reads, here
      # and in every other workflow. `# master` is not one, so the robot
      # followed that branch's HEAD and proposed each bump as one forty-digit
      # hash to another — unreadable in a title and unreviewable in a diff.
      # `v1` is the tag dtolnay publishes and it resolves to this same commit.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Restore everywhere, save only from `main` — see `test` below.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings
      # Windows, checked from here: clippy links nothing, so the msvc targets
      # need their standard library and no Windows toolchain. Both
      # architectures, every run — `cfg(windows)` code is invisible to the
      # Linux clippy above and is exactly where a platform port goes wrong.
      - run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo clippy --all-targets --target aarch64-pc-windows-msvc -- -D warnings
      # `make install` — the documented way to put `uze` on a developer's
      # machine — builds with `--features telemetry`, and nothing else here
      # ever compiles it. A grouped Dependabot bump of the four
      # `opentelemetry*` crates therefore passed every gate and broke on the
      # next `make install`. One extra codegen of four crates, on the job
      # that is already the compile gate.
      - run: cargo clippy --features telemetry --bin uze -- -D warnings
      - run: cargo test --features telemetry --lib telemetry

  test:
    name: Test (${{ matrix.platform }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Windows on Arm reports until it has a history of being green (task 9.3).
    continue-on-error: ${{ matrix.platform == 'windows-arm' }}
    strategy:
      # The first run on a new platform is worth the complete list of what
      # does not hold there, not the name of the first leg that stopped.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Shared with the journeys job, which builds this same workspace
          # with this same toolchain: the two entries carried an identical
          # content hash and half a gigabyte of duplicate dependency builds
          # per branch.
          shared-key: workspace-${{ matrix.platform }}
          # Restore everywhere, save only from `main`. The repository sat at
          # 9.91 GB of its 10 GB cache allowance, which means GitHub was
          # evicting by LRU on every run, and a branch that writes its own
          # 1.75 GB set evicts the entry the next branch was going to read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `.cargo/config.toml` pins `jobs = 2` as a courtesy to a 4-vCPU WSL
      # box. A hosted macOS runner is not that box, and this leg is the
      # slowest in stage 1.
      #
      # macOS only, deliberately: every green Linux run this repository has
      # was measured at the repository default, and build parallelism is its
      # own experiment — not something to change in passing while folding a
      # platform in.
      #
      # An explicit count, because cargo has no spelling for "all of them":
      # `CARGO_BUILD_JOBS=0` is not that, it is an error (`jobs may not be
      # 0`) — and one that fails every cargo invocation in the job instantly,
      # which is how it took the first run of the macOS workflow down.
      - name: Use the whole runner
        if: runner.os == 'macOS'
        run: echo "CARGO_BUILD_JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"
      # What a person's Windows machine has: the system, Git and the Rust
      # toolchain, and no POSIX tool for uze to lean on by accident. Defender
      # scanning every object a build writes doubles the build.
      - name: Reduce the machine to what a user has
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
          $kept = @(
              "$env:SystemRoot\System32",
              "$env:SystemRoot",
              "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
              "$env:ProgramFiles\Git\cmd",
              "$env:USERPROFILE\.cargo\bin"
          ) -join ';'
          "PATH=$kept" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_BUILD_JOBS=$env:NUMBER_OF_PROCESSORS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prove no POSIX tool is reachable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # System32's bash.exe is Windows' own WSL launcher, there on every
          # machine with the feature; with no distribution installed it runs
          # nothing, so a test leaning on it still fails here.
          $found = Get-Command sh, bash, jq -ErrorAction SilentlyContinue |
            Where-Object { $_.Source -notlike "$env:SystemRoot\*" }
          if ($found) { $found | Format-Table Name, Source; throw 'a POSIX tool is reachable' }
          $tar = (Get-Command tar).Source
          if ($tar -notlike "$env:SystemRoot\*") { throw "tar is not the system's: $tar" }
      - name: Build the binary
        run: cargo build --locked --bin uze
      # Linking is not running. The smallest proof that the produced
      # executable starts on this platform at all — which is a different
      # claim from any test passing, and the one that was never made until a
      # macOS runner made it.
      - name: Run it
        run: ./target/debug/uze --version
      # `lint` above answers this for Linux and is the gate. Every other
      # platform answers it here, where the toolchain is installed and the
      # tree is already built — `cfg`-gated code is invisible to a Linux
      # clippy, and it is exactly where a platform port goes wrong.
      - name: Clippy
        if: matrix.clippy
        run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `rust-version` in Cargo.toml is a promise to anyone pinned to that
      # release. Every other job runs `stable`, so without this one the
      # promise is never tested and a newer language feature breaks it
      # silently.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `check`, not `test`: the question is whether the declared version can
      # build the tree, and running the suite twice answers nothing new.
      # `+1.97` explicitly: the action sets this toolchain as rustup's
      # default, and `rust-toolchain.toml` outranks a default — without the
      # `+` this job would quietly check the tree on stable and pass a
      # promise it never tested. Matches `make msrv`.
      - run: cargo +1.97 check --workspace --all-targets --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    # LLVM instrumentation changes test timing and memory use. Keep this
    # separate from ordinary tests so a concurrency regression cannot leave a
    # runner wedged indefinitely — and out of the shared cache key below, so
    # `-C instrument-coverage` artifacts never reach a job that is not
    # instrumented.
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov
      # No `--skip`. Three used to sit here. `foreground_status_reports_*`
      # read whichever shell the runner reported and waited five seconds for
      # it; it now pins `SHELL` and waits on a deadline. `real_codex_dogfood_*`
      # was deleted with the test it named. `acquisition::*` was excluded for
      # a GPG-agent signing timeout — a libtest *substring* filter, so it took
      # the whole untrusted-remote-clone path out of the measurement, the one
      # module that most deserves to be in it. `uze_testkit::git` neutralizes
      # the ambient Git configuration that caused it, and the fixture now uses
      # it.
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 68 --fail-under-regions 69
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov
          path: lcov.info

  # ── Stage 1 · Is it safe to ship what we link ───────────────────────
  #
  # A different question from correctness, and read by a different person:
  # not whether the code works, but whether the tree may be published and
  # what it drags in is known-good. Kept apart for that reason, not because
  # the tools happen to differ.

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A prebuilt binary, not `rustsec/audit-check`: that action builds
      # cargo-audit from source on every run with a fresh resolution, so
      # any crate in cargo-audit's own tree publishing a broken release
      # failed this job with no change on our side (tinyvec 1.13.0,
      # 2026-09-03). The audit itself is unchanged: our Cargo.lock
      # against the RustSec advisory database.
      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  licences:
    name: Licences
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Its own job, not a step of Audit: this one answers whether the
      # project may ship what it links, which is a different question from
      # whether what it links has a known defect, and a red one here is
      # read by a different person.
      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny,cargo-about
      # Licences, advisories, bans and sources — the policy lives in
      # deny.toml, including the two `unmaintained` advisories accepted
      # there with a written reason.
      - run: cargo deny check
      # The same policy over the optional features, which the default
      # resolution does not see: `telemetry` is what `make install` compiles
      # and `dev-servers` is what the Lab image builds the MCP fixture with.
      # Not distributed is not the same as not compiled — see deny.toml's
      # header.
      - run: cargo deny --all-features check
      # A drifting attribution file is worse than none: it states a licence
      # set the binary no longer has. Regenerate and compare, so a
      # dependency change that forgets CREDITS.md fails here.
      - run: make attributions-check

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Pinned so a scan result is reproducible: a floating scanner means a
      # green run today and a red one tomorrow with no commit in between.
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks walks commits, not the worktree; a shallow clone would
          # silently scan almost nothing and still report success.
          fetch-depth: 0
      # Installed from the upstream release rather than an action:
      # `gitleaks/gitleaks-action` gates organisation use behind a licence key,
      # and `taiki-e/install-action` does not carry gitleaks (it is Go, so its
      # cargo-binstall fallback looks for a crate that does not exist).
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # The whole history is scanned on every event, not just the commits a
      # pull request adds. It costs seconds, it cannot be defeated by a force
      # push rewriting the range, and it is what catches a secret matched only
      # by a rule upstream wrote after the commit had already landed.
      - name: Scan the full history
        run: ./gitleaks git --no-banner --redact=4 --config .gitleaks.toml

  # ── Stage 1 · The parts that are not the binary ─────────────────────
  #
  # uze is more than a Rust binary — an installer a stranger pipes into a
  # shell, a documentation site, and the Lab's own Python. Each was, at
  # some point, shipped with nothing checking it.

  installer:
    name: Installer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint the installer
        run: shellcheck install.sh
      - name: Exercise the installer offline
        run: sh tests/scripts/installer-test.sh

  # install.ps1 under both PowerShells a person may run it in, against a
  # release served from a directory (tests/scripts/installer.Tests.ps1).
  installer-windows:
    name: Installer (Windows)
    needs: changes
    if: needs.changes.outputs.installer_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned: a new analyzer rule or a Pester change is a change to this
      # job, made on purpose. Each PowerShell keeps its own module path.
      - name: Install the pinned modules (PowerShell 7)
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
      - name: Install the pinned modules (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Lint the installer
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Settings tests/scripts/PSScriptAnalyzerSettings.psd1
          $found | Format-Table -Wrap | Out-String -Width 200
          if ($found) { throw "PSScriptAnalyzer: $(@($found).Count) finding(s)" }
      - name: Exercise the installer (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.6.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/scripts/installer.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Exercise the installer (PowerShell 7)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.6.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/scripts/installer.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  # The archives a release ships, built as the release builds them, then
  # installed by install.ps1 on each architecture: a release is never the
  # first run of either.
  package-windows:
    name: Package Windows
    needs: changes
    if: needs.changes.outputs.package_windows == 'true'
    uses: ./.github/workflows/package-windows.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  install-windows:
    name: Install the archive (${{ matrix.platform }})
    needs: package-windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-windows
            runner: windows-2025
          - platform: aarch64-windows
            runner: windows-11-arm
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: uze-${{ matrix.platform }}
          path: archive
      # Laid out as a release is, so install.ps1 reads it exactly as it reads
      # GitHub's: <base>/download/v<version>/<archive> beside SHASUMS256.txt.
      - name: Install it with install.ps1, run it, uninstall it
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $release = Join-Path $env:RUNNER_TEMP 'release'
          $download = Join-Path $release "download\v$version"
          New-Item -ItemType Directory -Force $download | Out-Null
          $archive = "uze-${{ matrix.platform }}.zip"
          Copy-Item "archive\$archive" $download
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $download $archive)).Hash.ToLower()
          Set-Content (Join-Path $download 'SHASUMS256.txt') "$hash  $archive" -Encoding Ascii
          $env:UZE_BASE_URL = ([Uri]$release).AbsoluteUri
          $env:UZE_VERSION = $version
          $env:UZE_BIN_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          $env:UZE_HOME = Join-Path $env:RUNNER_TEMP 'uze-home'
          & ([scriptblock]::Create((Get-Content install.ps1 -Raw)))
          $reported = & (Join-Path $env:UZE_BIN_DIR 'uze.exe') --version
          if ($LASTEXITCODE -or $reported -notmatch [regex]::Escape($version)) { throw "the installed uze answered: $reported" }
          & ([scriptblock]::Create((Get-Content install.ps1 -Raw))) -Uninstall
          if (Test-Path (Join-Path $env:UZE_BIN_DIR 'uze.exe')) { throw 'uninstall left uze.exe behind' }

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: web/package.json
      # The site is part of the product and had no job at all: a broken
      # build reached a red Vercel deploy and nothing before it.
      - run: bun install --frozen-lockfile
      - run: bun run types:check
      - run: bun run build

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ruff
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: ruff
      - run: ruff format --check conformance/ .github/scripts/
      - run: ruff check conformance/ .github/scripts/
      - run: python3 -m pip install --user pexpect
      - name: Conformance unit tests (no Docker, no harness)
        run: for t in conformance/tests/test_*.py; do python3 "$t" || exit 1; done
      # What decides whether an end-to-end leg runs at all.
      - name: Proof unit tests
        run: python3 .github/scripts/test_proof.py
      # Here rather than in each journeys leg: it is seconds, it has to hold
      # on every change — including one whose legs are all reused — and the
      # `proves:` pages it resolves are not part of any leg's proof.
      - name: Validate the journeys
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux python3-yaml
          python3 journeys/journey.py validate journeys/suites

  # ── Stage 2 · Prove it against the real thing ───────────────────────
  #
  # Neither waits on stage 1. Each one's first step builds `uze` and fails a
  # tree that does not compile in under a minute — the journeys' `cargo
  # build` from a warm cache, the Lab's `Image` — so a gate in front of them
  # only delays every green run by the length of Clippy to save a minute on
  # the rare red one. And a leg whose inputs a previous run already proved
  # is not run at all: see `.github/scripts/proof.py`.
  #
  # The nightly runs both on their own schedules, in their own files, so a
  # scheduled run here would perform each of them twice.

  journeys:
    name: Journeys
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.journeys == 'true'
    uses: ./.github/workflows/journeys.yml
    with:
      platforms: ${{ needs.changes.outputs.journey_platforms }}
    permissions:
      contents: read
      # To find a proof, which is an artifact of an earlier run.
      actions: read

  conformance:
    name: Conformance
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.lab == 'true'
    uses: ./.github/workflows/conformance.yml
    permissions:
      contents: read
      actions: read

  # ── Stage 3 · Close the run ─────────────────────────────────────────

  # The single check branch protection has to know about.
  #
  # Eleven job names were listed there one by one, so adding a matrix leg —
  # the Windows runner, the `x86_64-apple-darwin` entry `changes` already has
  # a place for — meant editing repository settings, which is not a diff and
  # which nobody reviews. Folding macOS in already breaks one of the eleven:
  # `Test` is required, and is now `Test (linux)` and `Test (macos)`. This
  # job is the only name that has to appear there again.
  #
  # `skipped` is not a failure, deliberately: it is what lets `changes` turn
  # off an expensive tier without a documentation change sitting forever on a
  # check that will never report.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - fmt
      - lint
      - test
      - msrv
      - coverage
      - audit
      - licences
      - secrets
      - installer
      - installer-windows
      - package-windows
      - install-windows
      - web
      - python
      - journeys
      - conformance
    steps:
      - name: Every job either passed or was not needed
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::a job in this run failed or was cancelled"
            exit 1
          fi
          echo "the run is green"

  # Every `rust-cache` key ends in a hash of what it was built from, so each
  # dependency change on `main` leaves the previous entry behind whole: three
  # generations of every family sat in a 10 GB allowance, 6.5 GB of it never
  # to be restored again, and GitHub evicting by LRU meant a fresh entry could
  # push out the one the next pull request was about to read. Only the newest
  # generation of each family on `main` is ever restored, so the rest goes.
  # After the gate, so this run's own entries are already saved.
  caches:
    name: Prune stale caches
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh cache list --ref refs/heads/main --limit 500 --json id,key,createdAt \
            | jq -r 'map(. + {family: (.key | sub("-[^-]+$"; ""))})
                     | group_by(.family)
                     | map(sort_by(.createdAt) | reverse | .[1:][])
                     | .[] | "\(.id) \(.key)"' \
            | while read -r id key; do
                echo "deleting ${key}"
                gh cache delete "${id}"
              done
