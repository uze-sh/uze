# Temporary: experiments for `confinement-parity`, removed before it merges.
name: Confinement lab

on:
  push:
    branches: [feat/confinement-parity]
    paths:
      - "lab/**"
      - ".github/workflows/confinement-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Lab (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Memory bounds
        working-directory: lab/confinement/macos
        run: |
          sw_vers
          cargo run --quiet --release | tee memory.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-${{ matrix.runner }}
          path: lab/confinement/macos/memory.txt

  windows:
    name: Lab (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Build the probe
        working-directory: lab/confinement/windows
        run: cargo build --quiet --release
      - name: As the runner's administrator
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.Version
          $python = (Get-Command python -ErrorAction SilentlyContinue).Source
          $node = (Get-Command node -ErrorAction SilentlyContinue).Source
          "python: $python"; "node: $node"
          $env:PROBE_PROFILE = '1'
          $env:PROBE_GIT = "$env:ProgramFiles\Git\cmd\git.exe"
          if ($python) { $env:PROBE_PYTHON = $python }
          if ($node) { $env:PROBE_NODE = $node }
          $env:PROBE_ONLY = 'ac '
          $exe = (Resolve-Path lab\confinement\windows\target\release\probe.exe).Path
          & $exe parent "$env:RUNNER_TEMP\work" "$env:RUNNER_TEMP\admin-ungranted.txt" | Out-Null
          if ($python) { $env:PROBE_GRANT_EXEC = (Split-Path $python) }
          & $exe parent "$env:RUNNER_TEMP\work" "$env:RUNNER_TEMP\admin.txt" | Out-Null
          Get-Content "$env:RUNNER_TEMP\admin-ungranted.txt" | Select-String 'run |=====|exit'
          Get-Content "$env:RUNNER_TEMP\admin.txt"
      - name: As a standard user
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString 'Lab-Passw0rd!x9' -AsPlainText -Force
          New-LocalUser -Name labuser -Password $password -PasswordNeverExpires | Out-Null
          $shared = 'C:\Users\Public\lab'
          New-Item -ItemType Directory -Force $shared | Out-Null
          Copy-Item lab\confinement\windows\target\release\probe.exe "$shared\probe.exe"
          icacls $shared /grant 'labuser:(OI)(CI)F' | Out-Null
          $git = "$env:ProgramFiles\Git\cmd\git.exe"
          Set-Content "$shared\run.cmd" "@echo off`r`nset PROBE_PROFILE=1`r`nset PROBE_ONLY=ac `r`nset PROBE_GIT=$git`r`nwhoami /groups > $shared\groups.txt`r`n$shared\probe.exe parent C:\Users\labuser\work $shared\user.txt > $shared\stdout.txt 2>&1`r`n"
          $credential = New-Object System.Management.Automation.PSCredential('labuser', $password)
          Start-Process -FilePath "$shared\run.cmd" -Credential $credential -LoadUserProfile -Wait -WorkingDirectory $shared
          Get-Content "$shared\groups.txt" | Select-String 'Mandatory|Administrators'
          Get-Content "$shared\user.txt"
          Get-Content "$shared\stdout.txt" -Tail 5
          Copy-Item "$shared\user.txt" "$env:RUNNER_TEMP\user.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lab-${{ matrix.runner }}
          path: ${{ runner.temp }}/*.txt
