name: Conformance

# The Harness Conformance Lab: the real harness binaries against a synthetic
# provider, in a disposable Docker network with no Internet and no tokens.
#
# Its own file, and called by `ci.yml` rather than triggered beside it: at
# ~34 runner-minutes it is the most expensive thing this repository can spend
# an event on, and it can only be affected by the code that is baked into the
# Lab image. A documentation or web change ran the whole matrix and could only
# ever fail it for reasons of its own — which is exactly what happened to #11,
# red on a vertical it did not touch. The filter that decides whether to spend
# it now lives in `ci.yml`'s `changes` job, because a path filter can only be
# written at the top of a workflow and the gate needs one per tier.

on:
  # `ci.yml` is the entry point for a push and a pull request: `needs:` does
  # not cross a workflow boundary, so a Lab that gates on anything — its own
  # image, the rest of the gate — has to be reachable from the same graph.
  # Kept independently runnable for the nightly and for a hand-started run.
  workflow_call:
  # Nightly runs regardless of what changed: the harnesses install
  # channel-latest, so a vertical goes red on a vendor release with no commit
  # of ours behind it.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Per commit on a push, as `ci.yml` groups the run that calls this one.
concurrency:
  group: conformance-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One image, four verticals.
  #
  # Each leg built its own until now. That cost four times the runner minutes
  # — 14m27s of a 62m pull request, measured — but the reason it moved is not
  # the bill. The Dockerfile provisions the harnesses with `uze setup`, whose
  # policy is channel-latest; four independent builds are four independent
  # installs, so a vendor publishing mid-run left the matrix comparing four
  # different worlds. A difference between two legs has to be a difference
  # between two harnesses, and it cannot be that while each leg builds its
  # own ground.
  #
  # This job is also the Lab's own compile gate: the image builds `uze` from
  # source, so a tree that does not compile stops here, in about two minutes,
  # and the four expensive legs never start.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Listing artifacts by name is how a proof is found; see
      # `.github/scripts/proof.py` for why a proof is an artifact.
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lab-release
          # Restore everywhere, save only from `main` — see `ci.yml`'s `test`.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Dockerfile's own `uze-build` stage compiled from nothing on every
      # run — 295 of the job's 342 seconds, measured — because its cache
      # mounts die with a hosted runner, and at `.cargo/config.toml`'s two
      # jobs on a four-core machine. Here the same compile runs on the
      # runner's own toolchain and cache, inside the image the stage names so
      # the binaries link against the glibc the Lab image runs (the runner's
      # is newer, and a binary built on it does not start there), and the
      # result is handed to the Dockerfile in place of that stage. A local
      # `docker build` still runs the stage itself.
      - name: Build the binaries the Lab bakes
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${PWD}:/src" -w /src \
            -v "${HOME}/.cargo:/cargo" -v "${HOME}/.rustup:/rustup" \
            -e HOME=/tmp -e CARGO_HOME=/cargo -e RUSTUP_HOME=/rustup \
            -e PATH=/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e CARGO_BUILD_JOBS="$(nproc)" -e CARGO_TERM_COLOR=always \
            rust:1.97-bookworm \
            sh -c 'cargo build --locked --release --bin uze && cargo build --locked --release --features dev-servers --bin uze-mcp-conformance-fixture'
          mkdir -p "${RUNNER_TEMP}/uze-build/out"
          cp target/release/uze target/release/uze-mcp-conformance-fixture "${RUNNER_TEMP}/uze-build/out/"
      # The Lab image bakes the real harness binaries (channel-latest),
      # the `uze` binary and the fixture tree; `lab.py` runs each vertical
      # against it in a disposable `--internal` network — zero Internet,
      # zero tokens.
      - name: Build the Lab harness image
        run: |
          docker buildx build --load --build-context uze-build="${RUNNER_TEMP}/uze-build" \
            -f conformance/Dockerfile -t conformance-harness:latest .
      - name: Install Lab runner dependency
        run: python3 -m pip install --user pexpect
      # Channel-latest is only known once it is installed, so the versions
      # a leg keys its proof on are read here, from this image, with the
      # same probes the run itself records — never resolved a second time
      # against the vendors, which could answer differently a minute later.
      #
      # Every leg's key and prior proof is settled here rather than in the
      # leg, so an image nobody will load is never saved or uploaded. The
      # nightly and a hand-started run always run: they are the record that
      # a verdict still holds.
      - id: plan
        name: Plan which legs still need to run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRESH: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          versions="$(python3 .github/scripts/proof.py versions)"
          echo "versions: ${versions}"
          fresh=()
          if [ "${FRESH}" = true ]; then fresh=(--fresh); fi
          python3 .github/scripts/proof.py conformance --versions "${versions}" "${fresh[@]}" >> "${GITHUB_OUTPUT}"
          grep '^pending=' "${GITHUB_OUTPUT}"
      # zstd, not the artifact action's own gzip: the image is measured in
      # gigabytes, `-T0 -3` saturates the runner's cores for a ratio gzip
      # reaches at several times the wall clock, and `compression-level: 0`
      # below stops the upload from trying to compress it a second time.
      - name: Hand it to the verticals
        if: steps.plan.outputs.pending != '0'
        run: docker save conformance-harness:latest | zstd -T0 -3 -o /tmp/lab-image.tar.zst
      - if: steps.plan.outputs.pending != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lab-image
          path: /tmp/lab-image.tar.zst
          compression-level: 0
          # A build product for the legs of this run, not evidence. Evidence
          # is what each vertical uploads below, at 90 days.
          retention-days: 1
          if-no-files-found: error

  conformance:
    name: E2E - ${{ matrix.label }} (${{ matrix.part }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Each vertical is two legs: the contract every harness must hold, and
      # what is unique to the vendor (`lab.py --part`). A vertical ran them
      # one after the other in a single leg — Antigravity's ten minutes were
      # two halves of four and a half, and nothing between them.
      matrix:
        harness: [antigravity, claude, codex, opencode]
        part: [contract, vendor]
        include:
          - harness: antigravity
            label: Antigravity
          - harness: claude
            label: Claude
          - harness: codex
            label: Codex
          - harness: opencode
            label: OpenCode
    env:
      KEY: ${{ fromJSON(needs.image.outputs.plan)[format('{0}-{1}', matrix.harness, matrix.part)].key }}
      VERSION: ${{ fromJSON(needs.image.outputs.plan)[format('{0}-{1}', matrix.harness, matrix.part)].version }}
      PROVEN: ${{ fromJSON(needs.image.outputs.plan)[format('{0}-{1}', matrix.harness, matrix.part)].proven }}
    steps:
      - name: Already proven
        if: env.PROVEN != ''
        run: |
          echo "::notice title=${{ matrix.label }} (${{ matrix.part }}) already proven::${VERSION} passed in ${PROVEN}"
          {
            echo "Passed against ${VERSION} in ${PROVEN}"
            echo
            echo "Reused: neither the harness version nor anything this leg reads changed since that run."
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.PROVEN == ''
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.PROVEN == ''
        with:
          name: lab-image
          path: /tmp
      # The one thing every leg must agree on. `docker load` prints the image
      # it restored; keep it in the log, because "which image did this leg
      # actually run" is the first question a divergent result raises.
      - name: Load the Lab image
        if: env.PROVEN == ''
        run: zstd -d -c /tmp/lab-image.tar.zst | docker load
      - name: Install Lab runner dependency
        if: env.PROVEN == ''
        run: python3 -m pip install --user pexpect
      - name: Run the ${{ matrix.harness }} ${{ matrix.part }} half
        if: env.PROVEN == ''
        run: |
          python3 conformance/lab.py --harness ${{ matrix.harness }} --part ${{ matrix.part }} --write-summary --retry-once
        env:
          AGY_OUTDIR: /tmp/harness-conformance/${{ matrix.harness }}-${{ matrix.part }}/run1
          UZE_EVIDENCE_DIR: /tmp/harness-conformance/${{ matrix.harness }}-${{ matrix.part }}/run1/evidence
      - name: Upload evidence
        if: always() && env.PROVEN == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-evidence-${{ matrix.harness }}-${{ matrix.part }}
          path: /tmp/harness-conformance/${{ matrix.harness }}-${{ matrix.part }}/run1/
          retention-days: 90
          if-no-files-found: ignore
      # Evidence lives in Actions artifacts (downloadable via UI/API,
      # retention-days above); summaries are written beside them instead of
      # being pushed to main — the parallel jobs raced each other on git
      # pushes, and artifact storage carries the same audit trail without
      # the commit churn (ADR-035 revised).
      #
      # Only a pass is recorded. The proof is an artifact named by its key,
      # in the run that holds the evidence it points at, and lives exactly
      # as long as that evidence does.
      - name: Record the proof
        if: success() && env.PROVEN == '' && env.KEY != ''
        run: |
          mkdir -p /tmp/proof
          echo "${VERSION} at ${GITHUB_SHA}" > /tmp/proof/proof.txt
      - if: success() && env.PROVEN == '' && env.KEY != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.KEY }}
          path: /tmp/proof/proof.txt
          retention-days: 90
          if-no-files-found: error
