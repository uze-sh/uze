name: Journeys

# A product journey performs a user's flow through the real CLI and the real
# TUI, then checks the machine it left behind. Its own file, like the Lab's —
# but on a very different budget: the Lab is ~34 runner-minutes of vendor
# binaries, and a journey is ~4 minutes on top of a build CI already pays for.
# That is why this gates a pull request rather than a release: the regressions
# it catches arrive in ordinary pull requests touching `src/ui`, and finding
# one at release time means bisecting a range instead of reading a diff.

on:
  # `ci.yml` owns the pull-request trigger and hands down which platforms to
  # perform on, so the gate is one graph with one `needs:` chain. Kept
  # independently runnable for the nightly and for a hand-started run.
  workflow_call:
    inputs:
      platforms:
        description: >-
          JSON array of `{platform, runner}` to perform the suite on. The
          caller decides — it is the only place that knows whether this
          change reaches anything platform-sensitive.
        required: false
        type: string
        default: '[{"platform":"linux","runner":"ubuntu-24.04"}]'
  # Nightly runs everything, not just the gate tag, and records a cast.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  journeys:
    # Named for its subject, not for the workflow around it: GitHub renders a
    # check as `<workflow> / <job>`, and `Journeys / Journeys` said one thing
    # twice. `E2E - UZE` sits beside the Lab's `E2E - Claude`, `E2E - Codex`
    # and the rest, where the pair now reads as what each tier drives
    # end to end — this one drives UZE, those drive a vendor's harness. The
    # platform is in the name because the two runs prove different halves.
    name: E2E - UZE (${{ matrix.target.platform }}, ${{ matrix.shard }}/4)
    # Pinned images, never `-latest`. The journey drives a rendered screen, so
    # the terminal is part of the contract — the tmux build, the locale and
    # the unicode width tables decide where a glyph lands, and a moving
    # runner label is free to change all three under a selector with no
    # commit behind it. `ubuntu-24.04` is the same release
    # `journeys/Dockerfile` states as its `FROM`: both pin the Ubuntu
    # release, which is as far as either can pin.
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # An event that is not a `workflow_call` — the nightly, a manual run —
        # carries no inputs, and performs both platforms whatever changed: a
        # pull request only takes macOS when it reaches something macOS can
        # tell apart (`ci.yml`'s `journey_platform_surface`), and this is
        # what stands behind every change it did not take it for.
        target: ${{ fromJSON(inputs.platforms || '[{"platform":"linux","runner":"ubuntu-24.04"},{"platform":"macos","runner":"macos-15"}]') }}
        # The suite ran as one serial queue: forty journeys, 11.5 minutes on
        # Linux and 16.3 on macOS, on the critical path of every run. Every
        # journey builds its own world, so four runners each take an
        # interleaved quarter (`journey.py --shard`); measured against the
        # durations of a green run, the longest quarter is 3.4 and 5.0
        # minutes. `--shard` in the args below and `4` here are one number.
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      # To find a proof, which is an artifact of an earlier run.
      actions: read
    env:
      # What the container image used to set. The frames are read as text, so
      # the locale is part of what a selector matches, and it must be the same
      # on both platforms or the two runs answer different questions.
      LANG: C.UTF-8
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A slice that already passed against this content, on this runner
      # image, is not performed again — the push to `main` after a merge is
      # the case this exists for. The runner image is in the key because the
      # terminal is part of the contract (see `runs-on` above). The nightly
      # and a hand-started run always perform: they are the record.
      # `journey validate` is not part of any proof; the `Python` job in
      # `ci.yml` runs it on every change.
      - id: proof
        name: Look for a run that already proved this slice
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRESH: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          fresh=()
          if [ "${FRESH}" = true ]; then fresh=(--fresh); fi
          python3 .github/scripts/proof.py journeys --platform "${{ matrix.target.platform }}" \
            --shard "${{ matrix.shard }}/4" --runner "${ImageOS}-${ImageVersion}" "${fresh[@]}" >> "${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"
      - name: Already proven
        if: steps.proof.outputs.proven != ''
        env:
          PROVEN: ${{ steps.proof.outputs.proven }}
        run: |
          echo "::notice title=Journeys ${{ matrix.target.platform }} ${{ matrix.shard }}/4 already proven::passed in ${PROVEN}"
          echo "Reused: nothing this slice reads changed since ${PROVEN}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: steps.proof.outputs.proven == ''
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.proof.outputs.proven == ''
        with:
          # The same key `ci.yml`'s `test` job writes. Both build this
          # workspace with this toolchain and these flags — the two cache
          # entries carried the same content hash and half a gigabyte of
          # duplicate dependency builds per branch.
          shared-key: workspace-${{ matrix.target.platform }}
          # Restore everywhere, save only from `main`. The repository sat at
          # 9.91 GB of its 10 GB cache allowance, which means GitHub was
          # evicting by LRU on every run and a "warm cache" was a coin toss.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `.cargo/config.toml` pins `jobs = 2` as a courtesy to a 4-vCPU WSL
      # box. A hosted macOS runner is not that box, and this is the longest
      # job in the gate. macOS only, for the reason `ci.yml`'s `test` job
      # states: the Linux baseline is what every green run so far measured.
      - name: Use the whole runner
        if: runner.os == 'macOS' && steps.proof.outputs.proven == ''
        run: echo "CARGO_BUILD_JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      # Run natively, on the runner itself. A hosted runner is already a
      # disposable machine, and `journey.py` builds its own world under
      # `JOURNEY_WORLDS` with a guard that refuses one overlapping a real
      # home — so the container was never what isolated the run. What it
      # pinned, `runs-on` above now pins directly, for free. macOS runners
      # have no Docker at all, so this is also the only arrangement in which
      # the two platforms perform the same suite the same way.
      #
      # The steps themselves live in a composite action: two platforms
      # proving the same journeys must perform them the same way, and two
      # copies of the same YAML is how that stops being true without anybody
      # noticing.
      #
      # `journeys/Dockerfile` and `make journey-docker` stay for local use —
      # running a journey on your own machine without letting it near your
      # own tmux, HOME or terminal.
      # The previous release `07-upgrade` meets, built from its tag once and
      # kept — built rather than downloaded, so a nightly is never counted
      # as somebody installing that release. The directory holds one binary
      # per tag, so an older entry is a fine start for a newer one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.proof.outputs.proven == ''
        with:
          path: ~/.cache/uze-journeys/released-built
          key: journeys-released-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('journeys/suites/07-upgrade/*.yml') }}
          restore-keys: journeys-released-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/journeys
        if: steps.proof.outputs.proven == ''
        with:
          # Nightly runs everything, not just the gate tag, and records a cast.
          args: ${{ github.event_name == 'schedule' && '--record' || '--tag gate' }} --shard ${{ matrix.shard }}/4

      # Named, because "No files were found" on the upload below is how a
      # failing run lost its own evidence once: the artifact is silent about
      # an empty directory, and the reason it was empty is not visible
      # anywhere else.
      - name: Show what evidence was written
        if: always() && steps.proof.outputs.proven == ''
        run: ls -la journeys/.evidence/ || echo "no evidence directory at all"

      # Uploaded on failure and on the nightly: a journey's evidence is what
      # it read off the machine, and it is the whole point of having run it.
      #
      # `include-hidden-files` because the evidence lives under a dot
      # directory, which the action excludes by default — the step above
      # listed ten evidence directories and this one still reported "No
      # files were found", so the first failing run in CI lost exactly what
      # it was there to produce.
      - name: Keep the evidence
        if: failure() || github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: journey-evidence-${{ matrix.target.platform }}-${{ matrix.shard }}-${{ github.run_id }}
          path: journeys/.evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      # Only a pass is recorded, as an artifact named by its key in the run
      # that performed it.
      - name: Record the proof
        if: success() && steps.proof.outputs.proven == '' && steps.proof.outputs.key != ''
        run: |
          mkdir -p "${RUNNER_TEMP}/proof"
          echo "${ImageOS}-${ImageVersion} at ${GITHUB_SHA}" > "${RUNNER_TEMP}/proof/proof.txt"
      - if: success() && steps.proof.outputs.proven == '' && steps.proof.outputs.key != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.proof.outputs.key }}
          path: ${{ runner.temp }}/proof/proof.txt
          retention-days: 90
          if-no-files-found: error
