workspace:
  worktree: always
  delivery: push
  actions:
    on_change: Commit your work with the git:commit skill.
    on_publish: Open a pull request for this branch with the git:pr skill.
    on_conflict: Resolve the rebase conflicts, then run git rebase --continue and the checks.
    on_fail: Fix the failing checks and commit with the git:commit skill.
  branch: conventional
  artifacts: docs

marketplaces:
  ai:
    git: https://github.com/hiukky/ai
    plugins:
      - git
      - tui
      - openspec
      - code
