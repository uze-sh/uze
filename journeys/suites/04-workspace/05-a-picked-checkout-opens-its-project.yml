journey: a directory picked inside an agent's checkout places the agent in its project, not in the checkout
tags: [gate, tui, workspace]
proves: web/content/docs/workspace/index.mdx
about: |
  A new agent is placed in the directory chosen for it. An agent's checkout
  under `.worktrees/<id>` belongs to the repository it was cut from, so
  choosing it places the new agent in that repository, by its worktree
  policy, rather than in another agent's checkout.

  UZE opens in the home directory, so the project is reached by typing it.
  Where the agent landed is read off what UZE records and the process
  table, never off the sidebar. The checkout is laid down by hand: the
  claim is about the choice, and placing agents is proven elsewhere.

world:
  project: demo-app
  manifest: |
    workspace:
      worktree: always
      target: main
      slots: 2

scenes:
  - scene: uze opens outside the project, which holds an agent's checkout
    when:
      - shell: |
          set -e
          git -C {project} worktree add -q -b agent/t0pick .worktrees/t0pick HEAD
        say: the project holds a checkout under its isolation directory
      - open: ["{uze}", "workspace"]
        in: "{home}"
        say: uze opens in the home directory, not in the project
        # A pattern, like every `expect`: the `+` is escaped.
        expect: '\+ space'
        expect_timeout: 20
        pause: 1.0
    then:
      - dir: "{project}/.worktrees/t0pick"
        count: 1
        about: the checkout exists to be picked

  - scene: choosing the checkout for a new agent places it in the project
    when:
      - click: "new"
        say: open the new-agent popup
        in: sidebar
        expect: 'harness .*Claude Code'
      - type: "{project}/.worktrees/t0pick"
        say: name the agent's checkout itself
        submit: false
        pause: 0.5
      - key: "Enter"
        say: start the agent there
        # The tab, not the header's `agent 1: preparing`: the tab opens
        # once the checkout exists, and the checks below read it.
        expect: 'agent 1(?!: preparing)'
        expect_timeout: 90
        pause: 1.5
    then:
      - tasks: { count: 1, states: [running] }
        about: the agent is recorded under the project the checkout was cut from
      - dir: "{project}/.worktrees/*"
        count: 2
        about: the agent took a checkout of its own beside the one picked
      - process: { matching: claude, cwd: "/.worktrees/", alive: true }
        about: the agent runs in a checkout of the project
      - git: { in: "{project}/.worktrees/t0pick", dirty: false }
        about: the checkout picked was left as it was
