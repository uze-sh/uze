journey: an extension's band over the agent and its row in the sidebar appear once the operator enables it, and a preference they change redraws both
tags: [gate, tui, workspace]
about: |
  The operator's side of an extension that draws in the workspace's chrome
  rather than in a view of its own: `deck`, the slots' reference plugin,
  composes a two-row band over each agent's pane and a row in the
  sidebar's header from the checkout's `.planning/phases`, and declares a
  toggle preference that says whether the band names each phase. Installed
  without a terminal it is disabled; the workspace offers it, the operator
  enables it, both appear, and turning the preference off in the
  Extensions screen redraws them without the names.

  The machine is what each scene checks: the consent record in
  `state/extensions.json`, the preference in the operator's
  `config.toml` under `[preferences."deck@studio/deck"]`, and the
  checkout the script read and never wrote. The screen only gates each gesture.

world:
  project: demo-app
  commits:
    - message: "chore: initial commit"
      files:
        README.md: "# demo-app\n"
    - message: "docs: plan the milestone"
      files:
        .planning/phases/09-alpha/01-PLAN.md: "# Plan\n"
        .planning/phases/09-alpha/01-SUMMARY.md: "# Summary\n"
        .planning/phases/10-beta/01-PLAN.md: "# Plan\n"
        .planning/phases/10-beta/02-PLAN.md: "# Plan\n"
        NOTES.md: "- [ ] Ship the band\n"
  # `tests/_fixtures/canonical/deck`, staged as a marketplace's plugin: a
  # container mounts only `journeys/`, so the fixture is carried here.
  files:
    market/marketplace.json: |
      {
        "name": "studio",
        "description": "A marketplace this journey stages and installs from its clone.",
        "plugins": [
          { "name": "deck", "source": "./plugins/deck", "description": "The slots' reference extension." }
        ]
      }
    market/plugins/deck/plugin.json: |
      {
        "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
        "name": "deck",
        "version": "1.0.0",
        "description": "The deck reference extension: a composed band over each agent's pane, a status row, an overlay picker, an events log and a notification."
      }
    market/plugins/deck/extensions/deck/extension.kdl: |
      protocol 1
      id "deck"
      name "Deck"
      description "The checkout's phases over each agent, its notes in a picker, and what changed"

      wants "read:checkout" "clipboard" "notify"

      surface "phases" slot="band" rows=2 place="top" view="waiting.uze" source="phases" title="Phases"
      surface "count" slot="status" view="count.uze" source="phases" title="Phases"
      surface "log" slot="view" view="log.uze" source="changes" title="Deck"
      surface "picker" slot="overlay" view="picker.uze" source="notes" title="Notes"

      preferences {
          toggle "detail" label="Show each phase's name" default=#true
      }

      source "phases" {
          script "phases.uze"
          output "view"
          preferences
          refresh-on "paths.changed" ".planning"
      }

      source "notes" {
          script "notes.uze"
          input file="NOTES.md"
      }

      source "changes" { events 20; }

      action "pick" label="Pick a note" on="log" key="ctrl-p" {
          open "picker"
      }

      action "copy-note" label="Copy" on="picker" {
          clipboard "{text}"
      }

      action "done" label="Say done" on="log" {
          call "done"
      }
    market/plugins/deck/extensions/deck/waiting.uze: |
      <view>
      Text "Reading the phases…" role="faint"
      </view>
    market/plugins/deck/extensions/deck/count.uze: |
      <view>
      Text "Phases" role="faint"
      </view>
    market/plugins/deck/extensions/deck/log.uze: |
      <view>
      Stack gap=1 {
          Row gap=2 {
              Text "What changed" strong=#true grow=#true
              Button "Pick a note" action="pick"
              Button "Say done" action="done"
          }
          List each="." {
              Text "{name} {paths}"
          }
          Text "Nothing changed yet" role="faint" unless="."
      }
      </view>

      <script>
      fn done(input, context) {
          #{
              data: (),
              notify: #{ title: "Deck", body: "The phases are up to date" },
              sound: "done",
          }
      }
      </script>
    market/plugins/deck/extensions/deck/picker.uze: |
      <view>
      List each="items" {
          Row gap=2 {
              Text "{text}" grow=#true
              Button "Copy" action="copy-note" item="{.}"
          }
      }
      </view>
    market/plugins/deck/extensions/deck/notes.uze: |
      <script>
      fn answer(input, context) {
          let open = [];
          for line in lines(read_checkout(input.file)) {
              if line.starts_with("- [ ] ") {
                  open.push(#{ text: line.sub_string(6) });
              }
          }
          #{ data: #{ items: open } }
      }
      </script>
    market/plugins/deck/extensions/deck/phases.uze: |
      <script>
      // A row of the milestone's phases, each a segment weighted by its
      // plans and filled by how many are summarized; named when the
      // `detail` preference says so.
      fn answer(input, context) {
          let phases = [];
          for entry in list_checkout(".planning/phases") {
              if entry.kind == "dir" {
                  let plans = 0;
                  let done = 0;
                  for file in list_checkout(`.planning/phases/${entry.name}`) {
                      if file.name.ends_with("-PLAN.md") { plans += 1; }
                      if file.name.ends_with("-SUMMARY.md") { done += 1; }
                  }
                  phases.push(#{ name: entry.name, plans: plans, done: done });
              }
          }
          let segments = [];
          for phase in phases {
              let ratio = if phase.plans == 0 { 0.0 } else { phase.done.to_float() / phase.plans.to_float() };
              segments.push(#{
                  type: "Segment",
                  props: #{ weight: if phase.plans == 0 { 1 } else { phase.plans }, ratio: ratio,
                            role: if ratio >= 1.0 { "success" } else { "accent" } },
              });
          }
          let label = if input.preferences.detail {
              let names = [];
              for phase in phases { names.push(phase.name); }
              `${phases.len()} phases · ${names}`
          } else {
              `${phases.len()} phases`
          };
          #{ data: #{ type: "Stack", children: [
              #{ type: "Text", args: [label], props: #{ role: "muted" } },
              #{ type: "Progress", children: segments },
          ] } }
      }
      </script>

scenes:
  - scene: a plugin installed from a marketplace's clone leaves its band and row disabled
    when:
      - shell: "{uze} market add {world}/market"
        say: register the marketplace, linked to nothing
      - shell: "cd {project} && {uze} add deck@studio > {world}/install.log 2>&1"
        say: add the plugin to the project, with nobody at a terminal to answer
    then:
      - file: "{uze_home}/sources/plugins/studio/deck/extensions/deck/phases.uze"
        contains: "input.preferences.detail"
        about: the extension's script was installed from the clone, into UZE's sources
      - file: "{uze_home}/state/extensions.json"
        exists: false
        about: nobody consented to anything, and nothing was enabled
      - cmd:
          run: "! grep -qs '^\\[preferences\\.' {uze_home}/config.toml"
        about: and nobody set a preference

  - scene: and then the workspace offers it, and once enabled its band stands over the agent and its row in the sidebar, both naming the phases
    when:
      - open: ["{uze}", "workspace"]
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - click: "new"
        say: open the new-agent popup from the space's row
        in: sidebar
        expect: 'overrides .*Claude Code'
      - type: "{project}"
        say: place an agent on the project
        expect: "Deck runs nothing there yet"
        expect_timeout: 90
      - click: "Review"
        say: review the extension the project offers
        expect: "Enable Deck in demo-app"
        expect_timeout: 10
      - click: "Enable 1"
        say: allow its grants and enable it here
        expect: "extension enabled"
        expect_timeout: 10
      - wait: screen
        until: '2 phases · \["09-alpha", "10-beta"\]'
        in: pane
        timeout: 20
        say: the band over the agent's pane names both phases
      - wait: screen
        until: '2 phases · '
        in: sidebar
        timeout: 20
        say: and the row in the sidebar's header draws the same answer
    then:
      - json: "{uze_home}/state/extensions.json"
        at: extensions.deck@studio/deck.accepted_grants.*
        count: 3
        includes: ["read:checkout", "clipboard", "notify"]
        about: the consent holds exactly the grants it wants
      - json: "{uze_home}/state/extensions.json"
        at: extensions.deck@studio/deck.enabled_in.*
        equals: "{project}"
        count: 1
        about: and it is enabled in this project, and in no other
      - cmd:
          run: "! grep -qs '^\\[preferences\\.' {uze_home}/config.toml"
        about: the band names the phases by the preference's default, with nothing set
      - capture:
          name: before-the-preference
          tree: ["{project}"]
          except: ["demo-app/.git/*", "demo-app/.worktrees/*/.git"]

  - scene: and then the operator turns the preference off in the Extensions screen, and the band and the row are drawn without the names
    when:
      - click: "≡"
        say: cross to the management modal by the sidebar's own control
        in: sidebar
        expect: Marketplace
        expect_timeout: 20
        pause: 1.0
      - click: "Extensions"
        say: open its Extensions screen from its tab, the first match from the top
        expect: "from plugins"
        expect_timeout: 20
        pause: 1.0
      # The card's own line: the tab strip's `Deck` chip sits above it,
      # outside the modal.
      - click: "deck@studio"
        say: choose the extension, which its drawer then describes
        expect: "grants"
        expect_timeout: 10
      - key: "F1"
        say: open the action index
        expect: "type to narrow"
        expect_timeout: 10
      # The drawer follows the keys to the preference, below its grants.
      - type: "Preferences"
        say: put the keys on its preferences from the index
        expect: 'Show each phase''s name {2,}off {2,}on'
        expect_timeout: 10
      - key: "Enter"
        say: turn the toggle off, which the recorded answer below proves
        expect: 'Show each phase''s name {2,}off {2,}on'
        expect_timeout: 10
      - wait: shell
        until: "grep -q 'detail = false' {uze_home}/config.toml"
        timeout: 10
        say: the answer is written before the modal is put away
      - key: ["Escape", "Escape"]
        say: give the keys back to the cards, then back to the workspace
        expect: "first steps"
        expect_timeout: 10
      - wait: screen
        until: '2 phases {5,}'
        in: pane
        timeout: 20
        say: the band is drawn again, without the names
      - wait: screen
        until: '2 phases {5,}'
        in: sidebar
        timeout: 20
        say: and so is the row in the sidebar's header
    then:
      - file: "{uze_home}/config.toml"
        contains: "[preferences.\"deck@studio/deck\"]\ndetail = false"
        about: the operator's answer is in their config, for this extension only
      - tree: ["{project}"]
        except: ["demo-app/.git/*", "demo-app/.worktrees/*/.git"]
        same_as: before-the-preference
        about: the script read the checkout again and wrote nothing into it
