journey: an agent continues in another harness and comes back to the conversation it left
tags: [gate, tui, workspace]
proves: web/content/docs/workspace/agents.mdx
about: |
  When the harness an agent runs on stops being able to work, the operator
  continues the same agent on another one: same identity, same directory,
  same name. The harness taking over cannot read the other vendor's
  conversation, so UZE records a briefing beside the agent and gives it to
  the new process as the agent's context, through the harness's own
  channel: no turn the operator did not type, and given again when the
  agent is restored. The harness left behind keeps its conversation, and
  switching back resumes it.

  Read off the machine: the agent record names the harness it runs now;
  the briefing is in the agent's continuity record and in a context file
  only its owner can read, outside the project; the incoming harness's argv
  carries the channel that points at that file and never the briefing's
  text or a first turn, on the first launch and on a restart alike; and the
  harness switched back to resumes the conversation its first launch
  created, with its own channel carrying what it missed.

world:
  project: demo-app
  manifest: |
    workspace:
      target: main

scenes:
  - scene: an agent starts on one harness
    when:
      - shell: "{uze} setup"
        say: the operator provisions their harnesses, which installs the launchers
      - open: ["{uze}", "workspace"]
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - click: "new"
        say: open the new-agent picker
        in: sidebar
        expect: 'harness .*Claude Code'
      - type: "{project}"
        say: place a Claude agent
        expect: Claude Code v
        expect_timeout: 45
        pause: 2.0
    then:
      - agents: { count: 1, live: 1, isolated: 0 }
        about: one agent, in the project directory
      - file: "{world}/bin/.invocations/claude.log"
        contains: "--session-id"
        about: the harness was told which conversation to open

  - scene: the agent continues in another harness, from the keyboard alone
    when:
      - key: "M-."
        say: open the selected agent's actions
        expect: "Continue in…"
      - key: "Down"
        say: move onto continuing elsewhere
        expect: "Continue in…"
        pause: 0.3
      - key: "Right"
        say: open the harnesses it can continue in
        expect: "Codex"
      - key: "Enter"
        say: continue it in Codex
        expect: Codex v
        expect_timeout: 45
        pause: 2.0
    then:
      - agents: { count: 1, live: 1, isolated: 0 }
        about: still the one agent, standing where it stood
      - file: "{uze_home}/state/projects/*/agents.json"
        contains: '"harness": "codex"'
        about: and its record names the harness it runs now
      - file: "{uze_home}/state/projects/*/conversations/*.json"
        contains: '"briefing"'
        about: a briefing was recorded beside the agent for the harness taking over
      - file: "{uze_home}/runtime/projects/*/agents/*/context.md"
        contains: "## Briefing"
        about: and composed into the agent's context for this launch
      - cmd:
          run: >
            case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) exit 0 ;; esac;
            test "$(ls -l {uze_home}/runtime/projects/*/agents/*/context.md | cut -c1-10)" = "-rw-------"
        about: |
          readable by its owner alone — a mode where there are modes; on
          Windows it is an ACL, which uze-platform's own tests hold
      - cmd:
          run: test -z "$(find {project} -name 'context.md' -o -path '*briefing*')"
        about: and nothing of it was written into the project
      - cmd:
          run: >
            line=$(tail -1 {world}/bin/.invocations/codex.log);
            case "$line" in *"hooks.SessionStart"*"context.md"*) ;; *) exit 1 ;; esac;
            case "$line" in *"carry on."*|*"Agent:"*) exit 1 ;; esac
        about: |
          the incoming harness is handed the hook that prints the context
          file — a path, never the briefing's text — and no first turn

  - scene: a restart relaunches the agent with its context and no turn
    when:
      - kill: "{uze}"
        say: kill everything holding this workspace, the way a reboot does it
      - open: ["{uze}", "workspace"]
        say: open the workspace again, which restores what it held
        expect: demo-app
        expect_timeout: 25
        pause: 3.0
      - click: agent 1
        say: walk into the agent that came back
        in: sidebar
        expect: Codex v
        expect_timeout: 30
        pause: 1.5
    then:
      - agents: { count: 1, live: 1, isolated: 0 }
        about: the agent came back as itself
      - cmd:
          run: test "$(wc -l < {world}/bin/.invocations/codex.log)" -ge 2
        about: the restart launched the agent's harness again
      - cmd:
          run: >
            test "$(grep -c 'hooks.SessionStart' {world}/bin/.invocations/codex.log)" -ge 2 &&
            test "$(grep -c 'carry on.' {world}/bin/.invocations/codex.log)" = 0
        about: |
          the restored launch was given the context again, and no launch was
          given a turn the operator did not type

  - scene: once the agent commits, its briefing retires and the next launch is not told it again
    when:
      - shell: >
          git -C {project} -c user.name=agent -c user.email=agent@example.com
          commit --allow-empty -q -m "chore: carry on in codex"
        say: the agent lands its first commit on the harness it was moved to
      - wait: shell
        until: "! grep -q '\"briefing\"' {uze_home}/state/projects/*/conversations/*.json"
        timeout: 30
        say: the workspace sees the work moved past the switch
      - kill: "{uze}"
        say: kill everything holding this workspace again
      - open: ["{uze}", "workspace"]
        say: and open it once more
        expect: demo-app
        expect_timeout: 25
        pause: 3.0
      - click: agent 1
        say: walk into the agent
        in: sidebar
        expect: Codex v
        expect_timeout: 30
        pause: 1.5
    then:
      - cmd:
          run: >
            f=$(ls -t {uze_home}/runtime/projects/*/agents/*/context.md | head -1);
            test -n "$f" && ! grep -q "## Briefing" "$f"
        about: |
          the relaunch after the commit is composed without the briefing;
          what is left is the agent's memory, which every launch carries
      - cmd:
          run: >
            line=$(tail -1 {world}/bin/.invocations/codex.log);
            case "$line" in *"carry on."*|*"Agent:"*) exit 1 ;; esac
        about: and no launch hands the briefing over as a turn or an argument

  - scene: switching back resumes the conversation the first harness left
    when:
      - key: "M-."
        say: open the agent's actions again
        expect: "Continue in…"
      - key: "Down"
        say: move onto continuing elsewhere
        expect: "Continue in…"
        pause: 0.3
      - key: "Right"
        say: open the harnesses it can continue in
        expect: "Claude Code"
      - key: "Enter"
        say: continue it back in Claude
        expect: Claude Code v
        expect_timeout: 45
        pause: 2.0
    then:
      - agents: { count: 1, live: 1, isolated: 0 }
        about: still the one agent
      - file: "{uze_home}/state/projects/*/agents.json"
        contains: '"harness": "claude-code"'
        about: and its record names Claude again
      - cmd:
          run: >
            log={world}/bin/.invocations/claude.log;
            started=$(sed -n 's/^--session-id \([^ ]*\).*/\1/p' "$log" | head -1);
            resumed=$(sed -n 's/^--resume \([^ ]*\).*/\1/p' "$log" | tail -1);
            test -n "$started" && test "$started" = "$resumed"
        about: |
          Claude was told to resume the conversation its first launch
          created, not to open a second one
      - file: "{home}/.claude/projects/*/*.jsonl"
        count: 1
        about: one Claude conversation, the same one
      - cmd:
          run: >
            line=$(tail -1 {world}/bin/.invocations/claude.log);
            case "$line" in *"--add-dir"*agents*) ;; *) exit 1 ;; esac
        about: Claude is handed the agent's context directory
      - file: "{uze_home}/runtime/projects/*/agents/*/CLAUDE.md"
        contains: "You worked on this agent before"
        about: and it was briefed only on what happened while it was away
