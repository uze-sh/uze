journey: a repository under a folder that is not one is reachable from the new agent's directory prompt
tags: [gate, tui, workspace]
proves: web/content/docs/workspace/index.mdx
about: |
  Checkouts are rarely siblings of the one you are in. They sit in a
  folder of projects, often grouped a level further down, and the folder
  holding them is not itself a repository.

  The prompt has to be able to walk there. It used to filter the listing
  down to repositories and the folders leading to one, and a folder that
  led nowhere was not drawn at all. Typing the path instead did not work
  either: a separator walked into whichever row was selected and cleared
  the line, so the path never survived being typed.

  Read off the machine, the claim is one fact: the agent started is
  running in the repository two folders down.

world:
  project: demo-app
  manifest: |
    workspace:
      target: main
      slots: 2

scenes:
  - scene: a repository grouped under a folder that is not one
    when:
      - shell: |
          set -e
          mkdir -p {world}/projects/group/engine
          cd {world}/projects/group/engine
          git init --quiet --initial-branch main
          git config user.email agent@uze.test
          git config user.name uze
          printf 'fn main() {}\n' > main.rs
          git add -A
          git commit -qm 'feat: the engine'
        say: another project, a folder deeper than the one uze opened on
    then:
      - dir: "{world}/projects/group/engine/.git"
        count: 1
        about: the repository exists, one folder below where the prompt starts
      - dir: "{world}/projects/group/.git"
        count: 0
        about: and the folder holding it is not one itself

  - scene: the path typed reaches it, and the agent starts there
    when:
      - open: ["{uze}", "workspace"]
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - click: "new"
        say: open the new-agent popup
        in: sidebar
        expect: 'harness .*Claude Code'
      - type: "{world}/projects/group"
        say: name the folder on the way, which used to be drawn nowhere
        submit: false
        pause: 0.5
      - wait: screen
        until: "group"
        in: pane
        timeout: 10
        say: the folder is a row like any other
      - type: "/engine"
        say: keep typing the path — the separator is a character, not a gesture
        submit: false
        pause: 0.5
      - key: "Enter"
        say: start the agent there
        # The tab, not the header's `agent 1: preparing`: the tab opens
        # once the agent's directory is ready.
        expect: 'agent 1(?!: preparing)'
        expect_timeout: 90
        pause: 2.0
    then:
      - process: { matching: claude, cwd: "/projects/group/engine", alive: true }
        about: the agent runs in the repository two folders down, not in the folder on the way
      - dir: "{project}/.worktrees/*"
        count: 0
        about: and nothing was placed in the project uze opened on
