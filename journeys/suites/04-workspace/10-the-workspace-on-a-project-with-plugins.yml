journey: the workspace opened on a project that already has plugins
tags: [gate, tui, workspace]
proves: web/content/docs/workspace/terminal.mdx
about: |
  The workspace builds on the package manager and never the reverse. Opened
  on a project that already installed its plugins and chose a policy, it
  writes nothing into the project's AGENTS.md, puts its shims first on PATH
  in its own panes so a harness typed there goes through them, and leaves
  the package manager's lock exactly as it was.

world:
  project: demo-app
  manifest: |
    workspace:
      delivery: push
  files:
    market/marketplace.json: |
      {
        "name": "demo",
        "description": "A marketplace this journey stages.",
        "plugins": [
          { "name": "flow", "source": "./plugins/flow", "description": "Canonical skill plugin." }
        ]
      }
    market/plugins/flow/plugin.json: |
      {
        "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
        "name": "flow",
        "version": "1.0.0",
        "description": "Canonical: one package, no vendor manifests."
      }
    market/plugins/flow/skills/commit/SKILL.md: |
      ---
      name: commit
      description: Write a commit message from the staged diff.
      ---

      The body a harness would read.

scenes:
  - scene: the package manager set the project up, and wrote nothing of the workspace's
    when:
      - shell: "{uze} setup"
        say: provision every registered harness
      - shell: "{uze} market add {world}/market"
        say: register the staged marketplace
      - shell: "cd {project} && {uze} flow@demo && {uze} install && cp agents.lock {world}/lock.before"
        say: add and install the plugin, and remember the lock's bytes
    then:
      - file: "{project}/AGENTS.md"
        exists: false
        about: install begins no AGENTS.md, which is the team's page

  - scene: and then the workspace opens, and a harness typed into a pane goes through the shim
    when:
      - open: ["{uze}", "workspace"]
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      # Asked through Python rather than the shell's own `command -v`: the
      # pane's shell is bash here and PowerShell on Windows, and one line
      # both run is the same question asked of the PATH the pane holds. One
      # expression, because tmux reads a typed `;` as the end of its command.
      - type: >-
          {python} -c "__import__('pathlib').Path(r'{world}/which-claude').write_text(__import__('pathlib').Path(__import__('shutil').which('claude')).as_posix())"
        say: ask the pane which claude it would run
        # No `expect`: the line is long enough to wrap wherever the
        # interpreter's path puts it, and the answer landing on disk below
        # is the proof the line ran.
      - wait: shell
        until: test -s {world}/which-claude
        timeout: 20
        say: the answer lands on disk
    then:
      - file: "{world}/which-claude"
        contains: "{uze_home}/shims"
        about: the pane put the workspace's shims first on PATH
      - file: "{shell_rc}"
        exists: false
        about: and no shell startup file was written for it

  - scene: and then the package manager's lock is exactly as it was
    when:
      - wait: shell
        until: cmp -s {project}/agents.lock {world}/lock.before
        timeout: 5
        say: compare the lock's bytes with the ones remembered
    then:
      - file: "{project}/agents.lock"
        contains: "flow"
        about: the workspace changed nothing the package manager owns
      - file: "{project}/AGENTS.md"
        exists: false
        about: nor began the team's page, though its policy is in force
