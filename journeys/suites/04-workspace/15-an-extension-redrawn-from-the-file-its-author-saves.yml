journey: a plugin's declared extension opens in the workspace and is redrawn from the file its author saves
tags: [gate, tui, workspace]
about: |
  The author's loop for an extension a plugin declares in KDL: the plugin
  comes from a marketplace linked to the author's working tree, its board
  opens from the tab strip drawn from its fixture, a tab is switched
  without anything being read or written, and a save to the view in the
  working tree is what the open board shows next — without a reinstall.

  The machine is what each scene checks: the compiled view the workspace
  keeps in its generated tier, the Store's copy the save never touched,
  and the files a tab switch leaves exactly as they were. The screen only
  gates each gesture.

world:
  project: demo-app
  files:
    market/marketplace.json: |
      {
        "name": "studio",
        "description": "A marketplace this journey stages and links.",
        "plugins": [
          { "name": "gsd", "source": "./plugins/gsd", "description": "The gsd-band reference extension." }
        ]
      }
    market/plugins/gsd/plugin.json: |
      {
        "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
        "name": "gsd",
        "version": "1.0.0",
        "description": "The gsd-band reference extension: a board view and a sidebar section declared in KDL and drawn from a fixture."
      }
    market/plugins/gsd/extensions/gsd-band/extension.kdl: |
      protocol 1
      id "gsd-band"
      name "GSD"
      description "The checkout's GSD milestone: every phase, where it stands, and what to run next"

      surface "board" slot="view" view="board.kdl" source="milestone" title="Milestone"
      surface "summary" slot="section" view="summary.kdl" source="milestone" title="GSD"

      source "milestone" {
          fixture "fixtures/milestone.json"
      }
    market/plugins/gsd/extensions/gsd-band/board.kdl: |
      // The colour a phase's state is drawn in.
      lookup "tone" default="muted" {
          done "success"
          running "warning"
          ready "info"
          waiting "faint"
      }

      // What each state is called, in the operator's language.
      lookup "state" locale="en" default="" {
          done "Done"
          running "In progress"
          ready "Ready to discuss"
          waiting "Waiting"
      }
      lookup "state" locale="pt" default="" {
          done "Concluída"
          running "Em execução"
          ready "Pronta para discussão"
          waiting "Aguardando"
      }

      lookup "t" locale="en" {
          phases "Phases"; log "Activity"; now "Now"; next "Run phase"
          left "left"; plans "plans"; of "of"; done "done"; empty "Nothing in this milestone yet"
          phase "Phase"; status "Status"; quiet "No activity yet"
      }
      lookup "t" locale="pt" {
          phases "Fases"; log "Atividade"; now "Agora"; next "Executar fase"
          left "faltam"; plans "planos"; of "de"; done "concluídas"; empty "Nada neste milestone ainda"
          phase "Fase"; status "Situação"; quiet "Nenhuma atividade ainda"
      }

      Stack gap=1 {
          // The milestone and the one action that moves it.
          Row align="center" gap=2 {
              Text "{milestone}" strong=#true
              Text "{title}" role="muted" grow=#true truncate=#true
              Button "{t::next} {next.number}" action="next" item="{next}" when="next"
          }

          // How far the milestone is: one segment per phase, as wide as its plans.
          Row gap=2 {
              Progress grow=#true {
                  Segment each="phases" weight="{weight}" ratio="{ratio}" role="{tone:state}"
              }
              Text "{percent}%" strong=#true
              Text "{finished} {t::of} {total} {t::done}" role="muted"
          }

          Tabs id="tab" {
              Tab "{t::phases}" value="phases"
              Tab "{t::log}" value="log"
          }

          Stack gap=1 show="ui.tab=phases" {
              Table "#" "{t::phase}" "D" "P" "E" "Plans" "{t::status}" empty="{t::empty}" {
                  // A phase: its number and name, the three steps a GSD phase
                  // goes through (discuss, plan, execute), its plans and its state.
                  Row each="phases" {
                      Text "{number}" role="muted"
                      Text "{name}" truncate=#true
                      Marks { Mark role="{tone:discussed}"; }
                      Marks { Mark role="{tone:planned}"; }
                      Marks { Mark role="{tone:executed}"; }
                      Row {
                          Text "{summaries}/{plans}" role="muted" when="plans"
                          Text "–" role="faint" unless="plans"
                      }
                      Text "{state:state}" role="{tone:state}"
                  }
              }

              // The phase in progress, and exactly what is left of it.
              Stack when="current" {
                  Row gap=2 {
                      Badge "{t::now}" role="warning"
                      Text "{current.number} · {current.name}" strong=#true
                      Pips done="{current.done}" total="{current.total}"
                      Text "{current.left} {t::plans} {t::left}" role="muted"
                  }
                  List each="current.remaining" {
                      Row gap=1 {
                          Text "{id}" role="muted" min-width=6
                          Text "{title}" truncate=#true
                      }
                  }
              }
          }

          Stack show="ui.tab=log" {
              Log lines="{activity}" when="activity"
              Text "{t::quiet}" role="faint" unless="activity"
          }
      }
    market/plugins/gsd/extensions/gsd-band/summary.kdl: |
      // The milestone at a glance, for the sidebar's narrow column.
      lookup "tone" default="muted" {
          done "success"
          running "warning"
          ready "info"
          waiting "faint"
      }

      Stack {
          Row gap=1 {
              Text "{milestone}" strong=#true
              Text "{percent}%" role="muted"
          }
          Progress {
              Segment each="phases" weight="{weight}" ratio="{ratio}" role="{tone:state}"
          }
          Row gap=1 when="current" {
              Text "{current.number}" role="warning"
              Text "{current.name}" truncate=#true grow=#true
              Text "{current.done}/{current.total}" role="muted"
          }
      }
    market/plugins/gsd/extensions/gsd-band/fixtures/milestone.json: |
