journey: closing what an agent was working in does not take its work
tags: [gate, tui, recovery]
proves: web/content/docs/workspace/agents.mdx
about: |
  An agent's work is bound to the project it belongs to and never to what
  it happened to be opened in: its record carries a base, a branch, a
  checkout and a target, and nothing about a space or a tab. So closing
  what the agent was in — by accident, or because the screen was getting
  full — must cost nothing but that.

  The surface that says so is the sidebar's recent mode, which lists every
  agent no pane carries, across every project UZE has recorded. A list
  that answered only for the repositories the session had already looked
  at would miss a project with nothing open, precisely the case it exists
  for, since the thing being gone is *why* the work needs finding.

  What the machine must show: after the agent's tab is closed and the agent
  ended unfinished, the work is still in the repository on its own branch,
  the records still name the repository they belong to, and the list still
  has it. The checkout itself goes back to the pool: work is kept in Git,
  never in a directory.

world:
  project: demo-app
  manifest: |
    workspace:
      worktree: always
      target: main
      slots: 3

scenes:
  - scene: an agent with work committed in a checkout of its own
    when:
      - open: ["{uze}", "workspace"]
        say: uze opens on the project
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - click: "new"
        say: open the new-agent picker
        in: sidebar
        expect: 'harness .*Claude Code'
      - type: "{project}"
        say: pick Claude Code
        # The tab, not the header's `agent 1: preparing`: the tab opens
        # once the checkout exists, and the checks below read it.
        expect: 'agent 1(?!: preparing)'
        expect_timeout: 90
        pause: 1.5
      - shell: |
          set -e
          slot=$(ls -d {project}/.worktrees/*/ | head -1)
          printf 'pub fn kept() {}\n' > "$slot/src/kept.rs"
          git -C "$slot" add -A
          git -C "$slot" commit -qm 'feat(api): work worth keeping'
        say: the agent commits work
      # A first commit names unnamed work from its subject, and the
      # workspace sees the commit within a second: the branch the record
      # is read for below is the named one, not a name about to change.
      - wait: shell
        until: test -z "$(git -C {project} branch --list 'agent/*')"
        timeout: 30
        say: the work is named from its first commit
    then:
      - agents: { count: 1, live: 1, isolated: 1 }
        about: one agent, isolated, with a checkout of its own
      - file: "{project}/.worktrees/*/src/kept.rs"
        count: 1
        about: and its work is on disk

  - scene: what the agent was working in is closed, and the work is not
    when:
      - shell: |
          set -e
          {python} -c "
          import json, glob
          [store] = glob.glob('{uze_home}/state/projects/*/agents.json')
          [agent] = [a for a in json.load(open(store))['agents'] if a.get('isolation')]
          print(agent['isolation']['branch'])
          " > {world}/branch
        say: the branch the work is on, read from the record
      - key: "C-w"
        say: close the tab the agent was in, which ends it unfinished
        # What the gesture *causes*: the agent is gone and its work is
        # not, which is the toast UZE raises and the whole claim of this
        # journey. `uze` proved only that a screen was still drawn — true
        # on Linux by accident of what else was on it, and false on macOS.
        expect: work kept
        expect_timeout: 25
        pause: 2.0
    then:
      - cmd:
          run: |
            {python} -c "
            import json, glob, pathlib
            [marker] = glob.glob('{uze_home}/state/projects/*/project.json')
            print(pathlib.Path(json.load(open(marker))['root']).as_posix())
            "
          stdout_contains: "{project}"
        about: the records still name the repository they belong to
      - cmd:
          run: git -C {project} branch --list "$(cat {world}/branch)"
          stdout_contains: feat/
        about: and the branch the work is on is still in the repository
      - cmd:
          run: git -C {project} show "$(cat {world}/branch):src/kept.rs"
          stdout_contains: "pub fn kept"
        about: with the commit on it, whatever became of the checkout

  - scene: the work is found again without the tab that held it
    when:
      - key: "M-p"
        say: open recent
        expect: "a all"
        expect_timeout: 20
        pause: 1.0
      # Every agent, not only the named ones: what this scene claims is
      # that the list finds the work, whatever it was called.
      - key: "a"
        say: list every agent, not only the named ones
        # A block's heading is drawn only over a row in it, so either one
        # says the list found the agent.
        expect: "needs you|others"
        expect_timeout: 20
        pause: 1.5
    then:
      # The gesture's `expect` is what proves the list opened and found
      # something; what it *says* is asserted where that is cheaper and
      # more precise, in `src/ui/`'s own TestBackend tests.
      - tasks: { count: 1 }
        about: the record is still the one agent's, untouched by the tab going
      - agents: { count: 1, isolated: 1 }
        about: and it is still isolated, on its own branch
