journey: an agent's work reaches the target branch, and says what it will do before doing it
tags: [gate, tui, delivery]
proves: web/content/docs/workspace/agents.mdx
about: |
  The end of the loop. An agent commits in its own checkout; the project's
  branch does not move because of it. When the work is deliverable the
  workspace's status *names where it would go* — `→ main`, and how much it
  would send — and a click on it delivers, as the deliver key does.

  Before that, while the work is uncommitted, clicking the status asks the
  agent what the project declared for that state, and moves nothing; the
  journey reads the branch after each gesture to check which one acted.

world:
  project: demo-app
  manifest: |
    workspace:
      worktree: always
      target: main
      delivery: merge
      slots: 3
      actions:
        on_change: Commit your work, then end your turn.

scenes:
  - scene: an agent, working in a checkout of its own
    when:
      - open: ["{uze}", "workspace"]
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - click: "new"
        say: open the new-agent picker
        in: sidebar
        expect: 'harness .*Claude Code'
      - type: "{project}"
        say: pick Claude Code
        expect: Claude Code v
        expect_timeout: 45
        pause: 1.5
    then:
      - tasks: { count: 1, states: [running] }
      - git: { in: "{project}", dirty: false }
        about: nothing has happened to the project yet
      - capture: { name: slots, dirs: "{project}/.worktrees/*" }

  - scene: clicking the status asks the agent what the project declared, and moves nothing
    when:
      - shell: |
          set -e
          slot=$(ls -d {project}/.worktrees/*/ | head -1)
          printf 'pub fn ping() -> &str { "pong" }\n' > "$slot/src/ping.rs"
        say: the agent changes a file and has not committed it
      - wait: screen
        until: "uncommitted"
        in: strip
        timeout: 40
        settle: 1.0
        say: the declared on_change instruction puts a status in the strip
      - click: "uncommitted"
        say: click the status, which the project answers with an instruction
        in: strip
        expect: "Commit your work"
        expect_timeout: 20
      - wait: screen
        until: "Commit your work, then end your turn."
        in: pane
        timeout: 20
        say: the instruction is typed into the agent's own pane
    then:
      - cmd:
          run: "git -C {project} log --oneline -1"
          stdout_contains: "chore: declare the worktree policy"
        about: the target has not moved, because asking the agent delivers nothing
      - tasks: { any_state: uncommitted }
        about: and the change is still the agent's, uncommitted in its checkout

  - scene: it commits, and the project's branch does not move
    when:
      - shell: |
          set -e
          slot=$(ls -d {project}/.worktrees/*/ | head -1)
          git -C "$slot" add -A
          git -C "$slot" commit -qm 'feat(api): answer ping with pong'
        say: the agent commits its work
      - wait: screen
        until: "→ main"
        in: strip
        timeout: 40
        settle: 1.0
        say: the workspace notices and offers the ending it would reach
    then:
      - tasks: { any_state: ready }
        about: the task reads as deliverable — commits ahead, clean tree
      - cmd:
          run: "git -C {project} log --oneline -1"
          stdout_contains: "chore: declare the worktree policy"
        about: and the target branch has not moved an inch
      - git: { in: "{project}", dirty: false }
        about: nor was the primary checkout used as a workbench

  - scene: clicking the status delivers exactly what it said
    when:
      - click: "→ main"
        in: strip
        say: click the ready status, which delivers
        expect: "merged"
        expect_timeout: 60
        pause: 1.0
    then:
      - cmd:
          run: "git -C {project} log --oneline -1"
          stdout_contains: "feat(api): answer ping with pong"
        about: the target branch now carries the agent's commit
      - cmd:
          run: "git -C {project} log --oneline -2"
          stdout_contains: "chore: declare the worktree policy"
        about: on top of what was already there, not instead of it
      - tasks: { count: 1, newest_state: integrated }
        about: and the task is recorded as integrated, not merely closed
      - git: { in: "{project}", dirty: false }
        about: with the project's own checkout still clean

  - scene: the agent keeps the slot it was working in
    then:
      - dir: "{project}/.worktrees/*"
        same_as: slots
        about: |
          delivering is not leaving — the agent that just delivered usually
          keeps working in the same checkout, so the slot stays its own
      - git: { branches: "feat/answer-ping", count: 1 }
        about: |
          and its branch is still there to keep committing on, under the name
          UZE derived from the commit nobody else named
