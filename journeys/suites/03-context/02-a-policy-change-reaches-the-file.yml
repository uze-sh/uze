journey: changing the worktree policy changes what agents read, while the workspace runs
tags: [gate, tui, context]
proves: web/content/docs/workspace/agents.mdx
about: |
  UZE reads `workspace:` live wherever it acts on the policy itself. The
  agents that must honour it read something else: the section the workspace
  keeps in `AGENTS.md`. So a policy could be in force for UZE and not for
  them, for as long as nobody ran a command. The workspace closes that gap
  itself while it runs, and the package manager, which a person using only
  plugins runs, never writes or counts that section.

  A separate file from the plugin journey next door: a different claim,
  and a run stops at the first failure, so claims that share a file share a
  fate.

world:
  project: demo-app
  manifest: |
    workspace:
      target: main
      delivery: handoff

scenes:
  - scene: install gives the project its AGENTS.md and leaves the policy to the workspace
    when:
      - shell: "{uze} install"
        say: set the project up
    then:
      - file: "{project}/AGENTS.md"
        contains: "uze:begin project:plugin-authoring"
        about: the package manager writes its own section
      - file: "{project}/AGENTS.md"
        excludes: "left for a person to integrate"
        about: and not the workspace's

  - scene: and then the workspace opens and projects the policy in force
    when:
      - open: ["{uze}", "workspace"]
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - wait: shell
        until: grep -q "left for a person to integrate" {project}/AGENTS.md
        timeout: 30
        say: the workspace brings AGENTS.md in step when the space opens
    then:
      - file: "{project}/AGENTS.md"
        contains: "left for a person to integrate"
        about: the section carries the words of the policy in force

  - scene: and then a changed policy reaches the file with no command run
    when:
      - shell: |
          set -e
          printf 'workspace:\n  target: main\n  delivery: merge\n' > {project}/agents.yaml
        say: the person changes the delivery behaviour
      - wait: shell
        until: grep -q "fast-forwards the target" {project}/AGENTS.md
        timeout: 60
        say: the workspace notices the edit on its refresh clock
    then:
      - file: "{project}/AGENTS.md"
        contains: "fast-forwards the target"
        about: the section carries the new policy's own words
      - file: "{project}/AGENTS.md"
        excludes: "left for a person to integrate"
        about: and the superseded words are gone, not left beside them
      - cmd:
          run: "{uze} status"
          stdout_excludes: "AGENTS.md is behind"
        about: and the package manager has nothing to say about the workspace's section
