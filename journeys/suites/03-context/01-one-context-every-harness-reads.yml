journey: one project context, composed once, and never rewriting what the team wrote
tags: [gate, cli, context]
proves: web/content/docs/plugins/context.mdx
about: |
  A project states its conventions once, in AGENTS.md. An installed plugin
  contributes to it in a region UZE owns and can take back; everything else
  on the page belongs to the team and is never UZE's to touch. Every harness
  reads AGENTS.md natively, so nothing else is written for any of them.

  The read-only commands are held to it: `inspect` and `plan` say what would
  change and write nothing at all, which is the only reason a person can
  trust running them on a repository they care about.

world:
  project: demo-app
  commits:
    - message: "chore: initial commit"
      files:
        README.md: "# demo-app\n"
    - message: "docs: the team's own conventions"
      files:
        AGENTS.md: |
          # demo-app

          Hand-written by the team, and never UZE's to rewrite.

          ## Conventions

          - Conventional Commits for commit subjects.
  files:
    market/marketplace.json: |
      {
        "name": "demo",
        "plugins": [
          { "name": "house-rules", "source": "./plugins/house-rules", "description": "Instructions plugin." }
        ]
      }
    market/plugins/house-rules/plugin.json: |
      {
        "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
        "name": "house-rules",
        "version": "1.0.0",
        "description": "Shared house rules."
      }
    market/plugins/house-rules/AGENTS.md: |
      # House rules

      - Always run `make check` before committing.

scenes:
  - scene: a project with its own AGENTS.md, and a plugin with something to say
    when:
      - shell: "{uze} setup"
        check: false
      - shell: "{uze} market add {world}/market"
      - shell: "{uze} install -m house-rules@demo"
        say: install a plugin that contributes instructions
    then:
      - file: "{project}/AGENTS.md"
        contains: Conventional Commits for commit subjects.
        about: the team's own page is on disk, untouched
      - capture:
          name: project
          tree: "{project}"
        about: remember the project as the team left it

  - scene: the read-only commands write nothing at all
    when:
      - shell: "{uze} agent context inspect"
        say: inspect the current context
      - shell: "{uze} agent context plan"
        say: preview what reconciling would change
    then:
      - tree: "{project}"
        same_as: project
        about: the project is byte-identical after inspect and plan
      - cmd:
          run: "{uze} agent context plan"
          stdout_contains: ATTACH
        about: and the plan says the contribution is not attached yet

  - scene: reconciling composes the contribution into a region UZE owns
    when:
      - shell: "{uze} agent context reconcile"
        say: apply the plan
    then:
      - file: "{project}/AGENTS.md"
        contains: "<!-- uze:begin package:house-rules:demo:instructions -->"
        about: the contribution arrives inside a marked region
      - file: "{project}/AGENTS.md"
        contains: Always run `make check` before committing.
        about: carrying what the plugin actually said
      - file: "{project}/AGENTS.md"
        contains: Conventional Commits for commit subjects.
        about: and the team's own words are still there
      - file: "{project}/CLAUDE.md"
        exists: false
        about: every harness reads AGENTS.md itself, so no vendor file is written
      - file: "{project}/GEMINI.md"
        exists: false
        about: not for any harness

  - scene: reconciling again changes nothing
    then:
      - capture:
          name: reconciled
          tree: "{project}"
      - cmd:
          run: "{uze} agent context reconcile"
        about: a second reconcile succeeds
      - tree: "{project}"
        same_as: reconciled
        about: and leaves the project byte-identical

  - scene: removing the plugin from the machine leaves the project alone
    when:
      - shell: "{uze} remove -m house-rules"
        say: remove the plugin from this machine
    then:
      - file: "{project}/AGENTS.md"
        contains: Always run `make check` before committing.
        about: a machine-scoped command never edits a project's page
      - cmd:
          run: "{uze} agent context plan"
          stdout_contains: REMOVE
        about: the project's own command is what reports the region as orphaned

  - scene: and reconciling takes the region back, leaving the team's page as it was
    when:
      - shell: "{uze} agent context reconcile"
        say: reconcile the project again
    then:
      - file: "{project}/AGENTS.md"
        contains: Conventional Commits for commit subjects.
        about: the team's words survived the whole round trip
      - file: "{project}/AGENTS.md"
        contains: Hand-written by the team, and never UZE's to rewrite.
        about: the baseline is exactly the page the team wrote
      - json: "{uze_home}/state/attachments.json"
        at: receipts.*.package_id
        exists: true
        about: and the machine still knows what it has
      - file: "{project}/CLAUDE.md"
        exists: false
        about: nothing was left behind for any harness
