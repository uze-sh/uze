journey: one project context, kept by the team, and a plugin that speaks through a rule
tags: [gate, cli, context]
proves: web/content/docs/plugins/context.mdx
about: |
  A project states its conventions once, in AGENTS.md, and that page is the
  team's: every harness reads it natively, and UZE writes nothing into it.
  A plugin with something to tell every agent says it as an `always_on`
  rule, which a project that declares the plugin carries as a committed
  copy in a folder of the plugin's own, registered in `.agents/rules.json`:
  an open format any agent reads with UZE gone.

  The read-only commands are held to it: `inspect` and `plan` say what would
  change and write nothing at all, which is the only reason a person can
  trust running them on a repository they care about.

world:
  project: demo-app
  commits:
    - message: "chore: initial commit"
      files:
        README.md: "# demo-app\n"
    - message: "docs: the team's own conventions"
      files:
        AGENTS.md: |
          # demo-app

          Hand-written by the team, and never UZE's to rewrite.

          ## Conventions

          - Conventional Commits for commit subjects.
  files:
    market/marketplace.json: |
      {
        "name": "demo",
        "plugins": [
          { "name": "house-rules", "source": "./plugins/house-rules", "description": "A plugin with a rule." }
        ]
      }
    market/plugins/house-rules/plugin.json: |
      {
        "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
        "name": "house-rules",
        "version": "1.0.0",
        "description": "Shared house rules."
      }
    market/plugins/house-rules/rules/house.md: |
      ---
      trigger: always_on
      ---

      Always run `make check` before committing.
  # The project declares the plugin: what makes its rules this project's to
  # carry, since installing it only puts it on the machine.
  manifest: |
    marketplaces:
      demo:
        path: ../../market
        plugins:
          - house-rules

scenes:
  - scene: a project with its own AGENTS.md, and a plugin with a rule
    when:
      - shell: "{uze} setup"
      - shell: "{uze} install"
        say: install what the project declares
    then:
      - file: "{project}/AGENTS.md"
        contains: Conventional Commits for commit subjects.
        about: the team's own page is on disk
      - file: "{project}/AGENTS.md"
        excludes: "uze:begin"
        about: and carries nothing UZE wrote
      - file: "{project}/CLAUDE.md"
        exists: false
        about: no bridge, since every harness reads AGENTS.md natively
      - file: "{project}/.agents/rules/house-rules@demo/house.md"
        contains: Always run `make check` before committing.
        about: the plugin's rule is a copy in a folder of the plugin's own
      - file: "{project}/.agents/rules.json"
        contains: '"path": ".agents/rules/house-rules@demo"'
        about: registered where a harness that reads only the top of `.agents/rules/` finds it
      - capture:
          name: project
          tree: "{project}"
        about: remember the project as install left it

  - scene: the read-only commands write nothing at all
    when:
      - shell: "{uze} agent context inspect"
        say: inspect the current context
      - shell: "{uze} agent context plan"
        say: preview what reconciling would change
    then:
      - tree: "{project}"
        same_as: project
        about: the project is byte-identical after inspect and plan
      - cmd:
          run: "{uze} agent context plan"
          stdout_contains: nothing to reconcile
        about: and the plan has nothing to do on a page UZE never wrote

  - scene: removing the plugin from the machine leaves the project alone
    when:
      - shell: "{uze} remove -m house-rules"
        say: remove the plugin from this machine
    then:
      - tree: "{project}"
        same_as: project
        about: a machine-scoped command never edits a project, its page or its rule copies

  - scene: and dropping it from the project takes its rules back, leaving the team's page as it was
    when:
      - shell: "{uze} remove house-rules"
        say: the team takes the plugin out of the project
    then:
      - dir: "{project}/.agents/rules/house-rules@demo"
        exists: false
        about: the plugin's folder of rules is gone
      - file: "{project}/.agents/rules.json"
        exists: false
        about: and the manifest UZE began goes with its last entry
      - file: "{project}/AGENTS.md"
        contains: Hand-written by the team, and never UZE's to rewrite.
        about: the team's page is exactly as they wrote it
