journey: changing the worktree policy changes what the next agent is told, and never the team's page
tags: [gate, tui, context]
proves: web/content/docs/workspace/agents.mdx
about: |
  UZE reads `workspace:` live wherever it acts on the policy itself, and the
  agents that must honour it are told it at launch, in the context UZE
  composes for each one outside the checkout. So the policy in force is the
  one an agent is given, with no command run in between, and the team's
  AGENTS.md is never the place it is written.

  A separate file from the plugin journey next door: a different claim,
  and a run stops at the first failure, so claims that share a file share a
  fate.

world:
  project: demo-app
  commits:
    - message: "chore: initial commit"
      files:
        README.md: "# demo-app\n"
    - message: "docs: the team's own conventions"
      files:
        AGENTS.md: |
          # demo-app

          - Conventional Commits for commit subjects.
  manifest: |
    workspace:
      target: main
      worktree: always

scenes:
  - scene: an agent launched under the policy in force is told it
    when:
      - shell: "{uze} setup"
        say: the operator provisions their harnesses, which installs the launchers
      - open: ["{uze}", "workspace"]
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - click: "new"
        say: open the new-agent picker
        in: sidebar
        expect: 'harness .*Claude Code'
      - type: "{project}"
        say: place a Claude agent
        expect: Claude Code v
        expect_timeout: 45
        pause: 2.0
      - wait: shell
        until: test "$(ls {uze_home}/runtime/projects/*/agents/*/CLAUDE.md 2>/dev/null | wc -l)" -ge 1
        timeout: 60
        say: the agent is placed and given its context
    then:
      - cmd:
          run: >
            f=$(ls -t {uze_home}/runtime/projects/*/agents/*/CLAUDE.md | head -1);
            grep -q "left for a person to integrate" "$f"
        about: the agent's own context carries the words of the policy in force
      - cmd:
          run: git -C {project} diff --quiet HEAD -- AGENTS.md
        about: and the team's page is byte for byte the one they committed

  - scene: and then a changed policy reaches the next agent with no command run
    when:
      - shell: |
          set -e
          printf 'workspace:\n  target: main\n  worktree: always\n  delivery: merge\n' > {project}/agents.yaml
        say: the person changes the delivery behaviour
      - click: "new"
        say: place another agent
        in: sidebar
        expect: 'harness .*Claude Code'
      - type: "{project}"
        say: another Claude agent
        expect: Claude Code v
        expect_timeout: 45
        pause: 2.0
      # The first agent's pane already says `Claude Code v`, so the gate
      # above can hold before the second one is placed; its context file
      # is what says it was.
      - wait: shell
        until: test "$(ls {uze_home}/runtime/projects/*/agents/*/CLAUDE.md | wc -l)" -ge 2
        timeout: 60
        say: the second agent is placed and given its context
    then:
      - cmd:
          run: >
            f=$(ls -t {uze_home}/runtime/projects/*/agents/*/CLAUDE.md | head -1);
            grep -q "fast-forwarding the target" "$f" && ! grep -q "left for a person to integrate" "$f"
        about: the newest agent is told the new policy's words, not the superseded ones
      - cmd:
          run: git -C {project} diff --quiet HEAD -- AGENTS.md
        about: and the team's page is still the one they committed
