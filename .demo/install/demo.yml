# The first five minutes, as a spec: install uze, set up one harness, open
# the workspace. Shown at the top of the Installation page.
#
#   tui-record seed   .demo/install
#   tui-record run    .demo/install
#
# Unlike the other demos this one records a *shell*, and what it installs is
# the published release, not this checkout's build: the video is of what a
# reader will get by running the same line. Its sandbox is its own, so a take
# never touches the uze the other specs record.
#
# The installer prints the directory it installed into, so the sandbox home
# is on screen here: it lives under /tmp, where a path carries no username.

video:
  title: uze — install
  out: .demo/install/uze-install.gif
  poster: .demo/install/uze-install-poster.png
  publish:
    - from: out
      to: web/public/uze-install.gif
    - from: poster
      to: web/public/uze-install-poster.png
  cast: '{root}/uze-install.cast'
  # The other demos' proportions (152x36), smaller: the output of each
  # command is what this one is for, and the docs scale a GIF to their
  # column, so fewer cells is bigger type. 126x30 holds the ratio and still
  # fits the workspace's sidebar beside the agent it opens.
  cols: 126
  rows: 30
  speed: 1.2
  # Above the longest pause: the renderer caps a still screen at its idle
  # limit (1.5s by default), which halved every look the beats ask for.
  idle_limit: 3.5
  background: 0a0c0d        # crate::ui::BASE — a mismatch shows as a border
  font_size: 20
  font_family: FiraCode Nerd Font Mono,DejaVu Sans Mono
  font_dir: ~/.cache/nerd-fonts/v3.5.1/FiraCode
  # Two downloads happen on camera — uze's release and Claude Code's — and
  # both are waits, squeezed to this.
  wait_collapse: 1.2
  poster_when: 'Setup completed'
  sidebar: 31
sandbox:
  root: /tmp/uzeinstall
  fixtures: /tmp/uzeinstall/work
  cwd: '{fixtures}/my-app'
  command:
    - '{home}/demoshell'
  shell: '{home}/demoshell'
  # The installed binaries land in ~/.local/bin, and `uze setup` puts its
  # shims first: the same order a real shell rc ends up with.
  path:
    - '{home}/.uze/shims'
    - '{home}/.local/bin'
    - /usr/local/bin
    - /usr/bin
    - /bin
  env:
    TZ: UTC
    PS1: '\[\e[38;5;114m\]my-app\[\e[0m\] $ '
  author: Ada Lovelace
  author_email: ada@demo.dev
  # The installed uze's terminal server outlives a take, and a failed one
  # leaves its agents in it: the next take's workspace would open on them.
  # By pid, verified through /proc — never a pattern kill, which would
  # match the shell running it.
  reset:
    - |
      for pid in $(pgrep -x uze 2>/dev/null); do
        cmd=$(tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null) || continue
        case "$cmd" in *"terminal serve --root /tmp/uzeinstall/"*) kill -TERM "$pid" 2>/dev/null ;; esac
      done
  # Every take is a machine that has never seen uze or Claude Code: the
  # install and the setup are what the video shows, so neither may be done.
  clear:
    - '{home}/.local/bin/uze'
    - '{home}/.local/bin/claude'
    - '{home}/.local/share/claude'
    - '{home}/.claude'
    - '{home}/.claude.json'
    - '{home}/.uze'
    - '{runtime}/uze-runtime'
  write:
    - path: '{home}/demoshell'
      executable: true
      text: |
        #!/bin/sh
        exec /bin/bash --norc --noprofile
    - path: '{home}/.gitconfig'
      text: "[user]\n\tname = Ada Lovelace\n\temail = ada@demo.dev\n[init]\n\tdefaultBranch = main\n"
fixtures:
  - name: my-app
    commits:
      - message: 'chore: initial commit'
        days_ago: 6
        files:
          README.md: '# my-app'
      - message: 'feat: add the entry point'
        days_ago: 3
        files:
          src/main.rs: |-
            fn main() {
                println!("hello from my-app");
            }
beats:
  - say: a project, and a shell with no uze on it
    pause: 1.0
  - say: install uze with one line
    type: curl -fsSL https://uze.sh/i | sh
    pause: 0.4
  - say: the installer downloads, verifies and installs the release
    wait: screen
    # The installer ends on its "Next" list; the settled line above it is
    # the version, which changes every release, so it is not the proof.
    until: Open the terminal workspace
    timeout: 120
    pause: 2.4
  - say: set up an agent — here Claude Code, through its own official installer
    type: uze setup claude
    pause: 0.4
  - wait: screen
    until: 'ready|Setup completed'
    timeout: 300
    pause: 2.6
  - say: and open the workspace
    type: uze
    expect: first steps
    expect_timeout: 20
    pause: 2.0
  # With one harness set up there is nothing to choose, so the new-agent
  # chord places the agent straight away rather than opening a picker. The
  # proof is its row in the sidebar; what Claude Code draws on its first
  # run is its own onboarding, which is the honest first frame here.
  - say: a new agent — Claude Code starts, in a checkout of its own
    key: M-n
    expect: agent 1
    expect_in: sidebar
    expect_timeout: 20
    pause: 3.0
  - say: and out
    end: C-q
