# The spec surface, as a spec. This file is the source of truth: it says what
# the video shows, in order, and everything needed to make it again.
#
#   tui-record beats  .demo/spec   # the script, as prose
#   tui-record seed   .demo/spec   # build the sandbox (first run, or after a /tmp wipe)
#   tui-record probe  .demo/spec   # the app in its sandbox, to try a selector out
#   tui-record run    .demo/spec   # record → cut → leak-check → render → poster
#
# `tui-record` ships with the `tui` plugin: uze install -m tui@ai
#
# It records in the workspace sandbox the other demos share
# (.demo/_shared/workspace.yml) — one {root}, one {fixtures}, one
# remembered HEAD — against the shared `demo-app` fixture.
#
# No harness is started here, so this spec grants no credential and installs
# no harness binary: the surface it films reads Git and the checkout, and
# nothing else.

extends: ../_shared/workspace.yml

video:
  title: uze — spec
  out: .demo/spec/uze-spec.gif
  poster: .demo/spec/uze-spec-poster.png
  publish:
    - from: cast
      to: web/public/casts/spec.cast
  cast: '{root}/uze-spec.cast'
  speed: 1.3
  wait_collapse: 1.0
  # The surface open on the checkout's own change, its proposal rendered:
  # the frame that says what this surface is for.
  poster_when: 'add-rate-limiting/proposal\.md'
sandbox:
  reset:
    # What makes add-rate-limiting *this checkout's* change: a design the
    # operator is drafting, untracked. Written here, after the clean and
    # before the rewind, because the rewind is `reset --hard` — it reverts a
    # tracked file and leaves an untracked one alone.
    - |
      cat > {fixtures}/demo-app/openspec/changes/add-rate-limiting/design.md <<'DESIGN'
      ## Context

      The router dispatches every request straight to its handler; there
      is nowhere to say no.

      ## Decisions

      ### A token bucket per client address

      Refilled every second to the budget in `config.toml`. A bucket is
      cheap, and a burst within budget is never refused.

      ### `429` with `Retry-After`

      The client is told how long to wait rather than left to guess.
      DESIGN
fixtures:
  - include: ../_shared/demo-app.yml
# What the video shows, in order. Edit this list first.
#
# Every `expect` reads the frame the surface draws: the content heading names
# the change and the file on show (`add-rate-limiting/tasks.md`), which is
# the narrowest proof that a selection moved. The bands are proved by their
# headings, drawn in capitals.
beats:
  - say: uze is open on a project that plans its changes with OpenSpec
    pause: 1.4
  - say: the sidebar says how far this checkout's own work has got
    click: tasks
    in: sidebar
    expect: add-rate-limiting
    expect_in: sidebar
    expect_timeout: 8
    pause: 2.4
  - say: the plans themselves, opened on the change this checkout is drafting
    click: spec
    in: strip
    expect: add-rate-limiting/proposal\.md
    expect_timeout: 10
    pause: 3.0
  - say: its design, rendered
    key: Down
    expect: add-rate-limiting/design\.md
    expect_timeout: 6
    pause: 2.4
  - say: and its tasks, three of seven done
    key: Down
    expect: add-rate-limiting/tasks\.md
    expect_timeout: 6
    pause: 3.0
  - say: the rest of the project's work, by where it stands
    key: Left
    expect: READY TO ARCHIVE
    # Left folds the change back to its row; its documents leaving the
    # list is what proves the key landed.
    refuse: rate-limi… contract
    expect_timeout: 6
    pause: 2.4
  - say: and what was finished and put away
    # The archive is the last band of changes, folded until asked for.
    click: ARCHIVED
    in: pane
    expect: 2026-09-18-add-heal
    expect_timeout: 6
    pause: 2.4
  - say: the specs that outlive the changes
    # The subjects sit in the tab strip while a surface is open.
    click: specs
    in: strip
    expect: health/spec\.md
    expect_timeout: 6
    pause: 2.4
  - say: and out — the cut stops here, before the screen blanks
    end: C-q
