# The project most demos open on: a small HTTP service with a believable
# past — an empty repo reads as a test fixture, a handful of dated commits
# reads as a project.
#
# One definition, included by every spec that records against it: fixtures
# are keyed by name on disk, so the specs that name `demo-app` share one
# repository in {fixtures} and one remembered HEAD. Two copies that drifted
# apart would have `tui-record seed` on one spec rewind the others to a base
# they were not recorded against.

- name: demo-app
  commits:
    - message: 'chore: initial commit'
      days_ago: 9
      files:
        README.md: '# demo-app'
    - message: 'feat(api): add the health endpoint'
      days_ago: 7
      files:
        src/main.rs: |-
          mod router;

          fn main() {
              let port = config::port();
              println!("demo-app listening on {}", port);
              serve(port, router::route);
          }
        src/health.rs: |-
          pub fn health() -> Response {
              Response::json(200, r#"{"status":"ok"}"#)
          }
    - message: 'docs: describe the request lifecycle'
      days_ago: 5
      files:
        docs/lifecycle.md: |
          # Request lifecycle

          A request arrives, the router looks its path up in the route
          table, and the handler it finds answers. A path the table does
          not carry falls through to the 404 handler.

          ## Routes

          | Path | Handler |
          | --- | --- |
          | `/health` | `health::health` |
    - message: 'feat(config): read settings from config.toml'
      days_ago: 4
      files:
        config.toml: |-
          [app]
          port = 8080
          log = "info"
        src/config.rs: |-
          pub fn port() -> u16 {
              settings().app.port
          }
    - message: 'docs: add AGENTS.md with the project''s conventions'
      days_ago: 3
      files:
        AGENTS.md: |
          # AGENTS.md

          Guidance for agentic tools working in this repository.

          ## What this is

          `demo-app` is a small HTTP service. `src/router.rs` maps a path to a
          response; `config.toml` carries the runtime settings.

          ## Conventions

          - Keep handlers total: every route returns a `Response`, never panics.
          - Document a new route in `docs/lifecycle.md` in the same change.
          - Conventional Commits for commit subjects.
    # The policy belongs in the manifest, not the lock: `agents.lock` is
    # derived, and an agent reading a worktree policy from it would be
    # reading something UZE regenerates. `worktree: always` is what puts
    # every agent this demo starts in a checkout of its own. `delivery:
    # merge` because the fixture has no remote to push to; merge and push are
    # the only values the section takes.
    - message: 'chore: declare the project''s environment in agents.yaml'
      days_ago: 2
      files:
        agents.yaml: |-
          workspace:
            worktree: always
            target: main
            delivery: merge
            branch: conventional
            slots: 3
            artifacts: docs/architecture
    - message: 'docs(architecture): draw the context, the containers and the lifecycle'
      days_ago: 2
      files:
        docs/architecture/system-context.mmd: |
          ---
          title: System context
          ---
          C4Context
            Person(dev, "Developer", "Runs the service and reads its logs")
            System(app, "demo-app", "The HTTP service")
            System_Ext(site, "demo-web", "The marketing site")
            Rel(dev, app, "Runs, reviews")
            Rel(site, app, "Calls /health")
        docs/architecture/containers.mmd: |
          ---
          title: Containers
          ---
          C4Container
            System_Boundary(app, "demo-app") {
              Container(router, "Router", "Rust", "Maps a path to a response")
              Container(health, "Health", "Rust", "Answers /health")
              Container(config, "Config", "TOML", "Runtime settings")
            }
            Rel(router, health, "Dispatches /health")
            Rel(router, config, "Reads the port")
        docs/architecture/router-components.mmd: |
          ---
          title: Router components
          ---
          C4Component
            Container_Boundary(router, "Router") {
              Component(table, "Route table", "Rust", "Path to handler")
              Component(dispatch, "Dispatch", "Rust", "Calls the handler it found")
              Component(fallback, "Fallback", "Rust", "Answers 404")
            }
            Rel(table, dispatch, "Hands the match to")
            Rel(table, fallback, "No match")
        docs/architecture/request-lifecycle.mmd: |
          ---
          title: Request lifecycle
          ---
          flowchart LR
            req([Request]) --> router[Router]
            router --> known{Known route?}
            known -- yes --> handler[Handler]
            known -- no --> missing[404]
            handler --> res([Response])
            missing --> res
            click router href "src/router.rs"
            click handler href "src/health.rs"
    # A project that plans its changes with OpenSpec, so the spec surface
    # has something true to show: one change in flight, one finished and
    # never archived, one barely started, and one put away. The design of
    # rate limiting is not here on purpose — .demo/spec writes it
    # untracked, which is what makes that change the checkout's own.
    - message: 'docs(openspec): plan rate limiting, logging and config reload'
      days_ago: 1
      files:
        openspec/config.yaml: |
          schema: spec-driven
        openspec/specs/health/spec.md: |
          # health Specification

          ## Purpose
          Says whether the service can answer, for the load balancer and
          for whoever is on call.

          ## Requirements
          ### Requirement: The service reports its health
          The service SHALL answer `GET /health` with `200` and
          `{"status":"ok"}` while it can serve requests.

          #### Scenario: A healthy service
          - **WHEN** `/health` is requested
          - **THEN** the answer SHALL be `200` with `{"status":"ok"}`
        openspec/specs/routing/spec.md: |
          # routing Specification

          ## Purpose
          Maps a request's path to the handler that answers it.

          ## Requirements
          ### Requirement: An unknown path is answered, not dropped
          A path the route table does not carry SHALL be answered with `404`.

          #### Scenario: A path nobody routes
          - **WHEN** `/nope` is requested
          - **THEN** the answer SHALL be `404` naming the path
        openspec/changes/archive/2026-09-18-add-health-endpoint/proposal.md: |
          ## Why

          The load balancer has no way to tell a live instance from a
          dead one.

          ## What Changes

          - `GET /health` answers `200` while the service can serve.
        openspec/changes/archive/2026-09-18-add-health-endpoint/tasks.md: |
          ## 1. Endpoint

          - [x] 1.1 Add `health::health`
          - [x] 1.2 Route `/health` to it
        openspec/changes/add-rate-limiting/proposal.md: |
          ## Why

          One noisy client can take the service down for everyone.
          Requests need a budget per client, and a clear answer when it
          runs out.

          ## What Changes

          - A token bucket per client address, refilled every second.
          - `429 Too Many Requests` with a `Retry-After` header when the
            bucket is empty.
          - The budget is set in `config.toml`, under `[limits]`.

          ## Impact

          - `src/router.rs` asks the limiter before dispatching.
          - A new `src/limiter.rs`.
        openspec/changes/add-rate-limiting/tasks.md: |
          ## 1. Limiter

          - [x] 1.1 Token bucket with a refill clock
          - [x] 1.2 One bucket per client address
          - [x] 1.3 Read the budget from `config.toml`

          ## 2. Routing

          - [ ] 2.1 Ask the limiter before dispatching
          - [ ] 2.2 Answer `429` with `Retry-After`

          ## 3. Proof

          - [ ] 3.1 A burst past the budget is refused
          - [ ] 3.2 The bucket refills after a second
        openspec/changes/add-rate-limiting/specs/rate-limiting/spec.md: |
          ## ADDED Requirements

          ### Requirement: A client past its budget is told to wait
          The service SHALL answer `429` with a `Retry-After` header to a
          client that has spent its request budget.

          #### Scenario: A burst
          - **WHEN** a client sends more requests in a second than its
            budget allows
          - **THEN** the requests past the budget SHALL be answered `429`
        openspec/changes/add-request-logging/proposal.md: |
          ## Why

          Nobody can say what the service answered, or how slowly.

          ## What Changes

          - One line per request: method, path, status, duration.
        openspec/changes/add-request-logging/tasks.md: |
          ## 1. Logging

          - [x] 1.1 Log method, path and status
          - [x] 1.2 Log the duration
          - [x] 1.3 Respect the `log` level in `config.toml`
        openspec/changes/add-config-reload/proposal.md: |
          ## Why

          Changing a setting means restarting the service.

          ## What Changes

          - `SIGHUP` re-reads `config.toml` without dropping connections.
        openspec/changes/add-config-reload/tasks.md: |
          ## 1. Reload

          - [x] 1.1 Catch `SIGHUP`
          - [ ] 1.2 Re-read `config.toml`
          - [ ] 1.3 Swap the settings atomically
          - [ ] 1.4 Log what changed
    - message: 'fix(api): return 404 for an unknown route'
      days_ago: 1
      files:
        src/router.rs: |-
          use crate::{config, health};

          /// Every route this service answers, in the order they are tried.
          pub fn route(path: &str) -> Response {
              match path {
                  "/health" => health::health(),
                  _ => not_found(path),
              }
          }

          fn not_found(path: &str) -> Response {
              Response::text(404, format!("no route for {path}"))
          }
