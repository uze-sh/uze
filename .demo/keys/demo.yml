# The keys screen, as a spec.
#
#   tui-record probe  .demo/keys
#   tui-record run    .demo/keys
#
# It records in the workspace sandbox the other demos share
# (.demo/_shared/workspace.yml), against the shared `demo-app` fixture.

extends:
  - ../_shared/workspace.yml
  - ../_shared/macros.yml

video:
  title: uze — keys
  out: .demo/keys/uze-keys.gif
  poster: .demo/keys/uze-keys-poster.png
  publish:
    - from: cast
      to: web/public/casts/keys.cast
  cast: '{root}/uze-keys.cast'
  speed: 1.3
  wait_collapse: 1.0
  poster_when: 'Keyboard saved'
sandbox:
  reset:
    # A take rebinds a key; the next one must find the defaults again. Here
    # and not under `clear`, which removes directories and passes over a
    # file without a word — the take then opened on the key the last one set.
    - rm -f {home}/.uze/keys.json
fixtures:
  - include: ../_shared/demo-app.yml
# What the video shows, in order. The status line under the content says
# "Keyboard saved" only once the new binding is written, and the strip is the
# proof the key works: a second shell tab exists only because F4 opened it.
beats:
  - say: uze is open on a project
    pause: 1.2
  # The modal's tab row is drawn whichever screen it opens on, so it proves
  # the modal is open and nothing more; Shortcuts is asked for next.
  - use: manage-open
    with: {say: 'every key lives in management, under shortcuts', pause: 0.6}
  # The tab is the first "Shortcuts" on the screen: the tab row sits above
  # everything else the modal draws. The filter field's placeholder is the
  # one thing only this screen draws.
  - click: Shortcuts
    in: screen
    expect: filter keys and actions…
    expect_timeout: 8
    pause: 1.2
  # The editor's own caret, not the placeholder: the placeholder is there
  # whether or not the field took the focus.
  - say: find an action by name
    click: filter keys and actions
    in: screen
    expect: '/ ▏filter keys and actions'
    pause: 0.3
  # The whole name: the filter matches descriptions too, and "shell" alone
  # puts the tab chords (whose description mentions shells) first. The proof
  # is the detail panel naming the selected action's key, which only shows
  # once New shell is the one selected.
  - type: new shell
    submit: false
    expect: 'ctrl\+t\s+— universal'
    expect_timeout: 6
    pause: 1.2
  - say: change its key — the screen waits for one
    click: Change key
    in: screen
    expect: Waiting for a key
    expect_timeout: 6
    pause: 1.0
  - say: press the new one; it is saved at once
    key: F4
    expect: Keyboard saved
    expect_timeout: 6
    pause: 2.4
  - say: back in the workspace, F4 opens a shell
    key: C-o
    refuse: manage\s+1 Marketplace\s+2 Integrations
    pause: 0.8
  - key: F4
    expect_in: strip
    expect: 'shell.*shell'
    expect_timeout: 8
    pause: 2.2
  - say: and out
    end: C-q
