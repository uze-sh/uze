# The demo video, as a spec. This file is the source of truth: it says what
# the video shows, in order, and everything needed to make it again. What it
# shares with the other demos (the sandbox, the fixtures, the gestures) is
# in .demo/_shared.
#
#   tui-record beats  .demo   # the script, as prose
#   tui-record seed   .demo   # build the sandbox (first run, or after a /tmp wipe)
#   tui-record probe  .demo   # the app in its sandbox, to try a selector out
#   tui-record run    .demo   # record → cut → leak-check → render → poster
#   tui-record recut  .demo   # re-cut the last take, without recording
#
# `tui-record` ships with the `tui` plugin: uze install -m tui@ai

extends:
  - _shared/agents.yml
  - _shared/macros.yml

video:
  title: uze
  # The site plays the cut cast itself, as text; the GIF is rendered beside
  # the spec as the take's proof and published only because README.md embeds
  # it, and GitHub cannot play a cast. Only the published copies are
  # committed (.demo renders are gitignored).
  out: .demo/uze-demo.gif
  poster: .demo/uze-demo-poster.png
  # The README's GIF is the one picture of uze many people see: resvg
  # strokes the sidebar's box-drawing tree heavier and joins it at the
  # corners, the way a terminal draws it. The renderer's own line height is
  # kept, since it is what gives the frame the near-16:9 shape the README
  # and the org profile lay out around.
  renderer: resvg
  publish:
    - from: cast
      to: web/public/casts/hero.cast
    - from: out
      to: web/public/uze-demo.gif
  cast: '{root}/uze-hero.cast'
  speed: 1.2                # reads as a person; at 1.45 the extension scene read as fast-forward
  wait_collapse: 1.5        # what an agent's thinking time collapses to
  # The poster: named by what must be on screen, so a re-cut cannot
  # silently move it to a half-drawn frame: the spec surface open on the
  # change in the agent's checkout, both agents in the sidebar beside it.
  # Not the overview: the prompt it lists is wider than its column, and a
  # selected row that does not fit slides, so no still of it reads whole.
  # `tasks.md` alone, since the terminal draws only the cells that change
  # and the change's name is not rewritten with it; the still lands a frame
  # early, on the proposal (the plugin's gif_frame_at off-by-one).
  poster_when: 'tasks\.md'
fixtures:
  - include: _shared/demo-app.yml
  - include: _shared/demo-web.yml
# What the video shows, in order. Edit this list first.
beats:
  - say: uze is open on a project, a real shell in the space
    pause: 1.2
  - say: the project has a past
    type: git log --oneline -4
    pause: 2.2
  - say: the space is renamed — it is yours, not the directory's
    dclick: demo-app
    in: sidebar
    offset: 3
    expect: demo-app▏
    pause: 0.6
  - type: api
    clear: 8
    pause: 0.9
  - use: launch-claude
    with: {say: 'an agent is placed, in a checkout of its own', menu_pause: 0.9, pause: 1.6,
           typed: /tmp/demos/demo-app, completed: demo-app}
  # The tabs carry the agent mark, aimed at by glyph rather than by
  # character, with both spellings named: `mark.sparkle` is `✦` in the
  # default set and a private-use codepoint in the nerd one, so a spec that
  # hard-codes either stops aiming the day the other is chosen. The strip
  # holds the selected agent's tabs only, so its first mark is always the
  # agent just placed.
  - say: and named after the work it is doing
    dclick: ''
    glyph: '✦'
    in: strip
    offset: 2
    expect: ▏
    expect_in: strip
    expect_timeout: 6
  - type: ping
    clear: all
    expect: ping
    expect_in: strip
    pause: 0.7
  - say: asked for something real, and for the commit
    type: add a /ping route to src/router.rs that answers pong, then commit
    # The hint is the right proof — it is in every cast this ever recorded.
    # What was wrong was the patience: a cold session takes longer than 20s
    # to reach it, and the take died on the app being slow, not wrong. The
    # hint only lives while the agent works, and a warm one finishes this in
    # ~10s, so the line Claude leaves when it is done (`Crunched for 11s ·
    # done`) proves the same submission for a poll that arrives late.
    expect: 'esc to interrupt|for \d+s · done'
    expect_timeout: 60
    pause: 1.8
  # Codex rather than OpenCode: OpenCode 2.0.30's background service fails
  # its own health check in the sandbox (2026-10-18), and the agent never
  # draws. The landing still shows OpenCode.
  - use: launch-codex
    with: {say: 'a second agent, on a different harness', menu_pause: 0.9, pause: 1.8}
  - dclick: ''
    glyph: '✦'
    in: strip
    offset: 2
    expect: ▏
    expect_in: strip
    expect_timeout: 6
  - type: docs
    clear: all
    expect: docs
    expect_in: strip
    pause: 0.7
  # Its own checkout and nothing else. Asking it for the route the *other*
  # agent is adding is asking about a file it cannot see — isolation is the
  # point of this demo — and a careful agent then explores, finds nothing,
  # and the wait below times out with the take.
  - say: asked for something else — this one without a commit
    type: add a Routes section to README.md listing every route in src/router.rs, without committing
    pause: 1.6
  # The overview is the agent's: its Agent section lists what the agent in
  # front was asked, and its drawer what reaches that harness.
  - say: 'what uze delivered to *this* harness, and what it was asked'
    key: M-o
    expect: prompts this agent was given
    expect_timeout: 8
    pause: 3.2
  - key: Escape
    refuse: prompts this agent was given
    pause: 0.8
  - say: wait for that agent's first edit — the only stretch the cut squeezes
    wait: shell
    until: grep -qs Routes /tmp/demos/demo-app/.worktrees/*/README.md
    timeout: 300
    settle: 2.0
    pause: 0.2
  # The extensions in the order a change is read, which is also the order
  # the strip lists them: what it intends (spec), how it was described
  # (arch), what it is (code). Each one is reached straight across from the
  # one before — a surface's button or chord switches to it from any other
  # — and only the last is closed, so the scene is one continuous reading.
  #
  # Every proof below is the narrowest thing on screen that only the state
  # being proved draws. Change names are also in the timeline, the
  # architect's header lists every level whether or not you are on one, and
  # the code surface's nav row reads `Files  Map  Changes` in every one of
  # its states — so it is a band heading, the status bar and the diff's own
  # header that prove anything.
  - say: what the project plans, and how far each change has got
    click: spec
    in: strip
    expect: READY TO ARCHIVE
    expect_timeout: 10
    pause: 2.2
  # The status bar names the document on show, and it is the one proof here
  # that only the state being proved draws: every change name is also in
  # the list, and a band heading is there whatever is selected.
  - say: a change is picked, and opened on its proposal
    key: Down
    expect: add-rate-limiting/proposal\.md
    expect_timeout: 6
    pause: 1.6
  - say: it holds its documents — the tasks, three of seven done
    key: Enter
    expect: contract
    expect_timeout: 6
    pause: 0.8
  - key: [Down, Down]
    expect: add-rate-limiting/tasks\.md
    expect_timeout: 6
    pause: 2.8
  # The archive is the last band of changes, folded until asked for, and
  # the subjects sit in the tab strip while a surface is open — so the
  # archive comes first, while changes is the subject on show.
  - say: what was finished and put away
    click: ARCHIVED
    in: pane
    expect: 2026-09-18-add-heal
    expect_timeout: 6
    pause: 2.2
  - say: and the specs that outlive the changes
    click: specs
    in: strip
    expect: health/spec\.md
    expect_timeout: 6
    pause: 2.2
  # The surface remembers where it was left — but a take opens it exactly
  # once, so on camera that memory is always empty and the first level is
  # what it draws. (Driving it by hand first is what makes this assertion
  # look flaky: `probe` keeps the same client across experiments, a take
  # never does.)
  - say: what the project wrote down about itself, drawn in cells
    click: arch
    in: strip
    expect: system-context\.mmd
    expect_timeout: 10
    pause: 3.0
  # Shift+arrow, not a click: a click on a box's label does not select it,
  # and a gesture that silently does nothing is what ends a take wrong.
  - say: a box is a level — and you walk into it
    key: S-Down
    expect: enter goes inside
    expect_timeout: 6
    pause: 1.4
  - key: Enter
    expect: containers\.mmd
    expect_timeout: 8
    pause: 3.0
  # By chord, straight across from the architect: its scope binds the code
  # surface's chords too, so no Escape has to unwind the level entered above.
  - say: and what it is — that agent's uncommitted change, in its own checkout
    key: M-g
    expect: 'DIFF ·'
    expect_timeout: 10
    refuse: no changes
    pause: 3.4
  - say: the same checkout as the tree it sits in, and then as a map of it
    key: M-e
    expect: config\.toml
    expect_timeout: 8
    pause: 2.2
  - key: m
    expect: Ranking
    expect_timeout: 8
    pause: 2.8
  # Closed by its own button, not by Escape. Escape steps *back* — a mode, a
  # selection — so how many it takes to leave depends on how deep the scene
  # went. The lit button closes it from any depth, and the proof is the
  # tab strip back over the agent: Code draws its own tabs there.
  - click: code
    in: strip
    expect: docs
    expect_in: strip
    expect_timeout: 6
    refuse: Ranking
    pause: 0.8
  - use: manage-open
    with: {say: 'the management side, unhurried', pause: 1.2}
  - use: manage-marketplace
    with: {pause: 2.1}
  - use: manage-extensions
    with: {pause: 2.1}
  - use: manage-integrations
    with: {pause: 2.1}
  # Back where it opened, with both agents still there.
  - use: manage-close
    with: {pause: 1.8}
  - say: and out — the cut stops here, before the screen blanks
    end: C-q
