# The code surface, as a spec. This file is the source of truth: it says what the
# video shows, in order, and everything needed to make it again.
#
#   tui-record beats  .demo/code   # the script, as prose
#   tui-record seed   .demo/code   # build the sandbox (first run, or after a /tmp wipe)
#   tui-record probe  .demo/code   # the app in its sandbox, to try a selector out
#   tui-record run    .demo/code   # record → cut → leak-check → render → poster
#
# `tui-record` ships with the `tui` plugin: uze add -m tui@ai
#
# It records in the sandbox the agent demos share
# (.demo/_shared/agents.yml) — one {root}, one {fixtures}, one remembered
# HEAD — against the shared `demo-app` fixture.
#
# A surface reads the checkout of the agent in front, and a space is bound
# to no directory, so the take starts one Claude Code agent and asks it
# nothing: the grant is used to open the harness, never to spend a turn.

extends:
  - ../_shared/agents.yml
  - ../_shared/macros.yml

video:
  title: uze — code
  # Rendered beside its spec as the take's proof; the site plays the cast.
  out: .demo/code/uze-code.gif
  poster: .demo/code/uze-code-poster.png
  publish:
    - from: cast
      to: web/public/casts/code.cast
  cast: '{root}/uze-code.cast'
  speed: 1.3                # slower than the hero: this one is read, not scanned
  wait_collapse: 1.0
  # The still the page shows first: a search over the whole checkout, its
  # results beside the file one of them opened. Named by what must be on
  # screen, so a re-cut cannot move it.
  poster_when: 'carries the runtime'
fixtures:
  - include: ../_shared/demo-app.yml
# What the video shows, in order. Edit this list first.
#
# Every `expect` is the narrowest thing on screen that only the state being
# proved draws: the path over the content, the file's own tab, the map's
# ranking. The strip reads `files  search  map` in every state, so none of
# those three words proves anything. What the agent changed is the review's
# to show (.demo/review): this surface is the checkout as it stands.
beats:
  - say: uze is open on a project, a real shell in the space
    pause: 1.0
  - use: launch-claude
    with: {say: 'an agent, in a checkout of its own', menu_pause: 0.4, pause: 0.8,
           typed: /tmp/demos/demo-app, completed: demo-app}
  - say: the files of that checkout, from the tab you stand in
    key: M-e
    expect: NO FILE SELECTED
    expect_timeout: 8
    pause: 1.6
  - say: a folder opens where it stands
    click: src
    in: pane
    expect: router\.rs
    expect_timeout: 6
    pause: 1.0
  - say: a file, coloured by its language
    click: router.rs
    in: pane
    expect: src/router\.rs
    expect_timeout: 6
    pause: 2.4
  - say: a document opens as a document
    click: AGENTS.md
    in: pane
    expect: Preview\s+Source
    expect_timeout: 6
    pause: 2.8
  - say: back to the code, and straight into typing
    click: router.rs
    in: pane
    expect: src/router\.rs
    expect_timeout: 6
    pause: 0.8
  - key: e
    pause: 0.4
  - type: '// routes are tried in order'
    # Enter too: the caret stands at the head of the line, and what follows it
    # would otherwise read as part of the comment.
    expect: unsaved
    expect_timeout: 4
    pause: 1.2
  - say: saved where it stands
    key: C-s
    refuse: unsaved
    pause: 1.0
  - key: Escape
    pause: 0.6
  - say: every file of the checkout, searched as you type
    key: C-f
    expect: Search
    expect_timeout: 6
    pause: 0.6
  - type: config
    submit: false
    expect: results in \d+ files
    expect_timeout: 8
    pause: 1.8
  - say: a result opens the file on its line
    key: [Down, Enter]
    expect: carries the runtime
    expect_timeout: 6
    pause: 2.6
  - say: and what the checkout is made of — where its lines are
    click: map
    in: strip
    expect: Ranking
    expect_timeout: 8
    pause: 3.4
  - say: and out — the cut stops here, before the screen blanks
    end: C-q
