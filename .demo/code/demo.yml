# The code surface, as a spec. This file is the source of truth: it says what the
# video shows, in order, and everything needed to make it again.
#
#   tui-record beats  .demo/code   # the script, as prose
#   tui-record seed   .demo/code   # build the sandbox (first run, or after a /tmp wipe)
#   tui-record probe  .demo/code   # the app in its sandbox, to try a selector out
#   tui-record run    .demo/code   # record → cut → leak-check → render → poster
#
# `tui-record` ships with the `tui` plugin: uze install -m tui@ai
#
# It records in the sandbox the agent demos share
# (.demo/_shared/agents.yml) — one {root}, one {fixtures}, one remembered
# HEAD — against the shared `demo-app` fixture.
#
# A surface reads the checkout of the agent in front, and a space is bound
# to no directory, so the take starts one Claude Code agent and asks it
# nothing: the grant is used to open the harness, never to spend a turn.

extends:
  - ../_shared/agents.yml
  - ../_shared/macros.yml

video:
  title: uze — code
  # Rendered beside its spec as the take's proof; the site plays the cast.
  out: .demo/code/uze-code.gif
  poster: .demo/code/uze-code-poster.png
  publish:
    - from: cast
      to: web/public/casts/code.cast
  cast: '{root}/uze-code.cast'
  speed: 1.3                # slower than the hero: this one is read, not scanned
  wait_collapse: 1.0
  # The still the page shows first: the diff, which is what this surface is
  # for — named by what must be on screen so a re-cut cannot move it. The nav
  # row's own `Changes` is on screen in every state, so it names the diff
  # header instead.
  poster_when: 'DIFF · src/router'
fixtures:
  - include: ../_shared/demo-app.yml
# What the video shows, in order. Edit this list first.
#
# Every `expect` here is the narrowest thing on screen that only the state
# being proved draws — the status bar's file name, the diff header, the map's
# own rendering row. The nav row reads `Files  Map  Changes` in every state,
# so none of those three words proves anything.
beats:
  - say: uze is open on a project, a real shell in the space
    pause: 1.0
  - use: launch-claude
    with: {say: 'an agent, in a checkout of its own', menu_pause: 0.4, pause: 0.8,
           typed: /tmp/demos/demo-app, completed: demo-app}
  # The dirty state is made in the agent's checkout, which exists only once
  # the agent above is placed. This is what its first pass leaves behind,
  # written by hand so the take costs no model turn and no waiting.
  - say: the agent has been editing its checkout
    shell: |
      cd {fixtures}/demo-app/.worktrees/*/ || exit 1
      python3 - <<'EDIT'
      import pathlib
      router = pathlib.Path("src/router.rs")
      router.write_text(router.read_text().replace(
          '        "/health" => health::health(),\n',
          '        "/health" => health::health(),\n        "/ping" => Response::text(200, "pong"),\n'))
      doc = pathlib.Path("docs/lifecycle.md")
      doc.write_text(doc.read_text().replace(
          "| `/health` | `health::health` |\n",
          "| `/health` | `health::health` |\n| `/ping` | inline, answers `pong` |\n"))
      pathlib.Path("src/ping.rs").write_text(
          '/// The smallest route there is: it answers and says nothing else.\n'
          'pub fn ping() -> Response {\n    Response::text(200, "pong")\n}\n')
      EDIT
    pause: 1.2
  # The timeline is open from the first frame, so there is nothing to click:
  # a click on its header would fold it. The wait is the proof instead — it
  # is read on a thread and answers through a channel, so the section can be
  # drawn a beat before it has rows.
  - say: what happened to this checkout, in the sidebar it already has
    wait: screen
    until: chore. initial commit
    timeout: 15
    pause: 2.6
  - say: and what has not landed yet — the changes, from the tab you stand in
    key: M-g
    expect: 'DIFF ·'
    expect_timeout: 10
    refuse: no changes
    pause: 3.2
  - say: another file, its diff coloured beside it
    click: router.rs
    in: pane
    expect: '"/ping" => Response'
    expect_timeout: 8
    pause: 3.2
  - say: the same file, now as the tree it sits in — one selection, two halves
    key: M-e
    expect: config\.toml
    expect_timeout: 8
    pause: 2.6
  - say: a document opens as a document
    click: AGENTS.md
    in: pane
    expect: '· preview'
    expect_timeout: 8
    pause: 3.2
  - say: and what the checkout is made of — where its lines are
    key: m
    expect: Ranking
    expect_timeout: 8
    pause: 3.4
  - say: and out — the cut stops here, before the screen blanks
    end: C-q
