# radar: the agents at a glance in the bar, and what they did in a drawer.
# plugins/radar/README.md.
#
#   tui-record run .demo/examples/radar
#
# The take spends one short Claude Code turn: the agent reads two files and
# answers in a line, so radar has something to watch.

extends: ../_base.yml

video:
  title: uze — the radar example
  out: .demo/examples/radar/radar.gif
  cast: '{root}/example-radar.cast'
  publish:
    - from: out
      to: web/public/examples/radar.gif
  poster_when: 'newest first'

beats:
  - use: open-and-enable
    with: {say: 'a project, and an agent on it', review_pause: 1.2}
  - say: in the bar, the agents at a glance
    wait: screen
    until: 'idle'
    timeout: 15
    pause: 1.2
  - say: the agent is asked something
    type: Read tasks.py and AGENTS.md, then say in one line what this project is.
    expect: '1 working'
    expect_timeout: 15
    pause: 1.0
  - say: while it works, the bar counts its turn
    wait: screen
    until: '1 working\s+\d+s'
    timeout: 20
    pause: 2.0
  - say: when the turn ends, the bar says so, with a sound
    wait: screen
    until: 'idle\s+\d+s'
    timeout: 180
    pause: 1.4
  - say: a click opens what the agent did, tool by tool
    click: idle
    in: pane
    occurrence: last
    expect: newest first
    expect_timeout: 8
    pause: 3.4
  - say: and out
    end: C-q
