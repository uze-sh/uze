# The sandbox the example plugins' demos record in: the agents' sandbox,
# with `demo-tasks` — the project `uze:try` makes — as the project, and the
# five examples declared and installed in it from this checkout's
# marketplace, the way a person trying uze gets them from uze-sh/uze.
#
# One spec per example, each published to web/public/examples/ for its
# README. Never run two at once: they share the sandbox and its tmux session.

extends:
  - ../_shared/agents.yml
  - ../_shared/macros.yml

video:
  # A README column, and an extension is a part of the screen: fewer
  # columns than the workspace's own demos, so the bar and a drawer read
  # without zooming. Still wide enough for the sidebar, a pane and a drawer.
  cols: 132
  rows: 34
  speed: 1.2
  wait_collapse: 1.0

sandbox:
  cwd: '{fixtures}/demo-tasks'
  env:
    # An extension refuses a checkout inside the temporary directory, on
    # purpose, and the fixtures live in /tmp so no username is on screen.
    # The sandbox's temporary directory is moved beside its home instead,
    # off screen: the refusal stands, and /tmp/demos is not under it.
    TMPDIR: '{root}/tmp'
  provision:
    - mkdir -p {root}/tmp
    # The project `uze:try` makes, by the same script, so the demos show
    # what a person trying uze sees: twelve weeks of commits for pulse and a
    # milestone in .planning/ for milestone. Made again on every seed, so its
    # dates stay relative to the day the demos are recorded; the base's reset
    # rewinds it between takes like the other fixtures.
    - rm -rf {fixtures}/demo-tasks && python3 -I {project}/plugins/uze/skills/try/demo.py {fixtures}/demo-tasks
    # This checkout's marketplace, copied into a Git repository out of
    # $HOME, the way the playground's worlds take it: a project can declare
    # a plugin from a marketplace it can name, never from the one built into
    # the binary, and the workspace offers only what a project declares.
    - |
      rm -rf {fixtures}/uze-market && mkdir -p {fixtures}/uze-market
      cp -R {project}/marketplace.json {project}/plugins {fixtures}/uze-market/
      git -C {fixtures}/uze-market init -q
      git -C {fixtures}/uze-market add -A
      git -C {fixtures}/uze-market -c commit.gpgsign=false commit -q -m 'uze marketplace'
      {project}/target/release/uze market list | grep -q '^ *uze ' || {project}/target/release/uze market add {fixtures}/uze-market >/dev/null
    # The examples, declared by the project and installed. The manifest is
    # committed, as a project would: the base's reset cleans every
    # untracked file before a take.
    - |
      cd {fixtures}/demo-tasks
      for plugin in milestone focus pulse; do
        {project}/target/release/uze install "$plugin@uze" >/dev/null
      done
      git add -A
      git -c commit.gpgsign=false -c user.name=ana -c user.email=ana@example.invalid \
        commit -q -m "chore: declare uze's example plugins"
      git rev-parse HEAD > {root}/base-demo-tasks.sha
  reset:
    # An agent works in the project itself, not in a checkout of its own,
    # and milestone's take has it execute a phase: the project goes back to
    # what the seed left before every take. Not a fixture the recorder
    # knows, so the rewind is this one.
    - git -C {fixtures}/demo-tasks reset -q --hard "$(cat {root}/base-demo-tasks.sha)"
    # Every take starts before the person consented to anything, so the
    # offer the workspace makes when an agent opens in the project is the
    # same on every take: what each extension may reach, then enabled. The
    # stores go too: focus's sessions and pulse's chosen day.
    - rm -f {home}/.uze/state/extensions.json
    - rm -rf {home}/.uze/state/extensions/store {home}/.uze/state/extensions/preferences
  patch_json:
    # Claude Code's first run in the project, pre-answered as the base does
    # for its own fixtures.
    - path: '{home}/.claude.json'
      merge: '{"projects": {"/tmp/demos/demo-tasks": {"hasTrustDialogAccepted": true, "allowedTools": []}}}'

macros:
  # An agent on demo-tasks, and the offer it brings: the project's examples,
  # reviewed and enabled in it. Opening the agent is what makes the offer:
  # the workspace offers a project's extensions where one of its agents
  # stands.
  open-and-enable:
    - use: launch-claude
      with: {say: '{say}', menu_pause: 0.4, pause: 0.6,
             typed: /tmp/demos/demo-tasks, completed: demo-tasks}
    - say: the project offers the extensions its plugins bring
      click: Review
      in: screen
      expect: Enable extensions in demo-tasks\?
      expect_timeout: 15
      pause: '{review_pause}'
    - say: each with what it may reach, enabled in this project
      click: Enable 5
      in: screen
      expect: Allow these programs to run, confined\?
      expect_timeout: 8
      pause: 1.2
    # pulse runs git: a program is asked about on a step of its own.
    - say: and the one that runs a program, confined
      click: Allow and enable
      in: screen
      expect: 5 extensions enabled
      expect_timeout: 10
      pause: 1.0
