# milestone: a milestone in .planning/, its next step one click from the
# agent. Published for plugins/milestone/README.md.
#
#   tui-record run .demo/examples/milestone
#
# The take spends one Claude Code turn: the agent executes phase 2 of the
# fixture's milestone, the way the drawer's button asks it to.

extends: ../_base.yml

video:
  title: uze — the milestone example
  out: .demo/examples/milestone/milestone.gif
  cast: '{root}/example-milestone.cast'
  publish:
    - from: out
      to: web/public/examples/milestone.gif
  poster_when: 'next step'

beats:
  - use: open-and-enable
    with: {say: 'a project with a milestone in .planning/, and an agent on it', review_pause: 1.4}
  - say: in the bar, the phases done and the next one
    wait: screen
    until: '1/4 · phase 2'
    timeout: 15
    pause: 1.2
  - say: a click opens the milestone, its next step at the top
    click: '1/4'
    in: pane
    offset: 1
    expect: next step
    expect_timeout: 10
    pause: 2.4
  - say: the next step is the agent's to take
    click: execute
    in: pane
    occurrence: last
    expect: 'Type this into agent 1'
    expect_timeout: 8
    pause: 1.8
  - say: what is typed into the agent is shown before it is
    click: Type it
    in: screen
    refuse: 'Type this into agent 1'
    expect: 'execute-phase'
    expect_timeout: 8
    pause: 1.0
  - say: the agent executes the phase's plan and records it
    wait: shell
    until: test -f /tmp/demos/demo-tasks/.planning/phases/02-keep-tasks-in-a-file/02-SUMMARY.md && grep -q '\[x\] \*\*Phase 2' /tmp/demos/demo-tasks/.planning/ROADMAP.md
    timeout: 300
  - say: and the milestone moves on to the next phase by itself
    wait: screen
    until: '2/4 · phase 3'
    timeout: 20
    pause: 3.0
  - say: and out
    end: C-q
