# gsd: GSD's milestone in .planning/, its next step one click from the
# agent and a plan's checkpoint answered over its pane. Published for
# plugins/gsd/README.md.
#
#   tui-record run .demo/examples/gsd
#
# The take spends Claude Code turns, and needs GSD installed for it in the
# sandbox (the plugin ships none): the fixture's milestone has phase 3
# executing and stopped at the checkpoint of plan 3-03; the band answers it
# and the agent runs the last wave.

extends: ../_base.yml

video:
  title: uze — the gsd example
  out: .demo/examples/gsd/gsd.gif
  cast: '{root}/example-gsd.cast'
  publish:
    - from: out
      to: web/public/examples/gsd.gif
  poster_when: 'waits for you above'

beats:
  - use: open-and-enable
    with: {say: 'a project with a GSD milestone in .planning/, and an agent on it', review_pause: 1.4}
  - say: in the bar, a plan that waits at its checkpoint
    wait: screen
    until: '3-03 waits for you'
    timeout: 15
    pause: 1.2
  - say: a click opens the phases, the one in front with its steps, waves and plans
    click: '3-03 waits for you'
    in: pane
    expect: waits for you above
    expect_timeout: 10
    pause: 2.8
  - say: the checkpoint is answered over the agent
    click: approved
    in: pane
    expect: 'Type this into agent 1'
    expect_timeout: 8
    pause: 1.4
  - say: what is typed into the agent is shown before it is
    click: Type it
    in: screen
    refuse: 'Type this into agent 1'
    expect: 'approved'
    expect_timeout: 8
    pause: 1.0
  - say: the agent runs the last wave, and the phase moves on to verify
    wait: screen
    until: '3 verify'
    timeout: 300
    pause: 3.0
  - say: and out
    end: C-q
