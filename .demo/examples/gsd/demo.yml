# gsd: GSD's milestone in .planning/, its next step one click from the
# agent and a plan's checkpoint answered over its pane. Published for
# plugins/gsd/README.md.
#
#   tui-record run .demo/examples/gsd
#
# The fixture's milestone has phase 3 executing and stopped at the
# checkpoint of plan 3-03; the band answers it and the take ends as the
# answer reaches the agent. Running the last wave would need GSD installed
# in the sandbox (the plugin ships none), and the base installs none.

extends: ../_base.yml

video:
  title: uze — the gsd plugin
  out: .demo/examples/gsd/gsd.gif
  cast: '{root}/example-gsd.cast'
  publish:
    - from: out
      to: web/public/examples/gsd.gif
  poster_when: '3-03 needs you'

beats:
  - use: open-and-enable
    with: {say: 'a project with a GSD milestone in .planning/, and an agent on it', review_pause: 1.4}
  - say: in the bar, a plan that waits at its checkpoint
    wait: screen
    until: '3-03 waits for you'
    timeout: 15
    pause: 1.2
  - say: a click opens the phases, the one in front with its steps, waves and plans
    click: '3-03 waits for you'
    in: pane
    expect: '3-03 needs you'
    expect_timeout: 10
    pause: 2.8
  - say: the checkpoint is answered over the agent
    click: approved
    in: pane
    expect: 'Type this into agent 1'
    expect_timeout: 8
    pause: 1.4
  - say: what is typed into the agent is shown before it is, and then sent
    # The take ends on the answer reaching the agent: the sandbox has no GSD
    # installed, so an agent asked to go on would have nothing to resume.
    click: Type it
    in: screen
    refuse: 'Type this into agent 1'
    expect: 'approved'
    expect_timeout: 8
    pause: 1.4
  - say: and out
    end: C-q
