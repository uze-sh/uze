# gsd: GSD's milestone in .planning/, its next step one click from the
# agent and a plan's checkpoint answered over its pane. Published for
# plugins/gsd/README.md.
#
#   tui-record run .demo/examples/gsd
#
# The take spends Claude Code turns, and needs GSD installed for it in the
# sandbox (the plugin ships none): the agent executes phase 2 of the
# fixture's milestone, the way the drawer's button asks it to, stops at the
# checkpoint of plan 2-02, and goes on once the band answers it.

extends: ../_base.yml

video:
  title: uze — the gsd example
  out: .demo/examples/gsd/gsd.gif
  cast: '{root}/example-gsd.cast'
  publish:
    - from: out
      to: web/public/examples/gsd.gif
  poster_when: 'execute phase 2'

beats:
  - use: open-and-enable
    with: {say: 'a project with a GSD milestone in .planning/, and an agent on it', review_pause: 1.4}
  - say: in the bar, the milestone and the step it is at
    wait: screen
    until: 'v1.0 · 2 execute'
    timeout: 15
    pause: 1.2
  - say: a click opens the phases, the one in front with its steps and waves
    click: 'v1.0'
    in: pane
    offset: 1
    expect: execute phase 2
    expect_timeout: 10
    pause: 2.4
  - say: the next step is the agent's to take
    click: execute phase 2
    in: pane
    occurrence: last
    expect: 'Type this into agent 1'
    expect_timeout: 8
    pause: 1.8
  - say: what is typed into the agent is shown before it is
    click: Type it
    in: screen
    refuse: 'Type this into agent 1'
    expect: 'execute-phase'
    expect_timeout: 8
    pause: 1.0
  - say: the agent runs the first wave, and stops at the checkpoint
    wait: screen
    until: 'Checkpoint 2-02'
    timeout: 300
    pause: 2.4
  - say: the checkpoint is answered over the agent
    click: approved
    in: pane
    expect: 'Type this into agent 1'
    expect_timeout: 8
    pause: 1.4
  - say: and the agent goes on
    click: Type it
    in: screen
    refuse: 'Type this into agent 1'
    expect: 'approved'
    expect_timeout: 8
    pause: 1.0
  - say: and the milestone moves on to the next phase by itself
    wait: screen
    until: 'v1.0 · 3 discuss'
    timeout: 300
    pause: 3.0
  - say: and out
    end: C-q
