# worklog: hours per working day, from an MCP server the agents can call
# too. Published for plugins/worklog/README.md.
#
#   tui-record run .demo/examples/worklog

extends: ../_base.yml

video:
  title: uze — the worklog example
  out: .demo/examples/worklog/worklog.gif
  cast: '{root}/example-worklog.cast'
  publish:
    - from: out
      to: web/public/examples/worklog.gif
  poster_when: 'GOAL 8H PER WORKING DAY'

beats:
  - use: open-and-enable
    with: {say: 'a project, and an agent on it', review_pause: 1.4}
  - say: in the bar, the month's hours, read from the plugin's MCP server
    wait: screen
    until: '\d+h of \d+h'
    timeout: 20
    pause: 1.4
  - say: a click opens the month, a card per working day
    click: 'h of'
    in: screen
    occurrence: last
    expect: GOAL 8H PER WORKING DAY
    expect_timeout: 15
    pause: 2.8
  - say: the latest week, with what went into each day
    click: week
    in: screen
    occurrence: last
    expect: 'mon \d+'
    expect_timeout: 8
    pause: 2.8
  - say: and out
    end: C-q
