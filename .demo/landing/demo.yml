# The landing page's hero, as a spec, performed by the real binary. It opens
# where the product does, in the workspace; the package manager runs in the
# space's own shell (a marketplace, one plugin, what each agent received);
# agents on three harnesses then work side by side, each in a worktree of its
# own; and the first is reviewed (spec, arch, code), commits through the
# plugin's own skill, and is delivered.
#
#   tui-record seed   .demo/landing   # build the sandbox (first run, or after a /tmp wipe)
#   tui-record probe  .demo/landing   # the shell in its sandbox, to try a selector out
#   tui-record run    .demo/landing   # record → cut → leak-check → render → poster
#
# Shares ~/.uzedemo with the other specs: never run two at once, they share
# one tmux session.

video:
  title: uze
  # The page plays the cut cast itself as text (web/public/uze-landing.cast,
  # copied from {root}/uze-landing.cast after a run), so the GIF is only for
  # checking a take and nothing is published from here. HeroRecording's
  # chapter times are read off the new cut.
  out: .demo/landing/uze-landing.gif
  poster: .demo/landing/uze-landing-poster.png
  # The marketplace on camera is the operator's own public one, and its
  # owner's name is also this machine's user and host: the scan's username
  # and hostname patterns match it, and nothing else does.
  allow:
    - hiukky/ai
  forbid:
    - Upstream request limit
    - Retry attempt
    - weekly limit
    - America/
  cast: '{root}/uze-landing.cast'
  # 140 columns keeps the text near the page's own body size at the width
  # the page frames it, and still fits inspect's four harness columns.
  cols: 140
  rows: 36
  speed: 1.2
  idle_limit: 3.5
  background: 0a0c0d        # crate::ui::BASE — a mismatch shows as a border
  # Twice the width the page shows it at, so a retina screen gets real pixels.
  font_size: 22
  font_family: FiraCode Nerd Font Mono,DejaVu Sans Mono
  font_dir: ~/.cache/nerd-fonts/v3.5.1/FiraCode
  wait_collapse: 1.5
  # The workspace with all three agents named and the code surface on the
  # finished one: the frame that says the most, for reduced motion.
  poster_when: 'DIFF ·'
  sidebar: 31
sandbox:
  root: ~/.uzedemo
  fixtures: /tmp/demos
  cwd: '{fixtures}/demo-api'
  # A shell, not the workspace: the first half of the story is the CLI.
  command:
    - '{home}/demoshell'
  shell: '{home}/demoshell'
  path:
    - '{home}/.uze/shims'
    - '{home}/.local/bin'
    - '{home}/bin'
    - '{home}/landing-bin'
    - /usr/local/bin
    - /usr/bin
    - /bin
  env:
    TZ: UTC
  binaries:
    - claude
    - agy
  author: Ada Lovelace
  author_email: ada@demo.dev
  link:
    - from: ~/.opencode/bin/opencode
      to: '{home}/bin/opencode'
    - from: ~/.claude/.credentials.json
      to: '{home}/.claude/.credentials.json'
      optional: true
    # OpenCode's grant is not a link: v2 keeps its providers outside
    # auth.json, and `opencode auth login` replaces the file it writes, so a
    # link here is overwritten by the login and then deletes it on the next
    # seed. The operator logs in once, inside the sandbox:
    #   HOME=~/.uzedemo/home ~/.opencode/bin/opencode auth login
    # and deleting ~/.uzedemo/home/.local/share/opencode ends it.
    # Granted for this video by the operator (2026-10-16): the third harness.
    - from: ~/.codex/auth.json
      to: '{home}/.codex/auth.json'
      optional: true
    # The two plugins that change what typing looks like, linked out of the
    # operator's zinit rather than loading zinit or their .zshrc, which
    # carries far more than a prompt. Their caches land in the sandbox HOME.
    - from: ~/.local/share/zinit/plugins/zdharma-continuum---fast-syntax-highlighting
      to: '{home}/.zsh/zdharma-continuum---fast-syntax-highlighting'
    - from: ~/.local/share/zinit/plugins/zsh-users---zsh-autosuggestions
      to: '{home}/.zsh/zsh-users---zsh-autosuggestions'
  copy:
    - from: ~/.config/opencode/opencode.json
      to: '{home}/.config/opencode/opencode.json'
    # The operator's own prompt, so the shell on camera looks like theirs.
    # Starship shows neither user nor host outside SSH, and the leak scan
    # stands behind that if a module ever does.
    - from: ~/.config/starship.toml
      to: '{home}/.config/starship.toml'
  provision:
    - test -x {home}/.local/bin/codex || curl -fsSL https://chatgpt.com/codex/install.sh | sh
    - rm -rf {home}/.uze
    - opencode service set port 49375
    - '{project}/target/release/uze setup claude codex opencode antigravity'
    - test -e {home}/.uze/shims/opencode || ln -s {project}/target/release/uze {home}/.uze/shims/opencode
    - '{project}/target/release/uze config icons nerd'
    # `uze` on the shell's PATH is this checkout's release build, so what the
    # video types is the bare command a reader would.
    - mkdir -p {home}/landing-bin && ln -sf {project}/target/release/uze {home}/landing-bin/uze
  reset:
    - |
      for pid in $(pgrep -x uze 2>/dev/null); do
        cmd=$(tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null) || continue
        case "$cmd" in *"terminal serve --root /tmp/demos/"*) kill -TERM "$pid" 2>/dev/null ;; esac
      done
    # Every take adds the marketplace and installs the plugin on camera, so
    # both come off the machine first: through uze, which knows what it
    # placed in each harness, never by deleting its directories.
    - env -i HOME={home} PATH={home}/.uze/shims:{home}/.local/bin:{home}/bin:/usr/bin:/bin {project}/target/release/uze market remove ai >/dev/null 2>&1 || true
    # Codex asks whether to trust a folder on its first launch there, and
    # its answer lives in its own config, which `uze setup` also writes to.
    - grep -qs '/tmp/demos/demo-api' {home}/.codex/config.toml || printf '\n[projects."/tmp/demos/demo-api"]\ntrust_level = "trusted"\n' >> {home}/.codex/config.toml
    # The rewind resets the tree, not the refs: every attempt's agents leave
    # a branch and a shelf (refs/uze/shelf/*) behind, and the workspace
    # restores a shelved agent, so the next take would open with them all.
    - |
      repo={fixtures}/demo-api
      git -C $repo worktree prune 2>/dev/null
      git -C $repo for-each-ref --format='%(refname)' refs/uze refs/heads | while read ref; do
        [ "$ref" = refs/heads/main ] || git -C $repo update-ref -d "$ref"
      done
    - git -C {fixtures}/demo-api clean -qfd -e .worktrees 2>/dev/null || true
    - |
      cat > {home}/.uze/state/layout.json <<'LAYOUT'
      {
        "sidebar": { "width": null },
        "workspace": { "timeline_collapsed": false, "timeline_rows": null, "collapsed_space_roots": [] },
        "management": { "route": "overview", "drawer_width": null,
                        "profile_columns_width": null, "collapsed_marketplaces": [] },
        "first_steps": { "collapsed": true, "closed": false, "taken": [] }
      }
      LAYOUT
    - env -i HOME={home} PATH=/usr/bin:/bin {project}/target/release/uze config theme set dark >/dev/null
  clear:
    - '{fixtures}/demo-api/.worktrees'
    - '{home}/.uze/state/terminal'
    - '{home}/.uze/state/projects'
    - '{runtime}/uze-runtime'
  write:
    - path: '{home}/demoshell'
      executable: true
      text: |
        #!/bin/sh
        exec /usr/bin/zsh
    # Written here, never copied: the prompt, the two plugins, and no history,
    # so an autosuggestion never offers what an earlier take typed.
    - path: '{home}/.zshrc'
      text: |
        HISTFILE=/dev/null
        SAVEHIST=0
        autoload -Uz compinit && compinit -d /tmp/demos/.zcompdump
        source ~/.zsh/zsh-users---zsh-autosuggestions/zsh-autosuggestions.zsh
        source ~/.zsh/zdharma-continuum---fast-syntax-highlighting/fast-syntax-highlighting.plugin.zsh
        eval "$(starship init zsh)"
    - path: '{home}/.zshenv'
      text: ''
    - path: '{home}/.gitconfig'
      text: "[user]\n\tname = Ada Lovelace\n\temail = ada@demo.dev\n[init]\n\tdefaultBranch = main\n"
    - path: '{home}/.claude.json'
      text: |
        {
          "hasCompletedOnboarding": true,
          "lastOnboardingVersion": "2.1.201",
          "installMethod": "native",
          "autoUpdates": false,
          "theme": "dark",
          "tipsHistory": { "powerup-onboarding": 99, "new-user-warmup": 99, "shift-enter": 99 },
          "tipLifetimeShownCounts": { "powerup-onboarding": 99 },
          "projects": {
            "/tmp/demos/demo-api": { "hasTrustDialogAccepted": true, "allowedTools": [] }
          }
        }
  patch_json:
    - path: '{home}/.claude/settings.json'
      merge: '{"permissions": {"defaultMode": "acceptEdits", "allow": ["Bash"]}}'
    # The model the operator's OpenCode Go login serves. Without that login
    # OpenCode falls back to a free model that refuses to run when the
    # workspace launches it, whatever this says.
    - path: '{home}/.config/opencode/opencode.json'
      merge: '{"model": "opencode-go/glm-5.3-flash"}'
# Its own fixture rather than demo-app: demo-app's remembered HEAD is shared
# with three other specs, and this one starts from a manifest that declares
# no plugin yet, so the install on camera is what writes them in.
fixtures:
  - name: demo-api
    commits:
      - message: 'chore: initial commit'
        days_ago: 9
        files:
          README.md: |
            # demo-api

            A small HTTP service.
      - message: 'feat(api): add the health route'
        days_ago: 7
        files:
          src/main.rs: |-
            mod config;
            mod health;
            mod router;

            fn main() {
                let port = config::port();
                println!("demo-api listening on {}", port);
                serve(port, router::route);
            }
          src/health.rs: |-
            pub fn health() -> Response {
                Response::json(200, r#"{"status":"ok"}"#)
            }
          src/router.rs: |-
            use crate::health;

            /// Every route this service answers, in the order they are tried.
            pub fn route(path: &str) -> Response {
                match path {
                    "/health" => health::health(),
                    _ => not_found(path),
                }
            }

            fn not_found(path: &str) -> Response {
                Response::text(404, format!("no route for {path}"))
            }
      - message: 'feat(config): read settings from config.toml'
        days_ago: 4
        files:
          config.toml: |-
            [app]
            port = 8080
            log = "info"
          src/config.rs: |-
            pub fn port() -> u16 {
                settings().app.port
            }
      # With the workspace's own section in it, committed the way a project
      # that uses the workspace has it: a worktree is cut from a commit, so
      # a section only the primary checkout holds never reaches an agent.
      - message: 'docs: add AGENTS.md'
        days_ago: 3
        files:
          AGENTS.md: |
            # AGENTS.md

            `demo-api` is a small HTTP service. `src/router.rs` maps a path to
            a response; `config.toml` carries the runtime settings.

            - Keep handlers total: every route returns a `Response`.
            - Conventional Commits for commit subjects.
            <!-- uze:begin project:worktree-policy/4a95691426ef9fb0 -->
            ## Concurrent work isolation

            This section is for an agent `uze workspace` launched. An agent started any other way can ignore it: nothing below applies to it, and the `uze agent work` commands it names refuse outside the workspace.

            - As soon as a user message gives the conversation a clear topic — normally the first message — make naming your work your first command, before reading a file, planning or editing: `uze agent work name <type>/<subject>`. Types this project accepts: `feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert`. The subject is ideally one or two words, never more than three, naming the intention, not a description of the task — `fix/branch-naming`, not `fix/correct-the-problem-with-agent-branch-names`. The command always updates your label. In a checkout of your own it also renames your branch; in the operator's checkout only your label changes. Work that reaches a commit still unnamed is named by UZE from that commit's subject. Name it again with the same command whenever the work turns out to be something else — the last name given is the one that stands. Invoke the command directly; do not merely say you will name the work.
            - An agent UZE isolated works in a checkout of its own under `.worktrees/<id>`, on branch `agent/<id>`. If your working directory is inside `.worktrees/`, you are already isolated; do not switch branches.
            - If your working directory is not inside `.worktrees/`, you are in the operator's own checkout, on the branch they are on: commit there, as you go, and never switch, reset, stash or clean it — the operator's uncommitted work is theirs. Nothing below about delivery applies to you; the branch keeps the name it has. Naming your work still applies here, first: it names your label, never their branch.
            - Commit your work on your own branch, as you go. Never commit to, merge into, rebase, or reset the target branch: delivery is UZE's — UZE rebases your branch onto the target, runs the project's checks, and fast-forwards the target itself; commit on your branch and stop.
            - If UZE tells you a rebase is paused in your checkout, resolve the conflicts preserving the intent of your change, run `git rebase --continue`, run the project's checks, and end your turn.
            - Before spawning parallel subagents that write files, give each its own checkout: `uze agent work split <topic>` prints the path of one cut from your current commit — hand that path to the subagent. When it is done, commit in both checkouts and run `uze agent work join <topic>` to bring its commits onto your branch; on a conflict, resolve it in the subagent's checkout, run `git rebase --continue` there, and join again. `uze agent work list` shows them. Never make a worktree with Git for this: UZE only knows the checkouts it made. An agent in the operator's checkout has no branch of its own to join into, and runs its subagents one after another instead.
            <!-- uze:end project:worktree-policy/4a95691426ef9fb0 -->
      # Only the workspace: the marketplace and the plugin are what the
      # video adds, and `cat agents.yaml` then shows both halves.
      - message: 'chore: declare the project in agents.yaml'
        days_ago: 2
        files:
          agents.yaml: |-
            workspace:
              worktree: always
              delivery: merge
              branch: conventional
              artifacts: docs/architecture
      - message: 'docs(architecture): draw the context and the containers'
        days_ago: 2
        files:
          docs/architecture/system-context.mmd: |
            ---
            title: System context
            ---
            C4Context
              Person(dev, "Developer", "Runs the service and reads its logs")
              System(app, "demo-api", "The HTTP service")
              System_Ext(lb, "Load balancer", "Routes traffic to live instances")
              Rel(dev, app, "Runs, reviews")
              Rel(lb, app, "Calls /health")
          docs/architecture/containers.mmd: |
            ---
            title: Containers
            ---
            C4Container
              System_Boundary(app, "demo-api") {
                Container(router, "Router", "Rust", "Maps a path to a response")
                Container(health, "Health", "Rust", "Answers /health")
                Container(config, "Config", "TOML", "Runtime settings")
              }
              Rel(router, health, "Dispatches /health")
              Rel(router, config, "Reads the port")
      - message: 'docs(openspec): plan rate limiting'
        days_ago: 1
        files:
          openspec/config.yaml: |
            schema: spec-driven
          openspec/specs/health/spec.md: |
            # health Specification

            ## Purpose
            Says whether the service can answer.

            ## Requirements
            ### Requirement: The service reports its health
            The service SHALL answer `GET /health` with `200` and
            `{"status":"ok"}` while it can serve requests.

            #### Scenario: A healthy service
            - **WHEN** `/health` is requested
            - **THEN** the answer SHALL be `200` with `{"status":"ok"}`
          openspec/changes/add-rate-limiting/proposal.md: |
            ## Why

            One noisy client can take the service down for everyone.

            ## What Changes

            - A token bucket per client address, refilled every second.
            - `429 Too Many Requests` with a `Retry-After` header.
          openspec/changes/add-rate-limiting/tasks.md: |
            ## 1. Limiter

            - [x] 1.1 Token bucket with a refill clock
            - [x] 1.2 One bucket per client address
            - [ ] 1.3 Read the budget from `config.toml`

            ## 2. Routing

            - [ ] 2.1 Ask the limiter before dispatching
            - [ ] 2.2 Answer `429` with `Retry-After`
beats:
  # ── 1. open the workspace ───────────────────────────────────────────────
  # From a bare shell, so the first thing on screen says this is a CLI; the
  # rest happens inside it.
  - say: a shell, in a project
    pause: 0.6
  - say: the workspace takes the screen, with a shell of its own
    type: uze workspace
    expect: demo-api
    expect_in: sidebar
    expect_timeout: 15
    pause: 1.4
  # ── 2. add a plugin ─────────────────────────────────────────────────────
  # Typed into the space's own shell pane: the package manager is the same
  # binary, reached from inside the screen it serves.
  - say: a marketplace is added, a Git repository of plugins
    type: uze market add hiukky/ai
    expect: 1 marketplace added
    expect_timeout: 60
    pause: 1.0
  - say: one plugin, installed once, for every agent
    type: uze git@ai
    expect: added to this project
    expect_timeout: 90
    pause: 1.0
  - say: what each agent received, in its own form
    type: uze inspect git
    expect: files in place
    expect_timeout: 15
    pause: 3.0
  # ── 3. agents side by side ──────────────────────────────────────────────
  - say: an agent on Claude Code, in a worktree of its own
    click: new
    in: sidebar
    expect: new agent
    expect_timeout: 6
    pause: 0.5
  - click: Claude Code
    in: screen
    offset: 2
    expect: Claude Code v
    expect_timeout: 25
    pause: 0.6
  # No commit asked for here: committing is what the plugin's skill does,
  # once the change is there.
  - type: add a /ping route to src/router.rs that answers pong, then commit it with the git:commit skill
    expect: 'esc to interrupt|for \d+s · done'
    expect_timeout: 120
    pause: 0.6
  - say: a second, on Codex
    click: new
    in: sidebar
    expect: new agent
    expect_timeout: 6
    pause: 0.5
  - click: Codex
    in: screen
    offset: 2
    expect: Ask Codex to do anything
    expect_timeout: 40
    pause: 0.6
  - type: cover GET /health with a test in src/health.rs
    pause: 0.8
  - say: a third, on OpenCode
    click: new
    in: sidebar
    expect: new agent
    expect_timeout: 6
    pause: 0.5
  - click: OpenCode
    in: screen
    offset: 2
    expect: ctrl\+p commands
    expect_timeout: 25
    pause: 0.6
  - type: add a Routes section to README.md listing every route in src/router.rs, without committing
    pause: 0.8
  # ── 4. review and deliver ───────────────────────────────────────────────
  # OpenCode's change is left uncommitted, so it is the one the code surface
  # has something to show for; Claude's is committed and is what gets
  # delivered, which ends the story where the work lands.
  - say: wait for OpenCode's edit, the only stretch the cut squeezes
    wait: shell
    until: grep -qs Routes /tmp/demos/demo-api/.worktrees/*/README.md
    timeout: 300
    settle: 2.0
    pause: 0.4
  - say: what the project plans
    click: spec
    in: strip
    expect: add-rate-limiting
    expect_in: pane
    expect_timeout: 10
    pause: 2.0
  - say: what it wrote down about itself, drawn in cells
    click: arch
    in: strip
    expect: system-context\.mmd
    expect_timeout: 10
    pause: 2.2
  - say: and what this agent changed, in its own worktree
    key: M-g
    expect: 'DIFF ·'
    expect_timeout: 10
    refuse: no changes
    pause: 3.0
  - click: code
    in: strip
    expect: ctrl\+p commands
    expect_timeout: 6
    pause: 0.4
  - wait: shell
    until: for w in /tmp/demos/demo-api/.worktrees/*; do git -C "$w" log -1 --format=%s 2>/dev/null; done | grep -qi ping
    timeout: 240
    settle: 1.5
    pause: 0.2
  # The commit is already proven above; this only selects the agent, and
  # Claude's footer is the one thing its pane always draws.
  - say: Claude committed through the plugin's own skill
    click: claude
    in: sidebar
    expect: shift\+tab to cycle
    expect_in: pane
    expect_timeout: 8
    pause: 2.4
  # Ready work is drawn as where it goes and how far ahead (`→ main ↑1`),
  # in glyphs, so it is delivered by its documented chord rather than aimed
  # at; the proof is the target itself carrying the commit.
  - say: ready work is delivered, rebased, checked and merged
    key: M-i
    pause: 0.4
  - wait: shell
    until: git -C /tmp/demos/demo-api log -1 --format=%s main | grep -qi ping
    timeout: 60
    settle: 1.5
    pause: 2.8
  - say: and out, the cut stops here, before the screen blanks
    end: C-q
