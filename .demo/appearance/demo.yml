# The appearance screen, as a spec.
#
#   tui-record probe  .demo/appearance
#   tui-record run    .demo/appearance
#
# It records in the workspace sandbox the other demos share
# (.demo/_shared/workspace.yml), against the shared `demo-app` fixture.

extends:
  - ../_shared/workspace.yml
  - ../_shared/macros.yml

video:
  title: uze — appearance
  out: .demo/appearance/uze-appearance.gif
  poster: .demo/appearance/uze-appearance-poster.png
  publish:
    - from: cast
      to: web/public/casts/appearance.cast
  cast: '{root}/uze-appearance.cast'
  speed: 1.3
  wait_collapse: 1.0
  poster_when: 'Drawing in dracula'
fixtures:
  - include: ../_shared/demo-app.yml
# What the video shows, in order. The status line under the content says what
# is drawn right now ("Drawing in …", "Drawing with the … glyphs"), so it is
# the proof of every choice: a card being highlighted proves nothing.
beats:
  - say: uze is open on a project
    pause: 1.2
  # The modal's tab row is drawn whichever screen it opens on, so it proves
  # the modal is open and nothing more; Settings is asked for next.
  - use: manage-open
    with: {say: 'appearance lives in management', pause: 0.8}
  # The tab is the first "Settings" on the screen: the tab row sits above
  # everything else the modal draws.
  - say: settings, where the themes are
    click: Settings
    in: screen
    expect: '╭ dracula'
    expect_timeout: 8
    pause: 1.2
  - say: one click draws everything in another theme
    click: dracula
    in: screen
    expect: Drawing in dracula
    expect_timeout: 8
    pause: 2.2
  - say: a light one
    click: tokyo-night-light
    in: screen
    expect: Drawing in tokyo-night-light
    expect_timeout: 8
    pause: 2.4
  - say: and another
    click: catppuccin-mocha
    in: screen
    expect: Drawing in catppuccin-mocha
    expect_timeout: 8
    pause: 1.8
  # Settings is one grid now, glyph sets in view below the themes, and a
  # click on a card moves the keyboard selection to it. So the keys walk on
  # from catppuccin-mocha, past the two tokyo-night cards, to the first glyph
  # set; the proof is the detail panel describing it, which nothing but that
  # selection draws (the cards' own captions are always on screen).
  - say: the icons are a separate choice — down to the glyph sets
    key: [Down, Down, Down]
    expect: 'What UZE ships with: Unicode'
    expect_timeout: 6
    pause: 0.8
  - say: plain ASCII, for a console with no Unicode
    click: ASCII — any font
    in: screen
    expect: Drawing with the ascii glyphs
    expect_timeout: 8
    pause: 2.0
  - say: the Nerd Font icons the docs recommend
    click: needs a Nerd Font
    in: screen
    expect: Drawing with the nerd glyphs
    expect_timeout: 8
    pause: 1.6
  - say: back to the workspace, drawn in what was chosen
    key: C-o
    refuse: manage\s+1 Marketplace\s+2 Integrations
    pause: 2.6
  - say: and out
    end: C-q
