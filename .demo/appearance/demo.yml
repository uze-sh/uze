# The appearance screen, as a spec — see .demo/code/demo.yml for how the sandbox
# is shared between the demos and why each sandbox key is what it is.
#
#   tui-record probe  .demo/appearance
#   tui-record run    .demo/appearance
#
video:
  title: uze — appearance
  out: .demo/appearance/uze-appearance.gif
  poster: .demo/appearance/uze-appearance-poster.png
  publish:
    - from: out
      to: web/public/uze-appearance.gif
    - from: poster
      to: web/public/uze-appearance-poster.png
  cast: '{root}/uze-appearance.cast'
  # The same grade as the code and architect demos, so the docs read as one set.
  cols: 152
  rows: 36
  speed: 1.3
  # Above the longest pause: the renderer caps a still screen at its idle
  # limit (1.5s by default), which halved every look the beats ask for.
  idle_limit: 3.5
  background: 0a0c0d        # crate::ui::BASE — a mismatch shows as a border
  font_size: 20
  font_family: FiraCode Nerd Font Mono,DejaVu Sans Mono
  font_dir: ~/.cache/nerd-fonts/v3.5.1/FiraCode
  wait_collapse: 1.0
  poster_when: 'Drawing in dracula'
  sidebar: 31
sandbox:
  root: ~/.uzedemo          # never on screen
  fixtures: /tmp/demos      # on screen: a path under $HOME carries a username
  cwd: '{fixtures}/demo-app'
  command:
    - '{project}/target/release/uze'
    - workspace
  shell: '{home}/demoshell'
  path:
    - '{home}/.uze/shims'
    - '{home}/.local/bin'
    - '{home}/bin'
    - /usr/local/bin
    - /usr/bin
    - /bin
  env:
    # UTC, so nothing the harness prints carries the operator's region. A
    # provider's own status line names the timezone it resets in, and the
    # leak scan looks for a username and a hostname — a place is neither.
    TZ: UTC
    PS1: '\[\e[38;5;114m\]demo-app\[\e[0m\] $ '
  # The nerd set, declared here rather than left to whatever the sandbox
  # home happens to hold: it is the set the docs recommend, and the one
  # the product is drawn for. It needs a patched font in the *renderer*
  # too — see `font_family` in `video`.
  provision:
    - '{project}/target/release/uze config icons nerd'
  author: Ada Lovelace
  author_email: ada@demo.dev
  reset:
    - |
      for pid in $(pgrep -x uze 2>/dev/null); do
        cmd=$(tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null) || continue
        case "$cmd" in *"terminal serve --root /tmp/demos/"*) kill -TERM "$pid" 2>/dev/null ;; esac
      done
    # `git reset --hard` — the fixture rewind before every attempt — reverts
    # tracked files and leaves untracked ones, so a file another spec's beats
    # wrote is still there, counted in this take's changes badge. `.worktrees`
    # is excluded: the rewind removes those itself, and pulling the directory
    # out from under Git first leaves metadata to prune.
    - git -C {fixtures}/demo-app clean -qfd -e .worktrees 2>/dev/null || true
    # A home with no layout is a first run: the first-steps list opens and
    # pushes the timeline off the sidebar. The video is of a project already
    # in use, so the list starts folded and the timeline open — written here
    # rather than left to whatever an earlier take folded or ticked, before
    # every attempt, since a take ticks steps and moves the manage route.
    - |
      cat > {home}/.uze/state/layout.json <<'LAYOUT'
      {
        "sidebar": { "width": null },
        "workspace": { "timeline_collapsed": false, "timeline_rows": null, "collapsed_space_roots": [] },
        "management": { "route": "overview", "drawer_width": null,
                        "profile_columns_width": null, "collapsed_marketplaces": [] },
        "first_steps": { "collapsed": true, "closed": false, "taken": [] }
      }
      LAYOUT
    # Every take starts from the look the other demos are recorded in, and
    # the last take's choice would otherwise open this one already changed.
    - env -i HOME={home} PATH=/usr/bin:/bin {project}/target/release/uze config theme set default >/dev/null
    - env -i HOME={home} PATH=/usr/bin:/bin {project}/target/release/uze config icons nerd >/dev/null
  clear:
    # The rewind removes the checkouts but leaves the directory that held
    # them, and the `clean` above deliberately spares it — so an empty
    # `.worktrees/` survives into the next take and shows up in the file
    # tree. `clear` runs after the removal and the prune, so it is the one
    # place this can be deleted without dangling Git's metadata.
    - '{fixtures}/demo-app/.worktrees'
    - '{home}/.uze/state/terminal'
    - '{runtime}/uze-runtime'
  write:
    - path: '{home}/demoshell'
      executable: true
      text: |
        #!/bin/sh
        exec /bin/bash --norc --noprofile
    - path: '{home}/.gitconfig'
      text: "[user]\n\tname = Ada Lovelace\n\temail = ada@demo.dev\n[init]\n\tdefaultBranch = main\n"
fixtures:
  - name: demo-app
    commits:
      - message: 'chore: initial commit'
        days_ago: 9
        files:
          README.md: '# demo-app'
      - message: 'feat(api): add the health endpoint'
        days_ago: 7
        files:
          src/main.rs: |-
            mod router;

            fn main() {
                let port = config::port();
                println!("demo-app listening on {}", port);
                serve(port, router::route);
            }
          src/health.rs: |-
            pub fn health() -> Response {
                Response::json(200, r#"{"status":"ok"}"#)
            }
      - message: 'docs: describe the request lifecycle'
        days_ago: 5
        files:
          docs/lifecycle.md: |
            # Request lifecycle

            A request arrives, the router looks its path up in the route
            table, and the handler it finds answers. A path the table does
            not carry falls through to the 404 handler.

            ## Routes

            | Path | Handler |
            | --- | --- |
            | `/health` | `health::health` |
      - message: 'feat(config): read settings from config.toml'
        days_ago: 4
        files:
          config.toml: |-
            [app]
            port = 8080
            log = "info"
          src/config.rs: |-
            pub fn port() -> u16 {
                settings().app.port
            }
      - message: 'docs: add AGENTS.md with the project''s conventions'
        days_ago: 3
        files:
          AGENTS.md: |
            # AGENTS.md

            Guidance for agentic tools working in this repository.

            ## What this is

            `demo-app` is a small HTTP service. `src/router.rs` maps a path to a
            response; `config.toml` carries the runtime settings.

            ## Conventions

            - Keep handlers total: every route returns a `Response`, never panics.
            - Document a new route in `docs/lifecycle.md` in the same change.
            - Conventional Commits for commit subjects.
      # The policy belongs in the manifest, not the lock: `agents.lock` is
      # derived, and an agent reading a worktree policy from it would be
      # reading something UZE regenerates. `worktree: always` is what puts
      # every agent this demo starts in a checkout of its own.
      - message: 'chore: declare the project''s environment in agents.yaml'
        days_ago: 2
        files:
          agents.yaml: |-
            workspace:
              worktree: always
              target: main
              delivery: handoff
              branch: conventional
              slots: 3

            artifacts:
              path: docs/architecture
      - message: 'docs(architecture): draw the context, the containers and the lifecycle'
        days_ago: 2
        files:
          docs/architecture/system-context.mmd: |
            ---
            title: System context
            ---
            C4Context
              Person(dev, "Developer", "Runs the service and reads its logs")
              System(app, "demo-app", "The HTTP service")
              System_Ext(site, "demo-web", "The marketing site")
              Rel(dev, app, "Runs, reviews")
              Rel(site, app, "Calls /health")
          docs/architecture/containers.mmd: |
            ---
            title: Containers
            ---
            C4Container
              System_Boundary(app, "demo-app") {
                Container(router, "Router", "Rust", "Maps a path to a response")
                Container(health, "Health", "Rust", "Answers /health")
                Container(config, "Config", "TOML", "Runtime settings")
              }
              Rel(router, health, "Dispatches /health")
              Rel(router, config, "Reads the port")
          docs/architecture/router-components.mmd: |
            ---
            title: Router components
            ---
            C4Component
              Container_Boundary(router, "Router") {
                Component(table, "Route table", "Rust", "Path to handler")
                Component(dispatch, "Dispatch", "Rust", "Calls the handler it found")
                Component(fallback, "Fallback", "Rust", "Answers 404")
              }
              Rel(table, dispatch, "Hands the match to")
              Rel(table, fallback, "No match")
          docs/architecture/request-lifecycle.mmd: |
            ---
            title: Request lifecycle
            ---
            flowchart LR
              req([Request]) --> router[Router]
              router --> known{Known route?}
              known -- yes --> handler[Handler]
              known -- no --> missing[404]
              handler --> res([Response])
              missing --> res
              click router href "src/router.rs"
              click handler href "src/health.rs"
      # A project that plans its changes with OpenSpec, so the spec surface
      # has something true to show: one change in flight, one finished and
      # never archived, one barely started, and one put away. The design of
      # rate limiting is not here on purpose — .demo/spec writes it
      # untracked, which is what makes that change the checkout's own.
      - message: 'docs(openspec): plan rate limiting, logging and config reload'
        days_ago: 1
        files:
          openspec/config.yaml: |
            schema: spec-driven
          openspec/specs/health/spec.md: |
            # health Specification

            ## Purpose
            Says whether the service can answer, for the load balancer and
            for whoever is on call.

            ## Requirements
            ### Requirement: The service reports its health
            The service SHALL answer `GET /health` with `200` and
            `{"status":"ok"}` while it can serve requests.

            #### Scenario: A healthy service
            - **WHEN** `/health` is requested
            - **THEN** the answer SHALL be `200` with `{"status":"ok"}`
          openspec/specs/routing/spec.md: |
            # routing Specification

            ## Purpose
            Maps a request's path to the handler that answers it.

            ## Requirements
            ### Requirement: An unknown path is answered, not dropped
            A path the route table does not carry SHALL be answered with `404`.

            #### Scenario: A path nobody routes
            - **WHEN** `/nope` is requested
            - **THEN** the answer SHALL be `404` naming the path
          openspec/changes/archive/2026-09-18-add-health-endpoint/proposal.md: |
            ## Why

            The load balancer has no way to tell a live instance from a
            dead one.

            ## What Changes

            - `GET /health` answers `200` while the service can serve.
          openspec/changes/archive/2026-09-18-add-health-endpoint/tasks.md: |
            ## 1. Endpoint

            - [x] 1.1 Add `health::health`
            - [x] 1.2 Route `/health` to it
          openspec/changes/add-rate-limiting/proposal.md: |
            ## Why

            One noisy client can take the service down for everyone.
            Requests need a budget per client, and a clear answer when it
            runs out.

            ## What Changes

            - A token bucket per client address, refilled every second.
            - `429 Too Many Requests` with a `Retry-After` header when the
              bucket is empty.
            - The budget is set in `config.toml`, under `[limits]`.

            ## Impact

            - `src/router.rs` asks the limiter before dispatching.
            - A new `src/limiter.rs`.
          openspec/changes/add-rate-limiting/tasks.md: |
            ## 1. Limiter

            - [x] 1.1 Token bucket with a refill clock
            - [x] 1.2 One bucket per client address
            - [x] 1.3 Read the budget from `config.toml`

            ## 2. Routing

            - [ ] 2.1 Ask the limiter before dispatching
            - [ ] 2.2 Answer `429` with `Retry-After`

            ## 3. Proof

            - [ ] 3.1 A burst past the budget is refused
            - [ ] 3.2 The bucket refills after a second
          openspec/changes/add-rate-limiting/specs/rate-limiting/spec.md: |
            ## ADDED Requirements

            ### Requirement: A client past its budget is told to wait
            The service SHALL answer `429` with a `Retry-After` header to a
            client that has spent its request budget.

            #### Scenario: A burst
            - **WHEN** a client sends more requests in a second than its
              budget allows
            - **THEN** the requests past the budget SHALL be answered `429`
          openspec/changes/add-request-logging/proposal.md: |
            ## Why

            Nobody can say what the service answered, or how slowly.

            ## What Changes

            - One line per request: method, path, status, duration.
          openspec/changes/add-request-logging/tasks.md: |
            ## 1. Logging

            - [x] 1.1 Log method, path and status
            - [x] 1.2 Log the duration
            - [x] 1.3 Respect the `log` level in `config.toml`
          openspec/changes/add-config-reload/proposal.md: |
            ## Why

            Changing a setting means restarting the service.

            ## What Changes

            - `SIGHUP` re-reads `config.toml` without dropping connections.
          openspec/changes/add-config-reload/tasks.md: |
            ## 1. Reload

            - [x] 1.1 Catch `SIGHUP`
            - [ ] 1.2 Re-read `config.toml`
            - [ ] 1.3 Swap the settings atomically
            - [ ] 1.4 Log what changed
      - message: 'fix(api): return 404 for an unknown route'
        days_ago: 1
        files:
          src/router.rs: |-
            use crate::{config, health};

            /// Every route this service answers, in the order they are tried.
            pub fn route(path: &str) -> Response {
                match path {
                    "/health" => health::health(),
                    _ => not_found(path),
                }
            }

            fn not_found(path: &str) -> Response {
                Response::text(404, format!("no route for {path}"))
            }
# What the video shows, in order. The status line under the content says what
# is drawn right now ("Drawing in …", "Drawing with the … glyphs"), so it is
# the proof of every choice: a card being highlighted proves nothing.
beats:
  - say: uze is open on a project
    pause: 1.2
  # The modal's tab row is drawn whichever screen it opens on, so it proves
  # the modal is open and nothing more; Settings is asked for next.
  - say: appearance lives in management
    key: C-o
    expect: manage\s+1 Marketplace\s+2 Integrations
    expect_timeout: 8
    pause: 0.8
  # The tab is the first "Settings" on the screen: the tab row sits above
  # everything else the modal draws.
  - say: settings, where the themes are
    click: Settings
    in: screen
    expect: '╭ dracula'
    expect_timeout: 8
    pause: 1.2
  - say: one click draws everything in another theme
    click: dracula
    in: screen
    expect: Drawing in dracula
    expect_timeout: 8
    pause: 2.2
  - say: a light one
    click: tokyo-night-light
    in: screen
    expect: Drawing in tokyo-night-light
    expect_timeout: 8
    pause: 2.4
  - say: and another
    click: catppuccin-mocha
    in: screen
    expect: Drawing in catppuccin-mocha
    expect_timeout: 8
    pause: 1.8
  # Settings is one grid now, glyph sets in view below the themes, and a
  # click on a card moves the keyboard selection to it. So the keys walk on
  # from catppuccin-mocha, past the two tokyo-night cards, to the first glyph
  # set; the proof is the detail panel describing it, which nothing but that
  # selection draws (the cards' own captions are always on screen).
  - say: the icons are a separate choice — down to the glyph sets
    key: [Down, Down, Down]
    expect: 'What UZE ships with: Unicode'
    expect_timeout: 6
    pause: 0.8
  - say: plain ASCII, for a console with no Unicode
    click: ASCII — any font
    in: screen
    expect: Drawing with the ascii glyphs
    expect_timeout: 8
    pause: 2.0
  - say: the Nerd Font icons the docs recommend
    click: needs a Nerd Font
    in: screen
    expect: Drawing with the nerd glyphs
    expect_timeout: 8
    pause: 1.6
  - say: back to the workspace, drawn in what was chosen
    key: C-o
    refuse: manage\s+1 Marketplace\s+2 Integrations
    pause: 2.6
  - say: and out
    end: C-q
