schema: adr-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Architecture documentation: the system architecture is drawn as Mermaid
  under docs/architecture/ (`.mmd`), which the workspace's own
  architect surface renders - `agents.yaml`'s `artifacts:` points there.
  This is the diagrammable source of truth, and it is load-bearing: the
  architect's tests draw the real files, so a diagram that stops routing is
  a red build. Validate with `uze agent artifacts check` (`make
  artifacts`), which draws every file in the directory, and
  `cargo test -p uze-extensions`, which draws the ones it names.

  Architecture decisions: the default is NO ADR - most changes, including
  most good ones, produce none. A significant, hard-to-reverse decision
  gets a numbered ADR under docs/adr/ (Nygard style: Context/Decision/
  Consequences) only at archive time (see `operations.archive` below),
  for a decision flagged in a change's design.md or recorded in its
  decisions.md that held up through implementation. The `adr` skill
  (from the `openspec@ai` plugin) records one outside that flow only when
  asked, or to backfill a decision predating this convention.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  specs:
    - >-
        Keep each requirement's body (the text before its first scenario)
        under 500 characters: the SHALL/MUST statement and at most a
        short why. Examples and edge cases go into scenarios, longer
        rationale into design.md, and two behaviors into two requirements.
        `openspec validate --strict` gates CI and fails on anything longer.
  design:
    - If this change adds/removes a container or component, adds an
      external dependency, or changes a relationship between them, update
      the Mermaid diagrams under docs/architecture/ as part of
      this change (not a follow-up), and note the update in this design
      doc.
    - If this change makes an architecturally significant, hard-to-reverse
      decision (new external dependency, irreversible technology choice,
      a pattern costly to change later), flag it under a `## Candidate
      ADRs` note (title + one-line why) - don't write the full ADR now,
      the design can still change while the change is in flight.
  tasks:
    - If design.md notes a required diagram update, include a task for it
      that runs `make artifacts` and `cargo test -p uze-extensions` before
      considering the change done.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  archive:
    guidance:
      # Block scalars on purpose: a plain multi-line list item that
      # contains ": " parses as an implicit key and the whole file is
      # rejected (and silently ignored by `openspec`).
      - >-
        Before moving the change, read BOTH sources of candidate
        decisions: design.md's `## Candidate ADRs` note (decisions known
        before implementing) and decisions.md (decisions taken during
        implementation), for decisions that are still architecturally
        significant AND hard to reverse now that implementation is done -
        a new external dependency, a technology/pattern choice with
        long-term consequences, a boundary expensive to move later. Judge
        by what was actually built, not what was originally flagged - if
        the approach changed along the way, a flagged decision may no
        longer apply, and an unflagged one may now qualify.
      - >-
        Every decisions.md entry must be resolved before the change is
        archived: `accepted` entries are the ADR candidates above,
        `overturned` ones must already have their follow-up work in
        tasks.md, and an entry still `pending` means the change is not
        ready to archive - say so and stop rather than archiving an
        unreviewed decision.
      - >-
        The default is no ADR, and that is the expected outcome: the
        archived change is already the record of what was done and why.
        A decision earns one only when all four are yes - reversing it is
        expensive, a real alternative was rejected, it binds code not yet
        written, and it is not already held by a test, by AGENTS.md or by
        a diagram. Naming, module layout, refactors, bug fixes,
        performance tuning, dependency version bumps, test strategy and UI
        arrangement never clear that bar however long they were debated;
        their reasoning belongs in the change's own design.md, which is
        archived with it. See docs/adr/README.md for the full rule.
      - >-
        For each qualifying decision, write one ADR: list existing
        `docs/adr/NNN-*.md` files, take the next sequential number
        (3 digits, zero-padded, continuing the existing sequence), and
        create `docs/adr/<NNN>-<kebab-title>.md` in Nygard style (Context
        is the situation forcing a choice, Decision is what was chosen
        stated firmly, Consequences covers what becomes easier/harder
        including trade-offs accepted), with a trailing line `Source
        change: openspec/changes/<change-name>/`. This file is the
        permanent record - it is not moved or deleted when the change is
        archived.
      - >-
        If nothing clears the bar, create no ADR files and say so. This is
        the common case, not a shortfall - do not reach for a record to
        make an archive feel complete.
      - >-
        Prefer extending an existing ADR over opening a number. When the
        decision continues, refines or adds a level to one already
        recorded, fold it into that record with a dated note under More
        Information, so one topic stays one ADR.
      - >-
        If a decision here reverses or supersedes an existing ADR, do not
        edit that file's Decision retroactively - write a new ADR instead
        and add `Status: Superseded by docs/adr/<NNN>-<new-title>.md` to
        the old file.
